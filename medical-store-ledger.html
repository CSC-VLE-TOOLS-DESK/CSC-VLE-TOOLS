function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dfmt(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'-'+m[2]+'-'+m[1]:(s||'')}
function addDays(s,n){var d=parseISO(s);if(!d)return s;d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){var d=parseISO(s);if(!d)return s;var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}

function normExp(s){s=String(s||'').trim();if(!s)return '';var m;
 if((m=/^(\d{4})-(\d{1,2})/.exec(s)))return m[1]+'-'+p2(+m[2]);
 if((m=/^(\d{1,2})[\/\-.](\d{4})$/.exec(s)))return m[2]+'-'+p2(+m[1]);

function expEnd(e){var m=/^(\d{4})-(\d{2})$/.exec(e||'');if(!m)return null;return iso(new Date(+m[1],+m[2],0))}

 var f=$(id+'_f'),t=$(id+'_t');return {from:f?f.value:'',to:t?t.value:''}}

 '<button class="sm" onclick="setP(\''+id+'\',\'m\');'+rerender+'">This month</button><button class="sm" onclick="setP(\''+id+'\',\'lm\');'+rerender+'">Last month</button><button class="sm" onclick="setP(\''+id+'\',\'q\');'+rerender+'">This quarter</button><button class="sm" onclick="setP(\''+id+'\',\'y\');'+rerender+'">This FY</button><button class="sm" onclick="setP(\''+id+'\',\'a\');'+rerender+'">All</button></div>'}

 if(k==='m'){a=iso(new Date(y,m,1));b=iso(new Date(y,m+1,0))}

 else if(k==='y'){var f=fy();a=f.from;b=f.to}
 $(id+'_f').value=a;$(id+'_t').value=b}

<script>
/* ===== Inventory ledger engine (Book shop / Medical store). Config comes from window.LEDGER_CFG ===== */
var CFG=window.LEDGER_CFG,MED=CFG.kind==='medical';
D=loadD({v:1,shop:{name:'',gstin:'',phone:'',addr:'',state:'Haryana',dl:''},set:{expDays:90,note:CFG.billNote||'',pre:CFG.pre||'INV'},items:[],purch:[],sales:[],exp:[],adj:[],pay:[],seq:1,sno:1});
var ECATS=['Transport – Freight inward','Transport – Delivery / outward','Courier / Parcel','Loading / Unloading','Vehicle fuel','Vehicle repair','Shop rent','Staff salary','Electricity','Packing material','Licence / Fees','Other'];
var TABS=[['dash','Dashboard'],['sell','Selling'],['buy','Buying'],['stock','Stock'],['exp','Transport & Expenses'],['party','Parties & Payments'],['gst','GST'],['pl','Profit'],['set','Settings']];
function nid(){return D.seq++}
function itemById(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i];return null}
function itemLabel(it){return it.name+(it.pack?' ['+it.pack+']':'')}
function findItem(txt){txt=String(txt||'').trim().toLowerCase();if(!txt)return null;var r=null;D.items.forEach(function(it){if(itemLabel(it).toLowerCase()===txt||(it.code&&it.code.toLowerCase()===txt))r=it});if(r)return r;var m=D.items.filter(function(it){return it.name.toLowerCase()===txt});return m.length===1?m[0]:null}
function lk(itemId,batch,exp){return itemId+'|'+String(batch||'').trim().toUpperCase()+'|'+(exp||'')}
/* ---- money helpers ---- */
function pLine(l){var t=N(l.qty)*N(l.rate)*(1-N(l.disc)/100),g=t*N(l.gst)/100;return {tax:R2(t),gst:R2(g),tot:R2(t+g)}}
function calcP(b){var o={tax:0,gst:0,fr:N(b.freight),frg:R2(N(b.freight)*N(b.fgst)/100),byRate:{}};b.lines.forEach(function(l){var x=pLine(l),k=N(l.gst),r=o.byRate[k]=o.byRate[k]||{tax:0,gst:0};o.tax+=x.tax;o.gst+=x.gst;r.tax+=x.tax;r.gst+=x.gst});o.tax=R2(o.tax);o.gst=R2(o.gst);o.total=R2(o.tax+o.gst+o.fr+o.frg);o.due=R2(o.total-N(b.paid));return o}
function sLine(l,incl){var g=N(l.gst),gross=N(l.qty)*N(l.price),net=gross*(1-N(l.disc)/100),t,gs;if(incl){t=net/(1+g/100);gs=net-t}else{t=net;gs=net*g/100}return {tax:R2(t),gst:R2(gs),tot:R2(t+gs)}}
function calcS(b){var o={tax:0,gst:0,byRate:{}};b.lines.forEach(function(l){var x=sLine(l,b.incl),k=N(l.gst),r=o.byRate[k]=o.byRate[k]||{tax:0,gst:0};o.tax+=x.tax;o.gst+=x.gst;r.tax+=x.tax;r.gst+=x.gst});o.tax=R2(o.tax);o.gst=R2(o.gst);o.grand=R2(o.tax+o.gst);o.total=Math.round(o.grand);o.round=R2(o.total-o.grand);o.due=R2(o.total-N(b.paid));return o}
function split(g,igst){return igst?{c:0,s:0,i:R2(g)}:{c:R2(g/2),s:R2(g-R2(g/2)),i:0}}
function expAmt(e){var b=N(e.amt),g=R2(b*N(e.gst)/100);return {base:b,gst:g,tot:R2(b+g)}}
/* ---- stock (derived from bills, so edit / delete is always safe) ---- */
function lots(exclSale){var L={};function g(k,id,batch,exp){return L[k]=L[k]||{key:k,itemId:id,batch:batch,exp:exp,mrp:0,inq:0,out:0,adj:0,cost:0,cq:0}}
 D.purch.forEach(function(b){b.lines.forEach(function(l){var k=lk(l.itemId,l.batch,l.exp),o=g(k,l.itemId,String(l.batch||'').trim().toUpperCase(),l.exp||''),q=N(l.qty)+N(l.free);o.inq+=q;o.cost+=pLine(l).tax;o.cq+=q;if(N(l.mrp))o.mrp=N(l.mrp)})});
 D.sales.forEach(function(s){if(s.id===exclSale)return;s.lines.forEach(function(l){var o=g(l.lot,+String(l.lot).split('|')[0],String(l.lot).split('|')[1]||'',String(l.lot).split('|')[2]||'');o.out+=N(l.qty)})});
 D.adj.forEach(function(a){var o=g(a.lot,+String(a.lot).split('|')[0],String(a.lot).split('|')[1]||'',String(a.lot).split('|')[2]||'');o.adj+=N(a.qty)});
 Object.keys(L).forEach(function(k){var o=L[k];o.qty=R2(o.inq-o.out-o.adj);o.unit=o.cq?o.cost/o.cq:0;o.value=R2(Math.max(0,o.qty)*o.unit)});return L}
function lotList(exclSale){var L=lots(exclSale);return Object.keys(L).map(function(k){return L[k]})}
function lotsOf(itemId,exclSale,keep){return lotList(exclSale).filter(function(o){return o.itemId===itemId&&(o.qty>0||o.key===keep)}).sort(function(a,b){return (a.exp||'9999')<(b.exp||'9999')?-1:1})}
function stockOf(itemId,LL){return R2(sum(LL.filter(function(o){return o.itemId===itemId}),function(o){return Math.max(0,o.qty)}))}
function expState(e){var end=expEnd(e);if(!end)return {k:'none',d:null};var d=daysTo(end);if(d<0)return {k:'exp',d:d};if(d<=30)return {k:'30',d:d};if(d<=N(D.set.expDays))return {k:'soon',d:d};return {k:'ok',d:d}}
