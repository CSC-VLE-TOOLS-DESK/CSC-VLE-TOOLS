  }
  const cat=val('im_cat'),prod=val('im_prod');if(!prod)return toast('Select product',1);if(!(p>0))return toast('Enter selling price',1);

  base.n=[base.brand,prod].filter(Boolean).join(' ')+(base.art?' ('+base.art+')':'');

  afterItems();save(true);toast(add+' added'+(upd?', '+upd+' stock updated':''));
  if(t.dataset.more){const keep=['im_cat','im_prod','im_grp','im_brand','im_art','im_mrp','im_p','im_b','im_m'];itemModalKeep();render()}else{closeModal();render()}

ACT.add=t=>{const it=itemById(t.dataset.id),c=C(),ex=c.lines.findIndex(l=>l.i===it.id);if(ex>-1){c.lines[ex].q=q3(num(c.lines[ex].q)+1);UI.sel=ex}else{c.lines.push({i:it.id,n:label(it),u:it.u,q:1,r:it.p,b:it.b});UI.sel=c.lines.length-1}save();renderCart()};

function cartTot(c){let sub=0;c.lines.forEach(l=>sub+=num(l.q)*num(l.r));sub=r2(sub);let d=c.discT==='pct'?sub*num(c.disc)/100:num(c.disc);d=r2(Math.min(Math.max(0,d),sub));const base=sub-d,gst=db.shop.gstRate>0?r2(base*db.shop.gstRate/100):0,grand=base+gst,tot=db.shop.round?Math.round(grand):r2(grand),ro=r2(tot-grand);let rec=c.mode==='Udhaar'?0:c.mode==='Part'?num(c.rec):tot;rec=Math.min(Math.max(0,rec),tot);return{sub,disc:d,gst,ro,tot,rec:r2(rec),due:r2(tot-rec)}}
function cartTotHtml(c){const T=cartTot(c);return '<table><tr><td>Subtotal</td><td class="n">'+inr(T.sub)+'</td></tr>'+(T.disc?'<tr><td>Discount</td><td class="n neg">-'+inr(T.disc)+'</td></tr>':'')+(T.gst?'<tr><td>GST '+db.shop.gstRate+'%</td><td class="n">'+inr(T.gst)+'</td></tr>':'')+(T.ro?'<tr><td>Round off</td><td class="n">'+inr(T.ro)+'</td></tr>':'')+'<tr class="tot"><td>TOTAL</td><td class="n" style="font-size:18px">'+inr(T.tot)+'</td></tr>'+(T.due>0?'<tr><td>Received</td><td class="n">'+inr(T.rec)+'</td></tr><tr><td><b>Balance (udhaar)</b></td><td class="n neg"><b>'+inr(T.due)+'</b></td></tr>':'')+'</table>'}
function cartHtml(cuts){
  const c=C(),T=cartTot(c);
  let h='<h2>🧾 Bill</h2>';
  if(!c.lines.length)h+='<div class="empty">Tap an item on the left to add it.</div>';

   +'<label>Discount<div class="row" style="flex-wrap:nowrap"><input type="number" min="0" step="any" value="'+esc(c.disc)+'" data-c="cdisc"><select data-c="cdt" style="width:70px"><option value="amt"'+(c.discT==='amt'?' selected':'')+'>₹</option><option value="pct"'+(c.discT==='pct'?' selected':'')+'>%</option></select></div></label>'
   +'<label>Payment<select data-c="cmode">'+opts(['Cash','UPI','Card','Udhaar','Part'].map(x=>[x,x==='Udhaar'?'Udhaar (credit)':x==='Part'?'Part payment':x]),c.mode)+'</select></label>'
   +(c.mode==='Part'?'<label>Received now ₹<input type="number" min="0" step="any" value="'+esc(c.rec)+'" data-c="crec"></label><label>Paid by<select data-c="cpm">'+opts(['Cash','UPI','Card'],c.pm)+'</select></label>':'')
   +'<label class="wide">Note<input value="'+esc(c.note)+'" data-i="cnote" placeholder="optional"></label></div>';
  h+='<div id="ctot">'+cartTotHtml(c)+'</div>';
  h+='<div class="mf"><button class="btn pri" data-a="saveBill" data-p="1">💾 Save &amp; Print</button><button class="btn" data-a="saveBill">Save</button></div>';

}

function commitBill(c,d,t){
  const T=cartTot(c),cu=c.cust?custById(c.cust):null;
  const b={id:uid(),no:++db.billno,d:d||tod(),t:t||nowT(),cust:c.cust||'',cname:cu?cu.n:'',phone:cu?cu.ph:'',lines:c.lines.map(l=>({i:l.i,n:l.n,u:l.u,q:num(l.q),r:num(l.r),b:num(l.b)})),sub:T.sub,disc:T.disc,gst:T.gst,ro:T.ro,tot:T.tot,mode:T.due>0?(T.rec>0?'Part':'Udhaar'):(c.mode==='Part'?c.pm:c.mode),pm:c.mode==='Part'?c.pm:c.mode,rec:T.rec,due:T.due,note:c.note||''};
  b.lines.forEach(l=>{const it=itemById(l.i);if(it)it.s=q3(it.s-l.q)});db.bills.push(b);return b;
}
ACT.saveBill=t=>{
  const c=C();if(!c.lines.length)return toast('Add items first',1);
  const bad=c.lines.find(l=>!(num(l.q)>0));if(bad)return toast('Enter quantity for '+bad.n,1);
  const T=cartTot(c);if(T.tot<=0&&!confirm('Bill total is ₹0. Save anyway?'))return;
  if(T.due>0&&!c.cust)return toast('Select a customer (or add new) for Udhaar / part payment',1);
  const short=c.lines.filter(l=>{const it=itemById(l.i);return it&&num(l.q)>it.s});
  if(short.length&&!confirm('Stock is less than the quantity for:\n'+short.map(l=>'• '+l.n).join('\n')+'\n\nSave anyway? (stock will go negative)'))return;
  const b=commitBill(c);db.cart=null;UI.sel=-1;save(true);render();
  billModal(b.id);if(t.dataset.p)setTimeout(()=>ACT.printBill({dataset:{id:b.id}}),150);
};

  +'<table style="margin-top:6px;width:'+(th?'100%':'55%')+';margin-left:auto"><tr><td>Subtotal</td><td style="text-align:right">'+inr(b.sub)+'</td></tr>'+(b.disc?'<tr><td>Discount</td><td style="text-align:right">-'+inr(b.disc)+'</td></tr>':'')+(b.gst?'<tr><td>GST</td><td style="text-align:right">'+inr(b.gst)+'</td></tr>':'')+(b.ro?'<tr><td>Round off</td><td style="text-align:right">'+inr(b.ro)+'</td></tr>':'')+'<tr><td><b>TOTAL</b></td><td style="text-align:right"><b>'+inr(b.tot)+'</b></td></tr><tr><td>Paid ('+esc(b.mode)+')</td><td style="text-align:right">'+inr(b.rec)+'</td></tr>'+(b.due>0?'<tr><td><b>Balance due</b></td><td style="text-align:right"><b>'+inr(b.due)+'</b></td></tr>':'')+'</table>'
  +(rets.length?'<div style="margin-top:6px"><b>Returned:</b> '+rets.map(r=>fd(r.d)+' '+inr(r.amt)).join(', ')+'</div>':'')+(b.note?'<div style="margin-top:4px">Note: '+esc(b.note)+'</div>':'')+(s.upi?'<div class="c" style="margin-top:6px">UPI: '+esc(s.upi)+'</div>':'')+'<div class="c" style="margin-top:8px">'+esc(s.foot||'')+'</div></div>';

ACT.retGo=t=>{

  if(err)return toast(err,1);if(!ls.length)return toast('Enter a return quantity',1);

function stmt(kind,id){
  const isC=kind==='c',p=isC?custById(id):supById(id),ev=[];
  if(isC){db.bills.filter(b=>b.cust===id).forEach(b=>ev.push({d:b.d,k:'Bill '+billNo(b),dr:b.due,cr:0,s:b.no}));db.cpay.filter(x=>x.cust===id).forEach(x=>ev.push({d:x.d,k:'Received ('+x.mode+')'+(x.note?' – '+x.note:''),dr:0,cr:x.amt,s:0}));db.ret.filter(r=>r.cust===id&&r.how==='acct').forEach(r=>ev.push({d:r.d,k:'Return '+r.no,dr:0,cr:r.amt,s:0}))}
  else{db.purch.filter(x=>x.sup===id).forEach(x=>ev.push({d:x.d,k:'Purchase '+(x.inv||''),dr:x.due,cr:0,s:0}));db.spay.filter(x=>x.sup===id).forEach(x=>ev.push({d:x.d,k:'Paid ('+x.mode+')'+(x.note?' – '+x.note:''),dr:0,cr:x.amt,s:0}))}
  ev.sort((a,b)=>a.d.localeCompare(b.d)||a.s-b.s);let bal=0;
  return {p,html:'<div class="tw"><table><tr><th>Date</th><th>Details</th><th class="n">'+(isC?'Debit (udhaar)':'Purchase due')+'</th><th class="n">'+(isC?'Credit (received)':'Paid')+'</th><th class="n">Balance</th></tr>'+ev.map(e=>{bal=r2(bal+e.dr-e.cr);return '<tr><td>'+fd(e.d)+'</td><td>'+esc(e.k)+'</td><td class="n">'+(e.dr?inr(e.dr):'')+'</td><td class="n">'+(e.cr?inr(e.cr):'')+'</td><td class="n"><b>'+inr(bal)+'</b></td></tr>'}).join('')+'</table></div>',bal};

function bLive(n){const l=B().lines[n],e=$('#ba'+n);if(e)e.textContent=inr(num(l.q)*num(l.r));const p=$('#btotp');if(p)p.innerHTML=bTotHtml()}
function bTot(){const b=B();let t=0;b.lines.forEach(l=>t+=num(l.q)*num(l.r));t=r2(t);const paid=b.paid===''?t:Math.min(num(b.paid),t);return{tot:t,paid:r2(paid),due:r2(t-paid)}}

  const b=B();if(!b.lines.length)return toast('Add items first',1);if(b.lines.find(l=>!(num(l.q)>0)))return toast('Enter quantity for every item',1);

  const p={id:uid(),d:b.d,sup:b.sup,sname:b.sup?(supById(b.sup)||{}).n:'',inv:b.inv,lines:b.lines.map(l=>({i:l.i,n:l.n,u:l.u,q:num(l.q),r:num(l.r),mpt:num(l.mpt)})),tot:T.tot,paid:T.paid,due:T.due,pm:b.pm};

};

/* ================= REPORTS ================= */
function range(){const t=tod(),r=UI.rep.r;let a=t,b=t;
  if(r==='yest'){a=b=addDays(t,-1)}else if(r==='week'){a=addDays(t,-6)}else if(r==='month'){a=t.slice(0,7)+'-01'}else if(r==='lmonth'){const d=new Date(t.slice(0,7)+'-01T00:00:00');d.setDate(0);b=dstr(d);a=b.slice(0,7)+'-01'}else if(r==='year'){a=t.slice(0,4)+'-01-01'}else if(r==='fy'){const y=+t.slice(0,4),m=+t.slice(5,7);const sy=m>=4?y:y-1;a=sy+'-04-01';b=(sy+1)+'-03-31'}else if(r==='cust'){a=UI.rep.from||t;b=UI.rep.to||t}
  return[a,b]}
function repData(a,b){
  const bl=billsIn(a,b),rt=db.ret.filter(r=>r.d>=a&&r.d<=b),pu=db.purch.filter(p=>p.d>=a&&p.d<=b),ex=db.exp.filter(e=>e.d>=a&&e.d<=b),ls=db.loss.filter(l=>l.d>=a&&l.d<=b),sp=db.spaid.filter(p=>p.d>=a&&p.d<=b);
  const sales=r2(bl.reduce((s,x)=>s+x.tot,0)-rt.reduce((s,x)=>s+x.amt,0)),disc=bl.reduce((s,x)=>s+x.disc,0),gp=r2(bl.reduce((s,x)=>s+lineProfit(x),0)-rt.reduce((s,x)=>s+x.profit,0));
  const o={bl,rt,sales,disc,gp,pur:pu.reduce((s,x)=>s+x.tot,0),exp:ex.reduce((s,x)=>s+x.amt,0),loss:ls.reduce((s,x)=>s+x.amt,0),sal:sp.reduce((s,x)=>s+x.amt,0),ret:rt.reduce((s,x)=>s+x.amt,0)};
  o.net=r2(gp-o.exp-o.loss-o.sal);
  const mode={};bl.forEach(x=>{mode[x.pm]=(mode[x.pm]||0)+x.rec});db.cpay.filter(p=>p.d>=a&&p.d<=b).forEach(p=>mode[p.mode]=(mode[p.mode]||0)+p.amt);o.mode=mode;
  const cat={},top={};let mtr=0;bl.forEach(x=>x.lines.forEach(l=>{const it=itemById(l.i),c=it?it.cat:'Other';cat[c]=cat[c]||{q:0,a:0};cat[c].q+=l.q;cat[c].a+=l.q*l.r;const k=l.n;top[k]=top[k]||{q:0,a:0,u:l.u};top[k].q+=l.q;top[k].a+=l.q*l.r;if(l.u==='m')mtr+=l.q}));o.cat=cat;o.top=top;o.mtr=mtr;
  const span=(new Date(b)-new Date(a))/864e5,grp=span>92?x=>x.slice(0,7):x=>x,rows={};bl.forEach(x=>{const k=grp(x.d);rows[k]=rows[k]||{n:0,s:0,d:0,p:0};rows[k].n++;rows[k].s+=x.tot;rows[k].d+=x.disc;rows[k].p+=lineProfit(x)});o.rows=rows;o.grpM=span>92;
  return o;
}
R.rep=()=>{
  const r=UI.rep.r,[a,b]=range(),o=repData(a,b);
  const rs=[['today','Today'],['yest','Yesterday'],['week','Last 7 days'],['month','This month'],['lmonth','Last month'],['year','This year'],['fy','Financial year'],['cust','Custom']];
  let h='<div class="box"><div class="row"><select data-c="rr" style="max-width:190px">'+opts(rs,r)+'</select>'+(r==='cust'?'<input type="date" data-c="rfrom" value="'+a+'" style="max-width:160px"><input type="date" data-c="rto" value="'+b+'" style="max-width:160px">':'<span class="mut">'+fd(a)+' – '+fd(b)+'</span>')+'<span class="sp"></span><button class="btn" data-a="repPrint">🖨 Print</button><button class="btn" data-a="csvBills">⬇ Bills CSV</button></div></div><div id="repbody">'+repBody(o,a,b)+'</div>';
  return h;
};
function repBody(o,a,b){
  const cards=[['Net sales',inr(o.sales),''],['Gross profit (est.)',inr(o.gp),o.gp<0?'r':''],['Expenses',inr(o.exp),'o'],['Salary paid',inr(o.sal),'o'],['Stock loss',inr(o.loss),'o'],['Net profit (est.)',inr(o.net),o.net<0?'r':'b'],['Purchases',inr(o.pur),''],['Discount given',inr(o.disc),''],['Returns',inr(o.ret),'']];
  let h='<div class="cards">'+cards.map(c=>'<div class="card '+c[2]+'"><small>'+c[0]+'</small><b>'+c[1]+'</b></div>').join('')+'</div>';
  if(IS)h+='<div class="box"><b>Total cloth sold in meters: '+q3(o.mtr)+' m</b></div>';
  h+='<div class="box"><h2>Money received by mode</h2><div class="row">'+(Object.keys(o.mode).length?Object.keys(o.mode).map(k=>'<span class="chip">'+esc(k)+': '+inr(o.mode[k])+'</span>').join(''):'<span class="mut">—</span>')+'</div></div>';
  const keys=Object.keys(o.rows).sort();
  h+='<div class="box"><h2>'+(o.grpM?'Month-wise':'Day-wise')+' sale</h2>'+(keys.length?'<div class="tw"><table><tr><th>'+(o.grpM?'Month':'Date')+'</th><th class="n">Bills</th><th class="n">Sale</th><th class="n">Discount</th><th class="n">Profit (est.)</th></tr>'+keys.map(k=>'<tr><td>'+(o.grpM?monthName(k):fd(k))+'</td><td class="n">'+o.rows[k].n+'</td><td class="n">'+inr(o.rows[k].s)+'</td><td class="n">'+inr(o.rows[k].d)+'</td><td class="n">'+inr(o.rows[k].p)+'</td></tr>').join('')+'<tr class="tot"><td>Total</td><td class="n">'+o.bl.length+'</td><td class="n">'+inr(o.bl.reduce((s,x)=>s+x.tot,0))+'</td><td class="n">'+inr(o.disc)+'</td><td class="n">'+inr(keys.reduce((s,k)=>s+o.rows[k].p,0))+'</td></tr></table></div>':'<div class="empty">No sales in this period.</div>')+'</div>';
  const ck=Object.keys(o.cat).sort((x,y)=>o.cat[y].a-o.cat[x].a);
  h+='<div class="bgrid"><div class="box"><h2>Category-wise sale</h2>'+(ck.length?'<div class="tw"><table><tr><th>Category</th><th class="n">Qty</th><th class="n">Amount</th></tr>'+ck.map(k=>'<tr><td>'+esc(k)+'</td><td class="n">'+q3(o.cat[k].q)+'</td><td class="n">'+inr(o.cat[k].a)+'</td></tr>').join('')+'</table></div>':'<div class="empty">—</div>')+'</div>';
  const tk=Object.keys(o.top).sort((x,y)=>o.top[y].a-o.top[x].a).slice(0,12);
  h+='<div class="box"><h2>Top selling items</h2>'+(tk.length?'<div class="tw"><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Amount</th></tr>'+tk.map(k=>'<tr><td>'+esc(k)+'</td><td class="n">'+fq(o.top[k].q,o.top[k].u)+'</td><td class="n">'+inr(o.top[k].a)+'</td></tr>').join('')+'</table></div>':'<div class="empty">—</div>')+'</div></div>';
  return h;
}
CHG.rr=t=>{UI.rep.r=t.value;render()};CHG.rfrom=t=>{UI.rep.from=t.value;render()};CHG.rto=t=>{UI.rep.to=t.value;render()};
ACT.repPrint=()=>{const[a,b]=range();printHTML('<div class="pb"><h1>'+esc(db.shop.name)+'</h1><div class="c">Report: '+fd(a)+' to '+fd(b)+'</div>'+repBody(repData(a,b),a,b)+'</div>','A4')};
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type||'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvC=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
ACT.csvItems=()=>{const h=['Name','Category','Product/Fabric','Colour','Size/Width','Brand','Unit','Stock','Cost','Price','Min','Rack'];dl('items-'+tod()+'.csv','\ufeff'+[h.map(csvC).join(',')].concat(db.items.map(i=>[i.n,i.cat,i.prod||i.fab,i.col,IS?i.wid:i.size,i.brand,i.u,i.s,i.b,i.p,i.m,i.rack].map(csvC).join(','))).join('\n'))};
ACT.csvBills=()=>{const a=UI.tab==='rep'?range():[UI.bq.from||addDays(tod(),-30),UI.bq.to||tod()];const h=['Bill','Date','Customer','Items','Subtotal','Discount','GST','Total','Received','Due','Mode'];dl('bills-'+a[0]+'-to-'+a[1]+'.csv','\ufeff'+[h.map(csvC).join(',')].concat(billsIn(a[0],a[1]).map(b=>[billNo(b),b.d,b.cname,b.lines.map(l=>l.n+' x'+l.q).join('; '),b.sub,b.disc,b.gst,b.tot,b.rec,b.due,b.mode].map(csvC).join(','))).join('\n'))};

/* ================= SETTINGS / BACKUP ================= */
ACT.settings=()=>{const s=db.shop;modal('Settings','<div class="form"><label class="wide">Shop name<input id="s_n" value="'+esc(s.name)+'"></label><label class="wide">Address<input id="s_a" value="'+esc(s.addr)+'"></label><label>Phone<input id="s_p" value="'+esc(s.phone)+'"></label><label>GSTIN (optional)<input id="s_g" value="'+esc(s.gst)+'"></label><label>UPI ID (printed on bill)<input id="s_u" value="'+esc(s.upi)+'"></label><label>Bill prefix<input id="s_pre" value="'+esc(s.pre)+'" maxlength="6"></label><label>Print paper<select id="s_paper">'+opts([['A4','A4 sheet'],['80','Thermal 80 mm'],['58','Thermal 58 mm']],s.paper)+'</select></label><label>GST % added on bill (0 = none)<input id="s_gr" type="number" min="0" step="any" value="'+(s.gstRate||0)+'"></label><label>Round off total<select id="s_r">'+opts([['1','Yes (nearest rupee)'],['0','No']],String(s.round))+'</select></label><label class="wide">Bill footer<input id="s_f" value="'+esc(s.foot)+'"></label></div><div class="mf"><button class="btn dng" data-a="wipe">Erase all data</button><button class="btn" data-a="sample">Load sample data</button><button class="btn pri" data-a="setSave">Save settings</button></div>',true)};
ACT.setSave=()=>{const s=db.shop;s.name=val('s_n').trim()||CFG.defName;s.addr=val('s_a');s.phone=val('s_p');s.gst=val('s_g');s.upi=val('s_u');s.pre=(val('s_pre').trim()||CFG.pre).toUpperCase();s.paper=val('s_paper');s.gstRate=num(val('s_gr'));s.round=+val('s_r');s.foot=val('s_f');save(true);closeModal();render();toast('Settings saved')};
ACT.wipe=()=>{if(!confirm('Erase ALL data in this ledger? This cannot be undone. Take a Backup first.'))return;if(!confirm('Really erase everything?'))return;db=blank();save(true);closeModal();UI.buy=null;render();toast('All data erased')};
ACT.backup=()=>{db.lastBackup=new Date().toISOString();save(true);dl(CFG.key+'-backup-'+tod()+'.json',JSON.stringify({app:CFG.key,saved:db.lastBackup,data:db}),'application/json');toast('Backup downloaded. Keep the file safe.');if(UI.tab==='dash')render()};
ACT.restore=()=>$('#fjson').click();
$('#fjson').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(!d||!Array.isArray(d.items)||!Array.isArray(d.bills))throw new Error('This is not a backup of this ledger');if(!confirm('Restore this backup? It replaces the data now in this ledger.'))return;db=d;const b=blank();for(const k in b)if(db[k]===undefined)db[k]=b[k];for(const k in b.shop)if(db.shop[k]===undefined)db.shop[k]=b.shop[k];save(true);UI.buy=null;render();toast('Backup restored')}catch(er){toast('Restore failed: '+er.message,1)}};r.readAsText(f)});

/* ================= SAMPLE DATA ================= */
ACT.sample=()=>{
  if(db.items.length&&!confirm('Sample data will be ADDED to your current data. Continue?'))return;
  const t=tod(),S=CFG.sample;
  S.items.forEach(x=>db.items.push(Object.assign({id:uid(),s:0,m:5,rack:'',brand:'',mrp:0},x)));
  S.cust.forEach(c=>db.cust.push({id:uid(),n:c[0],ph:c[1],addr:c[2],lim:0}));S.sup.forEach(c=>db.sup.push({id:uid(),n:c[0],ph:c[1],addr:c[2],gst:''}));
  const pl=db.items.slice(-S.items.length);
  const sid=db.sup[db.sup.length-S.sup.length].id;
  [30,18].forEach((d,k)=>{const lines=pl.map(it=>{const q=IS?(k?30:60):(k?8:14);it.s=q3(it.s+q);return{i:it.id,n:label(it),u:it.u,q,r:it.b,mpt:0}});const tot=r2(lines.reduce((a,l)=>a+l.q*l.r,0));db.purch.push({id:uid(),d:addDays(t,-d),sup:sid,sname:db.sup.find(x=>x.id===sid).n,inv:'INV-'+(100+k),lines,tot,paid:k?tot:Math.round(tot*.6),due:k?0:tot-Math.round(tot*.6),pm:'Bank transfer'})});
  const cs=db.cust.slice(-S.cust.length);
  for(let d=14;d>=0;d--){const nb=d%3===0?2:1;for(let k=0;k<nb;k++){const it1=pl[(d+k)%pl.length],it2=pl[(d*2+k+3)%pl.length];const c={lines:[{i:it1.id,n:label(it1),u:it1.u,q:IS?2.5:1,r:it1.p,b:it1.b},{i:it2.id,n:label(it2),u:it2.u,q:IS?1.6:2,r:it2.p,b:it2.b}],cust:(d%4===0)?cs[d%cs.length].id:'',disc:d%5===0?'50':'',discT:'amt',mode:d%4===0?'Udhaar':(d%2?'UPI':'Cash'),rec:'',pm:'Cash',note:''};commitBill(c,addDays(t,-d),'1'+k+':30')}}
  db.exp.push({id:uid(),d:addDays(t,-20),cat:'Shop Rent',amt:8000,mode:'Cash',note:''},{id:uid(),d:addDays(t,-6),cat:'Electricity',amt:1650,mode:'UPI',note:''});
  const e={id:uid(),n:'Ramesh',role:CFG.roles[0],ph:'9812300011',sal:12000,join:addDays(t,-300),act:1};db.emp.push(e);
  if(!db.shop.name||db.shop.name===CFG.defName)db.shop.name='Sample '+CFG.defName;
  save(true);closeModal();render();toast('Sample data added');
};

/* ================= THEME & BACKGROUND ================= */
const HDS=[['Default',null,null],['Maroon','#5a0f24','#9f1239'],['Navy','#11296c','#1a3fa6'],['Green','#0b3d2e','#16794f'],['Purple','#3b0f8f','#6d28d9'],['Teal','#0b3a46','#0e7490'],['Slate','#1f2937','#475569'],['Orange','#7c2d12','#c2410c'],['Pink','#831843','#db2777']];
const BGL=[['Warm grey','#f6f5f3'],['White','#ffffff'],['Cream','#fbf4e6'],['Sky','#eaf2fb'],['Mint','#e8f5ee'],['Pink','#fdeff3'],['Lavender','#f1ecfb'],['Peach','#fff1e6']];
const BGD=[['Plum','#14121a'],['Black','#05070c'],['Charcoal','#1a1d24'],['Midnight','#0e1320'],['Forest','#0f1511']];
const LK=CFG.key+'_look',TK=CFG.key+'_theme';
const isDarkNow=()=>{const r=document.documentElement;return (r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'};
const getL=()=>{try{return JSON.parse(localStorage.getItem(LK)||'{}')||{}}catch(e){return{}}};
function applyLook(){const L=getL(),s=document.documentElement.style,h=HDS[L.h];if(h&&h[1]){s.setProperty('--hd',h[1]);s.setProperty('--ac2',h[2]);s.setProperty('--ac',h[2])}else{s.removeProperty('--hd');s.removeProperty('--ac2');s.removeProperty('--ac')}const c=isDarkNow()?L.bd:L.bl;if(c)s.setProperty('--bg',c);else s.removeProperty('--bg')}
function lookSave(k,v){const L=getL();L[k]=v;try{localStorage.setItem(LK,JSON.stringify(L))}catch(e){}applyLook()}
function lookBody(){const L=getL(),d=isDarkNow(),list=d?BGD:BGL,cur=d?L.bd:L.bl;return '<div class="lk"><h4>Background ('+(d?'dark':'light')+' mode)</h4><div class="swr">'+list.map(x=>'<button class="sw'+(cur===x[1]?' on':'')+'" style="background:'+x[1]+'" title="'+x[0]+'" aria-label="'+x[0]+'" data-a="setBg" data-c="'+x[1]+'"></button>').join('')+'<label class="sw" style="position:relative;overflow:hidden;display:grid;place-items:center" title="Your own colour">🎨<input type="color" value="'+(cur||'#ffffff')+'" id="bgPick" data-a="none" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0"></label></div><h4>Header &amp; button colour</h4><div class="swr">'+HDS.map((x,i)=>'<button class="sw'+((L.h||0)===i?' on':'')+'" style="background:'+(x[1]?'linear-gradient(135deg,'+x[1]+','+x[2]+')':'linear-gradient(135deg,var(--hd),var(--ac2))')+'" title="'+x[0]+'" aria-label="'+x[0]+'" data-a="setHd" data-i="'+i+'"></button>').join('')+'</div><div class="row"><button class="btn" data-a="theme2">🌓 Dark / Light</button><button class="btn" data-a="lookReset">↺ Reset colours</button></div></div>'}
ACT.look=()=>modal('Theme & background',lookBody());
ACT.setBg=t=>{lookSave(isDarkNow()?'bd':'bl',t.dataset.c);ACT.look()};ACT.setHd=t=>{lookSave('h',+t.dataset.i);ACT.look()};
ACT.lookReset=()=>{try{localStorage.removeItem(LK)}catch(e){}applyLook();ACT.look()};
ACT.theme=()=>{const r=document.documentElement,nx=isDarkNow()?'light':'dark';r.dataset.theme=nx;try{localStorage.setItem(TK,nx)}catch(e){}applyLook()};
ACT.theme2=()=>{ACT.theme();ACT.look()};
document.addEventListener('input',e=>{if(e.target.id==='bgPick')lookSave(isDarkNow()?'bd':'bl',e.target.value)});

/* ================= INIT ================= */
try{const th=localStorage.getItem(TK);if(th)document.documentElement.dataset.theme=th}catch(e){}
load();applyLook();render();
window.__L={get db(){return db},ACT,UI,render,commitBill,cartTot,custBal,supBal};
})();
</script>
