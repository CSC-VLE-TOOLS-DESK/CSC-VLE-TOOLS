function empById(id){for(var i=0;i<D.emp.length;i++)if(D.emp[i].id===id)return D.emp[i];return null}
function salRec(empId,month){for(var i=0;i<D.sal.length;i++)if(D.sal[i].empId===empId&&D.sal[i].month===month)return D.sal[i];return null}
function daysIn(month){return new Date(+month.slice(0,4),+month.slice(5,7),0).getDate()}
function calcSal(e,month,absent,bonus,advDed){var per=N(e.salary)/daysIn(month),ad=R2(per*N(absent));return {base:N(e.salary),absentDed:ad,net:R2(N(e.salary)-ad+N(bonus)-N(advDed))}}

function advBalance(empId){return R2(sum(D.adv.filter(function(a){return a.empId===empId}),function(a){return N(a.amt)})-sum(D.sal.filter(function(s){return s.empId===empId}),function(s){return N(s.advDed)}))}
