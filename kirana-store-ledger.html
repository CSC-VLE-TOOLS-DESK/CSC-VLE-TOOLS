/* ---- import from the previous Kirana Store Ledger (storage key csc_kirana_ledger_v1). The old data is only READ, never changed. ---- */
function migrateLive(o){
  try{
    const N=x=>+x||0, R=x=>Math.round(x*100)/100, UM={pcs:'pc',pc:'pc',packet:'pkt',pkt:'pkt'};
    if(o.shop&&o.shop.name)db.shop.name=o.shop.name;
    if(o.shop){db.shop.addr=o.shop.addr||'';db.shop.phone=o.shop.phone||'';db.shop.gst=o.shop.gstin||''}
    const stock={};
    (o.purch||[]).forEach(p=>(p.lines||[]).forEach(l=>{stock[l.itemId]=(stock[l.itemId]||0)+N(l.qty)}));
    (o.sales||[]).forEach(s=>(s.lines||[]).forEach(l=>{stock[l.itemId]=(stock[l.itemId]||0)-N(l.qty)}));
    (o.use||[]).forEach(u=>{stock[u.itemId]=(stock[u.itemId]||0)-N(u.qty)});
    const idmap={},uname={};
    (o.items||[]).forEach(x=>{
      const u=UM[x.unit]||x.unit||'pc',s=Math.max(0,R(stock[x.id]||0)),m=CI.find(r=>r[1].toLowerCase()===String(x.name).toLowerCase());
      uname[x.id]={n:x.name,u:m?(m[2]||u):u};
      if(m){const id=hid(m[1]);idmap[x.id]=id;db.ov[id]={p:N(x.price)||m[3],s:s,m:N(x.reorder)};if(N(x.cost)>0)db.ov[id].b=N(x.cost)}
      else{const id='u'+x.id;idmap[x.id]=id;db.ci.push({id,n:x.name,c:CATS.length-1,u,p:N(x.price),b:N(x.cost),s:s,m:N(x.reorder),bc:''})}
    });
    const cmap={},getC=(n,ph)=>{n=(n||'').trim();if(!n)return'';const k=n.toLowerCase();if(cmap[k])return cmap[k];const c={id:uid(),n,ph:ph||'',addr:'',lim:0};db.cust.push(c);return cmap[k]=c.id};
    const smap={},getS=n=>{n=(n||'').trim();if(!n)return'';const k=n.toLowerCase();if(smap[k])return smap[k];const c={id:uid(),n,ph:'',addr:'',lim:0};db.sup.push(c);return smap[k]=c.id};
    const nm=l=>(uname[l.itemId]||{n:'Item',u:'pc'});
    (o.sales||[]).slice().sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:a.id-b.id)).forEach(s=>{
      const lines=(s.lines||[]).map(l=>({i:idmap[l.itemId]||'',n:nm(l).n,u:nm(l).u,q:N(l.qty),r:N(l.price),b:0}));
      let net=0;(s.lines||[]).forEach(l=>{net+=N(l.qty)*N(l.price)*(1-N(l.disc)/100)});
      const grand=R(net),tot=Math.round(grand),rec=Math.min(N(s.paid),tot),due=R(Math.max(0,tot-N(s.paid))),cid=(due>0||(s.cust||'').trim())?getC(s.cust,s.phone):'';
      db.bills.push({id:uid(),no:++db.billno,d:s.date,t:'',cust:cid,cname:s.cust||'',lines,sub:grand,disc:0,ro:R(tot-grand),tot,mode:due>0?(rec>0?'Part':'Udhaar'):(s.mode||'Cash'),pm:s.mode||'Cash',rec,due,note:(s.note||'')+' (imported)'});
    });
    (o.purch||[]).forEach(p=>{
      let t=0;const lines=(p.lines||[]).map(l=>{t+=N(l.qty)*N(l.rate)*(1-N(l.disc)/100)*(1+N(l.gst)/100);return{i:idmap[l.itemId]||'',n:nm(l).n,u:nm(l).u,q:N(l.qty),r:N(l.rate)}});
      t=R(t+N(p.freight));const sid=getS(p.sup);
      db.purch.push({id:uid(),d:p.date,sup:sid,sname:p.sup||'',inv:p.inv||'',lines,tot:t,paid:Math.min(N(p.paid),t),due:R(Math.max(0,t-N(p.paid))),pm:p.mode||'Cash'});
    });
    (o.exp||[]).forEach(e=>db.exp.push({id:uid(),d:e.date,cat:e.cat||'Other',amt:N(e.amt),note:((e.note||'')+(e.vehicle?' '+e.vehicle:'')).trim(),mode:e.mode||'Cash'}));
    (o.use||[]).forEach(u=>{const it=uname[u.itemId]||{n:'Item',u:'pc'},x=(o.items||[]).find(q=>q.id===u.itemId)||{};db.loss.push({id:uid(),d:u.date,i:idmap[u.itemId]||'',n:it.n,u:it.u,q:N(u.qty),amt:R(N(u.qty)*N(x.cost)),why:(u.reason||'')+(u.note?' – '+u.note:'')})});
    (o.pay||[]).forEach(p=>{
      const nmx=String(p.party||'').replace(/\s*\(udhaar\)\s*$/i,'').trim();
      if(p.type==='in'){db.cpay.push({id:uid(),d:p.date,cust:getC(nmx),amt:N(p.amt),mode:p.mode||'Cash',note:p.note||''})}
      else{db.spay.push({id:uid(),d:p.date,sup:getS(nmx),amt:N(p.amt),mode:p.mode||'Cash',note:p.note||''})}

}

function hid(s){s=s.toLowerCase();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return 'c'+(h>>>0).toString(36)}
let ITEMS=[],BYID=new Map(),FREQ=null;
const MARG=CATS.map(c=>c[3]);
function buildItems(){
  ITEMS=[];BYID.clear();
  for(let k=0;k<CI.length;k++){const r=CI[k];const p=r[3];
    const it={id:hid(r[1]),n:r[1],c:r[0],u:r[2],p,b:+(p*MARG[r[0]]).toFixed(2),s:null,m:0,bc:'',h:0,al:ALI[r[4]]||'',cust:0};
    it._b={n:it.n,c:it.c,u:it.u,p:it.p,b:it.b,s:null,m:0,bc:'',h:0};
    const o=db.ov[it.id];if(o)Object.assign(it,o);ITEMS.push(it)}
  db.ci.forEach(c=>ITEMS.push(Object.assign({al:'',h:0,bc:'',s:null,m:0,b:0},c,{cust:1})));
  ITEMS.forEach(reidx);
}
function reidx(it){it.k=(it.n+' '+it.al+' '+it.bc+' '+(CATS[it.c]?CATS[it.c][0]:'')).toLowerCase();BYID.set(it.id,it)}
function patch(it,f){
  Object.assign(it,f);
  if(it.cust){const x=db.ci.find(y=>y.id===it.id);if(x)Object.assign(x,f)}
  else{const o={};for(const k in it._b)if(it[k]!==it._b[k])o[k]=it[k];if(Object.keys(o).length)db.ov[it.id]=o;else delete db.ov[it.id]}
  if('n' in f||'bc' in f||'c' in f)reidx(it);
  save();
}
function newItem(f){const it=Object.assign({id:'u'+uid(),n:'',c:CATS.length-1,u:'pc',p:0,b:0,s:null,m:0,bc:'',h:0,al:''},f);db.ci.push({id:it.id,n:it.n,c:it.c,u:it.u,p:it.p,b:it.b,s:it.s,m:it.m,bc:it.bc,h:0});it.cust=1;ITEMS.push(it);reidx(it);save();return it}
function search(qs,o){
  o=o||{};const lim=o.limit||40,t=String(qs||'').toLowerCase().trim().split(/\s+/).filter(Boolean),res=[];
  const cat=o.cat==null?-1:o.cat;
  if(t.length===1&&t[0].length>=4){const bc=ITEMS.find(i=>i.bc&&i.bc===t[0]&&!i.h);if(bc)return[bc]}
  for(let k=0;k<ITEMS.length;k++){const it=ITEMS[k];
    if(it.h&&!o.hidden)continue;if(!it.h&&o.hidden===2)continue;
    if(cat>=0&&it.c!==cat)continue;
    if(o.mine&&it.s===null)continue;
    let ok=true;for(let j=0;j<t.length;j++){if(it.k.indexOf(t[j])<0){ok=false;break}}
    if(ok){res.push(it);if(res.length>=1500)break}}
  if(t.length){const w=t[0],re=new RegExp('(^|[^a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),sc=i=>re.test(i.n.toLowerCase())?0:1;res.sort((a,b)=>{const sa=sc(a),sb=sc(b);if(sa!==sb)return sa-sb;const ta=a.s>0?0:1,tb=b.s>0?0:1;if(ta!==tb)return ta-tb;if(a.c!==b.c)return a.c-b.c;const pa=a.n.toLowerCase().startsWith(w)?0:1,pb=b.n.toLowerCase().startsWith(w)?0:1;if(pa!==pb)return pa-pb;return a.n.length-b.n.length})}
  return res.slice(0,lim);
}
const tracked=it=>it.s!==null&&it.s!==undefined&&it.s!==''&&!isNaN(it.s);
function freqItems(){
  if(FREQ)return FREQ;const cut=addDays(tod(),-90),cnt={};
  db.bills.forEach(b=>{if(b.d>=cut)b.lines.forEach(l=>{if(l.i)cnt[l.i]=(cnt[l.i]||0)+1})});
  FREQ=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(i=>BYID.get(i)).filter(i=>i&&!i.h).slice(0,40);return FREQ;
}
function lowItems(){return ITEMS.filter(i=>!i.h&&tracked(i)&&i.m>0&&i.s<=i.m)}

function empStat(e,d){
  const m=(db.att[e.id]||{})[d];if(m)return m;
  if(e.join&&d<e.join)return'N';if(d>tod())return'F';
  if(e.off>=0&&dowOf(d)===+e.off)return'W';return'';
}
function calcSal(e,ym){
  const n=dim(ym),c={P:0,A:0,H:0,L:0,W:0,U:0,N:0,F:0};
  for(let d=1;d<=n;d++){const s=empStat(e,ym+'-'+pad(d));if(s==='')c.U++;else c[s]++}
  const div=e.basis==='30'?30:e.basis==='26'?26:n,rate=num(e.sal)/div,pd=c.P+c.H*.5+c.L+c.W;
  const earned=Math.min(num(e.sal),r2(rate*pd));
  const ad=db.madj[e.id+'|'+ym]||{};
  const ot=Object.entries(db.ot[e.id]||{}).filter(([d])=>d.startsWith(ym)).reduce((s,[,h])=>s+num(h),0);
  const otr=num(ad.otRate)>0?+ad.otRate:rate/8,otAmt=r2(ot*otr);
  const adv=sumBy(db.adv.filter(a=>a.emp===e.id&&a.m===ym),a=>a.amt);
  const bonus=num(ad.bonus),ded=num(ad.ded);
  const net=r2(earned+otAmt+bonus-ded-adv);
  const paid=sumBy(db.spaid.filter(p=>p.emp===e.id&&p.m===ym),p=>p.amt);
  return{c,div,rate,pd,earned,ot,otr,otAmt,adv,bonus,ded,net,paid,due:r2(net-paid),ad};
}
const ST={P:['P','Present','उपस्थित'],A:['A','Absent','अनुपस्थित'],H:['H','Half day','आधा दिन'],L:['L','Paid leave','छुट्टी (पेड)'],W:['W','Weekly off','साप्ताहिक छुट्टी']};
function attBtns(e,d){
  const cur=empStat(e,d),marked=(db.att[e.id]||{})[d];
  return `<span class="att">${Object.keys(ST).map(k=>`<button data-a="mark" data-e="${e.id}" data-d="${d}" data-s="${k}" class="${marked===k?'on':''}${!marked&&cur===k?' on" style="opacity:.55':''}" title="${ST[k][1]}">${k}</button>`).join('')}</span>`;
}
ACT.mark=t=>{
  const{e,d,s}=t.dataset;db.att[e]=db.att[e]||{};
  if(db.att[e][d]===s)delete db.att[e][d];else db.att[e][d]=s;

};

function barSVG(vals,labels,color){
  const W=420,H=150,mx=Math.max(1,...vals),n=vals.length,bw=Math.max(4,Math.min(40,(W-20)/n-6));
  return `<svg class="bar" viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Bar chart">${vals.map((v,i)=>{const h=Math.round(v/mx*H),x=10+i*((W-20)/n)+((W-20)/n-bw)/2;return `<rect x="${x}" y="${H-h+4}" width="${bw}" height="${Math.max(h,v>0?2:0)}" rx="3" fill="${color||'var(--ac)'}"><title>${esc(labels[i])}: ${inr(v)}</title></rect>${n<=12?`<text x="${x+bw/2}" y="${H+17}" text-anchor="middle" font-size="11" fill="var(--mu)">${esc(labels[i])}</text>`:''}${n<=8&&v>0?`<text x="${x+bw/2}" y="${H-h}" text-anchor="middle" font-size="10" fill="var(--ink)">${v>=1000?Math.round(v/100)/10+'k':Math.round(v)}</text>`:''}`}).join('')}<line x1="10" x2="${W-10}" y1="${H+4}" y2="${H+4}" stroke="var(--ln)"/></svg>`;
}

const C=()=>db.cart||(db.cart={cust:'',lines:[],disc:0,dt:'amt',mode:'Cash',rec:'',pm:'Cash',note:''});
function cartTot(c){
  const sub=r2(sumBy(c.lines,l=>num(l.q)*num(l.r)));
  let disc=c.dt==='pct'?sub*Math.min(100,num(c.disc))/100:num(c.disc);disc=r2(Math.max(0,Math.min(disc,sub)));
  const af=sub-disc;let tot,ro=0;
  if(db.shop.round){tot=Math.round(af);ro=r2(tot-af)}else tot=r2(af);
  let rec=c.mode==='Udhaar'?0:c.mode==='Part'?Math.max(0,Math.min(tot,num(c.rec))):tot;
  return{sub,disc,ro,tot,rec,due:r2(tot-rec)};
}

ACT.saveBill=()=>{
  const c=C();if(!c.lines.length)return toast('Add items first',1);
  const bad=c.lines.find(l=>!(num(l.q)>0));if(bad)return toast('Enter quantity for '+bad.n,1);
  const T=cartTot(c);if(T.tot<=0&&!confirm('Bill total is ₹0. Save anyway?'))return;
  if(T.due>0&&!c.cust)return toast('Select a customer (or add new) for Udhaar / part payment',1);
  const go2=()=>{
    const d=tod(),b={id:uid(),no:++db.billno,d,t:nowT(),cust:c.cust,cname:c.cust?(custById(c.cust)||{}).n||'':'',lines:c.lines.map(l=>({i:l.i,n:l.n,u:l.u,q:num(l.q),r:num(l.r),b:num(l.b)})),sub:T.sub,disc:T.disc,ro:T.ro,tot:T.tot,mode:c.mode,pm:c.mode==='Part'?c.pm:c.mode,rec:T.rec,due:T.due,note:c.note||''};
    b.lines.forEach(l=>{const it=BYID.get(l.i);if(it&&tracked(it))patch(it,{s:q3(it.s-l.q)})});
    db.bills.push(b);db.cart=null;FREQ=null;save(true);renderCart();renderRes();
    if(db.shop.autoPrint)printHTML(billHTML(b));
    billDone(b);

  if(c.cust&&T.due>0){const cu=custById(c.cust),bal=balMaps().c[c.cust]||0;if(cu&&cu.lim>0&&bal+T.due>cu.lim){confirmBox(`${cu.n}'s credit limit is ${inr(cu.lim)}.\nPrevious balance ${inr(bal)} + this bill due ${inr(T.due)} = ${inr(bal+T.due)}.\nSave anyway?`,go2,'Save anyway');return}}
  go2();
};

/* ================= BILLS LIST ================= */
function bRange(k){
  const t=tod();
  if(k==='today')return[t,t];if(k==='yest'){const y=addDays(t,-1);return[y,y]}
  if(k==='week')return[addDays(t,-6),t];if(k==='month')return[t.slice(0,7)+'-01',t];if(k==='all')return['2000-01-01','2999-12-31'];return null;
}
PAGES.bills=()=>{
  const u=UI.bills,q=u.q.trim().toLowerCase();
  const list=db.bills.filter(b=>b.d>=u.from&&b.d<=u.to&&(!q||String(b.no)===q||(b.cname||'').toLowerCase().includes(q)||b.lines.some(l=>l.n.toLowerCase().includes(q)))).sort((a,b)=>b.no-a.no);
  const chips=[['today','Today'],['yest','Yesterday'],['week','Last 7 days'],['month','This month'],['all','All']];
  return `<h2>📋 Bills <small>पुराने बिल</small></h2>
  <div class="card"><div class="chips" style="margin-bottom:10px">${chips.map(c=>`<button class="chip ${u.pk===c[0]?'on':''}" data-a="bpk" data-k="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="row"><label>From<input type="date" data-c="bfrom" value="${u.from}"></label><label>To<input type="date" data-c="bto" value="${u.to}"></label><label>Search (bill no, customer, item)<input data-i="bsearch" value="${esc(u.q)}" placeholder="🔍"></label></div></div>
  <div class="cards"><div class="cd"><small>Bills</small><b>${list.length}</b></div><div class="cd in"><small>Sale total</small><b>${inr(sumBy(list,b=>b.tot))}</b></div><div class="cd"><small>Est. profit</small><b>${inr(sumBy(list,billProfit))}</b></div><div class="cd no"><small>Udhaar</small><b>${inr(sumBy(list,b=>b.due))}</b></div></div>
  <div class="card flush"><div class="tw" id="blist">${billRows(list)}</div></div>`;
};
function billRows(list){
  if(!list.length)return '<div class="empty">No bills in this period.</div>';
  return `<table><tr><th>No</th><th>Date</th><th>Customer</th><th class="c">Items</th><th class="n">Total</th><th>Mode</th><th class="n">Due</th><th></th></tr>${list.slice(0,300).map(b=>`<tr><td><b>#${b.no}</b></td><td>${dmy(b.d)} <span class="mu">${esc(b.t||'')}</span></td><td>${esc(b.cname||'—')}</td><td class="c">${b.lines.length}</td><td class="n"><b>${inr(b.tot)}</b></td><td><span class="tag ${b.mode==='Udhaar'?'r':b.mode==='Part'?'y':''}">${esc(b.mode)}</span></td><td class="n ${b.due>0?'neg':''}">${b.due>0?inr(b.due):''}</td><td class="n"><button class="b s o" data-a="vbill" data-id="${b.id}">View</button> <button class="b s g2" data-a="printBill" data-id="${b.id}" title="Print">🖨️</button></td></tr>`).join('')}</table>${list.length>300?`<div class="note" style="padding:8px">Showing latest 300 of ${list.length}. Narrow the dates.</div>`:''}`;
}
ACT.bpk=t=>{const r=bRange(t.dataset.k);UI.bills.pk=t.dataset.k;UI.bills.from=r[0];UI.bills.to=r[1];render()};
CHG.bfrom=t=>{UI.bills.from=t.value||UI.bills.from;UI.bills.pk='';render()};
CHG.bto=t=>{UI.bills.to=t.value||UI.bills.to;UI.bills.pk='';render()};
INP.bsearch=t=>{UI.bills.q=t.value;const u=UI.bills,q=t.value.trim().toLowerCase();const list=db.bills.filter(b=>b.d>=u.from&&b.d<=u.to&&(!q||String(b.no)===q||(b.cname||'').toLowerCase().includes(q)||b.lines.some(l=>l.n.toLowerCase().includes(q)))).sort((a,b)=>b.no-a.no);setH('blist',billRows(list))};
ACT.vbill=t=>{
  const b=db.bills.find(x=>x.id===t.dataset.id);if(!b)return;
  const cu=b.cust?custById(b.cust):null;
  modal('Bill #'+b.no,`<iframe style="width:100%;height:420px;border:1px solid var(--ln);background:#fff;border-radius:8px" srcdoc="${esc('<style>'+printCSS('a4').replace('@page{size:A4;margin:12mm}','')+'body{padding:10px}</style>'+billHTML(b))}"></iframe>
  <label style="margin-top:10px">WhatsApp number<input id="wph" value="${esc(cu?cu.ph:'')}" inputmode="tel" placeholder="10-digit mobile"></label>
  <div class="mf"><button class="b r s" data-a="delBill" data-id="${b.id}">🗑 Delete bill</button><button class="b o" data-a="waBill" data-id="${b.id}">💬 WhatsApp</button><button class="b" data-a="printBill" data-id="${b.id}">🖨️ Print</button></div>`,true);
};
ACT.delBill=t=>{
  const id=t.dataset.id,b=db.bills.find(x=>x.id===id);if(!b)return;
  confirmBox(`Delete bill #${b.no} of ${inr(b.tot)}?\nStock of tracked items will be put back. This cannot be undone.`,()=>{
    b.lines.forEach(l=>{const it=BYID.get(l.i);if(it&&tracked(it))patch(it,{s:q3(it.s+num(l.q))})});
    db.bills=db.bills.filter(x=>x.id!==id);FREQ=null;save();rerender();toast('Bill deleted, stock restored');
  },'Delete bill');
};

const B=()=>UI.buy||(UI.buy={d:tod(),sup:'',inv:'',lines:[],paid:'',pm:'Cash',q:''});

  const b=B(),sups=db.sup.slice().sort((x,y)=>x.n.localeCompare(y.n));

AFTER.buy=()=>{renderBres();renderBbox()};
function renderBres(){
  const b=B(),q=b.q.trim();if(!q){setH('bres','<div class="empty">Type an item name to add it.</div>');return}
  const r=search(q,{limit:25});

}
INP.bq=t=>{B().q=t.value;renderBres()};
KEY.bqEnter=()=>{const r=search(B().q,{limit:1});if(r.length)addBuy(r[0].id)};
function addBuy(id){const it=BYID.get(id);if(!it)return;const b=B(),ex=b.lines.find(l=>l.i===id);if(ex)ex.q=q3(num(ex.q)+1);else b.lines.push({i:id,n:it.n,u:it.u,q:1,r:it.b,sp:it.p});renderBbox()}
ACT.badd=t=>addBuy(t.dataset.id);
ACT.newItemBuy=t=>itemModal(null,it=>{addBuy(it.id)},{n:t.dataset.n});
function bTot(){const b=B();const tot=r2(sumBy(b.lines,l=>num(l.q)*num(l.r)));const paid=b.paid===''?tot:Math.min(tot,Math.max(0,num(b.paid)));return{tot,paid,due:r2(tot-paid)}}
function renderBbox(){
  const b=B(),box=$('#bbox');if(!box)return;
  box.innerHTML=`<h3>🧺 Purchase list <span class="tag">${b.lines.length} items</span></h3>${b.lines.length?`<div class="tw"><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Cost ₹</th><th class="n">Sell ₹</th><th class="n">Amount</th><th></th></tr>${b.lines.map((l,n)=>`<tr><td>${esc(l.n)}<div class="hint">per ${esc(l.u)}</div></td><td><input class="sm" type="number" step="any" min="0" data-i="blq" data-n="${n}" value="${l.q}"></td><td><input class="num" type="number" step="any" min="0" data-i="blr" data-n="${n}" value="${l.r}"></td><td><input class="num" type="number" step="any" min="0" data-i="bls" data-n="${n}" value="${l.sp}"></td><td class="n" id="bla${n}"><b>${r2(num(l.q)*num(l.r))}</b></td><td><button class="b s g2" data-a="bdel" data-n="${n}">✕</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Search and tap items to add.</div>'}
  <div id="btot" style="margin-top:10px"></div>
  <div class="row"><label>Paid now ₹ (blank = full)<input type="number" min="0" step="any" data-i="bpaid" value="${b.paid}" placeholder="full"></label><label>Paid by<select data-c="bpm">${['Cash','UPI','Card','Bank'].map(m=>opt(m,m,b.pm===m)).join('')}</select></label></div>
  <div class="row" style="margin-top:10px"><button class="b l" data-a="savePur" ${b.lines.length?'':'disabled'}>✅ Save Purchase</button>${b.lines.length?'<button class="b g2 fit" data-a="clearBuy">Clear</button>':''}</div>
  <div class="note">Saving updates stock, cost price and selling price of each item. Untracked items start being tracked from this quantity.</div>`;
  updBtot();
}
function updBtot(){const b=B(),T=bTot();b.lines.forEach((l,n)=>setH('bla'+n,`<b>${r2(num(l.q)*num(l.r))}</b>`));setH('btot',`<div class="tot big"><span>TOTAL</span><span>${inr(T.tot)}</span></div>${T.due>0?`<div class="tot"><span>Due to supplier</span><span class="neg">${inr(T.due)}</span></div>`:''}`)}
INP.blq=t=>{B().lines[+t.dataset.n].q=t.value;updBtot()};
INP.blr=t=>{B().lines[+t.dataset.n].r=t.value;updBtot()};
INP.bls=t=>{B().lines[+t.dataset.n].sp=t.value};
INP.bpaid=t=>{B().paid=t.value;updBtot()};
INP.binv=t=>{B().inv=t.value};
CHG.bd=t=>{B().d=t.value||tod()};
CHG.bpm=t=>{B().pm=t.value};
CHG.bsup=t=>{if(t.value==='__new'){supModal(null,id=>{B().sup=id;rerender()});rerender();return}B().sup=t.value};
ACT.bdel=t=>{B().lines.splice(+t.dataset.n,1);renderBbox()};
ACT.clearBuy=()=>{UI.buy=null;render()};
ACT.savePur=()=>{
  const b=B();if(!b.lines.length)return;
  if(b.lines.find(l=>!(num(l.q)>0)))return toast('Enter quantity for every item',1);
  const T=bTot();if(T.due>0&&!b.sup)return toast('Select a supplier when payment is pending',1);
  const p={id:uid(),d:b.d,sup:b.sup,sname:b.sup?(supById(b.sup)||{}).n:'',inv:b.inv,lines:b.lines.map(l=>({i:l.i,n:l.n,u:l.u,q:num(l.q),r:num(l.r)})),tot:T.tot,paid:T.paid,due:T.due,pm:b.pm};
  b.lines.forEach(l=>{const it=BYID.get(l.i);if(!it)return;const f={b:num(l.r)};if(num(l.sp)>0)f.p=num(l.sp);f.s=tracked(it)?q3(it.s+num(l.q)):q3(num(l.q));patch(it,f)});
  db.purch.push(p);UI.buy=null;save(true);render();toast('Purchase saved – stock updated');
};
ACT.vpur=t=>{
  const p=db.purch.find(x=>x.id===t.dataset.id);if(!p)return;
  modal('Purchase – '+dmy(p.d),`<p><b>${esc(p.sname||'Cash purchase')}</b> ${p.inv?'· Invoice '+esc(p.inv):''}</p><div class="tw"><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Cost</th><th class="n">Amount</th></tr>${p.lines.map(l=>`<tr><td>${esc(l.n)}</td><td class="n">${q3(l.q)} ${esc(l.u)}</td><td class="n">${r2(l.r)}</td><td class="n">${r2(l.q*l.r)}</td></tr>`).join('')}</table></div>
  <div class="kv" style="margin-top:8px"><span>Total</span><span>${inr(p.tot)}</span><span>Paid (${esc(p.pm)})</span><span>${inr(p.paid)}</span><span>Due</span><span class="${p.due>0?'neg':''}">${inr(p.due)}</span></div>
  <div class="mf"><button class="b r s" data-a="delPur" data-id="${p.id}">🗑 Delete purchase</button></div>`,true);
};
ACT.delPur=t=>{const id=t.dataset.id,p=db.purch.find(x=>x.id===id);if(!p)return;
  confirmBox('Delete this purchase of '+inr(p.tot)+'?\nStock added by it will be reduced again.',()=>{p.lines.forEach(l=>{const it=BYID.get(l.i);if(it&&tracked(it))patch(it,{s:q3(it.s-num(l.q))})});db.purch=db.purch.filter(x=>x.id!==id);save();rerender();toast('Purchase deleted')},'Delete')};

/* ================= ITEMS ================= */
const PG=50;
function itemList(){
  const u=UI.items,o={cat:u.cat,limit:1e9};
  if(u.f==='hidden')o.hidden=2;else if(u.f==='all'||u.f==='mine'||u.f==='tracked'||u.f==='low'||u.f==='out'){}
  let l=search(u.q,o);
  if(!u.q.trim()&&u.cat<0&&!u.f.match(/hidden/))l=ITEMS.filter(i=>!i.h);
  if(u.f==='hidden')l=ITEMS.filter(i=>i.h&&(u.cat<0||i.c===u.cat)&&(!u.q.trim()||u.q.toLowerCase().split(/\s+/).every(w=>i.k.includes(w))));
  if(u.f==='tracked')l=l.filter(tracked);
  if(u.f==='low')l=l.filter(i=>tracked(i)&&i.m>0&&i.s<=i.m);
  if(u.f==='out')l=l.filter(i=>tracked(i)&&i.s<=0);
  if(u.f==='mine')l=l.filter(i=>i.cust);
  if(u.f==='edited')l=l.filter(i=>i.cust||db.ov[i.id]);
  if(!u.q.trim())l.sort((a,b)=>a.c-b.c||a.n.localeCompare(b.n));
  return l;
}
PAGES.items=()=>{
  const u=UI.items,vis=ITEMS.filter(i=>!i.h),tr=vis.filter(tracked),cnt=new Array(CATS.length).fill(0);vis.forEach(i=>cnt[i.c]++);
  const stockCost=sumBy(tr.filter(i=>i.s>0),i=>i.s*i.b),stockRet=sumBy(tr.filter(i=>i.s>0),i=>i.s*i.p);
  const filters=[['all','All'],['tracked','Stock tracked'],['low','Low stock'],['out','Out of stock'],['mine','My own'],['edited','Edited by me'],['hidden','Hidden']];
  return `<h2>🏷️ Items <small>सामान की लिस्ट — ${vis.length.toLocaleString('en-IN')} items ready to sell</small></h2>
  <div class="cards"><div class="cd"><small>Items in catalog</small><b>${vis.length.toLocaleString('en-IN')}</b><i>${ITEMS.length-vis.length} hidden</i></div><div class="cd in"><small>Stock tracked</small><b>${tr.length}</b><i>items with stock entered</i></div><div class="cd no"><small>Low / out</small><b>${lowItems().length} / ${outItems().length}</b></div><div class="cd wr"><small>Stock value</small><b>${inr(stockCost)}</b><i>at cost · retail ${inr(stockRet)}</i></div></div>
  <div class="card"><div class="row"><label>Search<input id="iq" data-i="iq" value="${esc(u.q)}" placeholder="🔍 name, Hindi name, barcode"></label><label>Show<select data-c="if">${filters.map(f=>opt(f[0],f[1],u.f===f[0])).join('')}</select></label></div>
  <div class="row" style="margin-top:10px"><button class="b" data-a="itemNew">➕ Add new item</button><button class="b o" data-a="bulkPrice">% Bulk price change</button><button class="b o" data-a="itemTools">⚙ More tools</button></div>
  <div class="chips sc" style="margin-top:10px"><button class="chip ${u.cat<0?'on':''}" data-a="icat" data-c2="-1">All (${vis.length})</button>${CATS.map((c,i)=>cnt[i]||u.cat===i?`<button class="chip ${u.cat===i?'on':''}" data-a="icat" data-c2="${i}">${c[2]} ${esc(c[0])} (${cnt[i]})</button>`:'').join('')}</div></div>
  <div class="card flush"><div class="tw" id="itbl"></div></div>`;
};
AFTER.items=()=>renderItems();
function renderItems(){
  const u=UI.items,l=itemList(),pages=Math.max(1,Math.ceil(l.length/PG));if(u.pg>=pages)u.pg=pages-1;
  const sl=l.slice(u.pg*PG,u.pg*PG+PG);
  const pg=`<div class="pg"><button class="b s g2" data-a="ipg" data-d="-1" ${u.pg<=0?'disabled':''}>◀ Prev</button><span>${l.length.toLocaleString('en-IN')} items · page ${u.pg+1} / ${pages}</span><button class="b s g2" data-a="ipg" data-d="1" ${u.pg>=pages-1?'disabled':''}>Next ▶</button></div>`;
  setH('itbl',l.length?`${pg}<table><tr><th>Item</th><th>Category</th><th>Unit</th><th class="n">Sell ₹</th><th class="n">Cost ₹</th><th class="n">Stock</th><th class="n">Min</th><th></th></tr>${sl.map(i=>`<tr><td><b>${esc(i.n)}</b>${i.cust?' <span class="tag b">mine</span>':''}${i.h?' <span class="tag g">hidden</span>':''}${i.bc?`<div class="hint">▮ ${esc(i.bc)}</div>`:''}</td><td class="mu">${esc(catLabel(i.c))}</td><td>${esc(i.u)}</td><td><input class="num" type="number" step="any" min="0" data-c="ifld" data-f="p" data-id="${i.id}" value="${i.p}"></td><td><input class="num" type="number" step="any" min="0" data-c="ifld" data-f="b" data-id="${i.id}" value="${i.b}"></td><td><input class="sm" type="number" step="any" data-c="ifld" data-f="s" data-id="${i.id}" value="${tracked(i)?i.s:''}" placeholder="—"></td><td><input class="sm" type="number" step="any" min="0" data-c="ifld" data-f="m" data-id="${i.id}" value="${i.m||''}" placeholder="0"></td><td class="n"><button class="b s o" data-a="itemEdit" data-id="${i.id}">Edit</button></td></tr>`).join('')}</table>${pg}`:'<div class="empty">No items found. Try another word or <b>Add new item</b>.</div>');
}
INP.iq=t=>{UI.items.q=t.value;UI.items.pg=0;renderItems()};
CHG.if=t=>{UI.items.f=t.value;UI.items.pg=0;renderItems()};
ACT.icat=t=>{UI.items.cat=+t.dataset.c2;UI.items.pg=0;render()};

CHG.ifld=t=>{
  const it=BYID.get(t.dataset.id),f=t.dataset.f;if(!it)return;let v=t.value.trim();

let ITEM_CB=null;
function itemModal(it,cb,pre){
  ITEM_CB=cb;pre=pre||{};const n=it||Object.assign({n:'',c:CATS.length-1,u:'pc',p:'',b:'',s:null,m:'',bc:'',h:0},pre);

function doImportCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return toast('CSV is empty',1);
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);
  const iN=ix('name'),iI=ix('id');if(iN<0&&iI<0)return toast('CSV must have a "name" column',1);
  const byName=new Map(ITEMS.map(i=>[i.n.toLowerCase(),i])),catIx=new Map(CATS.map((c,i)=>[c[0].toLowerCase(),i]));
  let upd=0,add=0;const g=(r,n)=>{const k=ix(n);return k<0?undefined:(r[k]||'').trim()};
  rows.slice(1).forEach(r=>{
    const name=g(r,'name')||'';let it=(g(r,'id')&&BYID.get(g(r,'id')))||byName.get(name.toLowerCase());
    const f={};const p=g(r,'price'),b=g(r,'cost'),s=g(r,'stock'),m=g(r,'min'),bc=g(r,'barcode'),u=g(r,'unit'),hd=g(r,'hidden'),ct=g(r,'category');
    if(p!==undefined&&p!=='')f.p=num(p);if(b!==undefined&&b!=='')f.b=num(b);if(s!==undefined)f.s=s===''?null:q3(num(s));if(m!==undefined&&m!=='')f.m=num(m);if(bc!==undefined)f.bc=bc;if(u)f.u=u;if(hd!==undefined&&hd!=='')f.h=num(hd)?1:0;
    if(ct&&catIx.has(ct.toLowerCase()))f.c=catIx.get(ct.toLowerCase());
    if(it){patch(it,f);upd++}else if(name){const n=newItem(Object.assign({n:name,c:CATS.length-1,u:'pc',p:0,b:0},f));if(!f.b&&f.p)patch(n,{b:r2(f.p*.85)});byName.set(name.toLowerCase(),n);add++}
  });
  FREQ=null;save();render();toast(`Import done: ${upd} updated, ${add} added`);
}
ACT.onlyMine=()=>confirmBox('Hide every catalog item that has no stock entered and was not edited by you?\nYou can bring them back any time (Show all hidden items).',()=>{let n=0;ITEMS.forEach(i=>{if(!i.cust&&!i.h&&!tracked(i)&&!db.ov[i.id]){patch(i,{h:1});n++}});FREQ=null;render();toast(n+' items hidden')},'Hide them');

function repRange(){const u=UI.rep,t=tod(),m=t.slice(0,7);
  if(u.p==='today')return[t,t];if(u.p==='yest'){const y=addDays(t,-1);return[y,y]}if(u.p==='week')return[addDays(t,-6),t];if(u.p==='month')return[m+'-01',t];
  if(u.p==='last'){const l=addMonths(m,-1);return[l+'-01',l+'-'+dim(l)]}if(u.p==='year')return[t.slice(0,4)+'-01-01',t];if(u.p==='fy'){const y=+t.slice(0,4)-(+t.slice(5,7)<4?1:0);return[y+'-04-01',t]}
  return[u.from||m+'-01',u.to||t];
}
function repData(){
  const[f,t]=repRange(),bills=db.bills.filter(b=>b.d>=f&&b.d<=t),sales=sumBy(bills,b=>b.tot),gp=sumBy(bills,billProfit);
  const exp=sumBy(db.exp.filter(e=>e.d>=f&&e.d<=t),e=>e.amt),sal=sumBy(db.spaid.filter(p=>p.d>=f&&p.d<=t),p=>p.amt),adv=sumBy(db.adv.filter(a=>a.d>=f&&a.d<=t),a=>a.amt),loss=sumBy(db.loss.filter(l=>l.d>=f&&l.d<=t),l=>l.amt);
  const pur=db.purch.filter(p=>p.d>=f&&p.d<=t),cat={},top={};
  bills.forEach(b=>b.lines.forEach(l=>{const it=BYID.get(l.i),c=it?it.c:-1,a=num(l.q)*num(l.r);cat[c]=(cat[c]||0)+a;const k=l.i||l.n;top[k]=top[k]||{n:l.n,u:l.u,q:0,a:0,p:0};top[k].q+=num(l.q);top[k].a+=a;top[k].p+=(num(l.r)-num(l.b))*num(l.q)}));
  const days={};bills.forEach(b=>{days[b.d]=days[b.d]||{n:0,s:0,p:0};days[b.d].n++;days[b.d].s+=b.tot;days[b.d].p+=billProfit(b)});
  return{f,t,bills,sales,gp,exp,sal,adv,loss,staff:sal+adv,net:gp-exp-sal-adv-loss,pur,purTot:sumBy(pur,p=>p.tot),cat,top,days,inf:inflow(f,t),disc:sumBy(bills,b=>b.disc),udh:sumBy(bills,b=>b.due),cpay:sumBy(db.cpay.filter(p=>p.d>=f&&p.d<=t),p=>p.amt)};
}
PAGES.rep=()=>{
  const u=UI.rep,R=repData(),ps=[['today','Today'],['yest','Yesterday'],['week','Last 7 days'],['month','This month'],['last','Last month'],['fy','This FY'],['year','This year'],['custom','Custom']];
  const dk=Object.keys(R.days).sort(),topL=Object.values(R.top).sort((a,b)=>b.a-a.a).slice(0,15),catL=Object.entries(R.cat).sort((a,b)=>b[1]-a[1]);
  return `<h2>📊 Reports <small>रिपोर्ट — ${dmy(R.f)} to ${dmy(R.t)}</small></h2>
  <div class="card"><div class="chips">${ps.map(p=>`<button class="chip ${u.p===p[0]?'on':''}" data-a="rp" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>${u.p==='custom'?`<div class="row" style="margin-top:10px"><label>From<input type="date" data-c="rfrom" value="${R.f}"></label><label>To<input type="date" data-c="rto" value="${R.t}"></label></div>`:''}</div>
  <div class="cards"><div class="cd"><small>Total sale</small><b>${inr(R.sales)}</b><i>${R.bills.length} bills · discount ${inr(R.disc)}</i></div><div class="cd in"><small>Gross profit (est.)</small><b>${inr(R.gp)}</b><i>sale − item cost</i></div><div class="cd wr"><small>Shop expenses</small><b>${inr(R.exp)}</b></div><div class="cd wr"><small>Staff cost (paid + advance)</small><b>${inr(R.staff)}</b></div><div class="cd ${R.loss?'no':''}"><small>Stock losses</small><b>${inr(R.loss)}</b></div><div class="cd ${R.net>=0?'':'no'}" style="border-left-width:8px"><small>NET PROFIT</small><b class="${R.net>=0?'pos':'neg'}">${inr(R.net)}</b><i>after expenses, staff, losses</i></div></div>
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
   <div class="card"><h3>💰 Money received</h3><div class="kv"><span>💵 Cash</span><span>${inr(R.inf.Cash)}</span><span>📱 UPI</span><span>${inr(R.inf.UPI)}</span><span>💳 Card</span><span>${inr(R.inf.Card)}</span><span>🏦 Bank</span><span>${inr(R.inf.Bank||0)}</span><span>Udhaar given</span><span class="neg">${inr(R.udh)}</span><span>Udhaar recovered</span><span class="pos">${inr(R.cpay)}</span><span>Purchases (${R.pur.length})</span><span>${inr(R.purTot)}</span></div></div>
   <div class="card"><h3>📈 Daily sale</h3>${dk.length?barSVG(dk.slice(-31).map(d=>R.days[d].s),dk.slice(-31).map(d=>dmy(d))):'<div class="empty">No sales in this period.</div>'}</div></div>
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
   <div class="card flush"><h3 style="padding:12px 14px 0">🏆 Top items</h3><div class="tw">${topL.length?`<table><tr><th>Item</th><th class="n">Qty</th><th class="n">Sale</th><th class="n">Profit</th></tr>${topL.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${q3(x.q)} ${esc(x.u)}</td><td class="n">${inr(x.a)}</td><td class="n pos">${inr(x.p)}</td></tr>`).join('')}</table>`:'<div class="empty">—</div>'}</div></div>
   <div class="card flush"><h3 style="padding:12px 14px 0">🗂 Category-wise sale</h3><div class="tw">${catL.length?`<table>${catL.map(([c,a])=>`<tr><td>${c>=0?esc(catLabel(+c)):'Other'}</td><td class="n"><b>${inr(a)}</b></td><td class="n mu">${R.sales?Math.round(a/(sumBy(catL,x=>x[1])||1)*100):0}%</td></tr>`).join('')}</table>`:'<div class="empty">—</div>'}</div></div></div>
  <div class="card flush"><h3 style="padding:12px 14px 0">📅 Day-wise</h3><div class="tw">${dk.length?`<table><tr><th>Date</th><th class="n">Bills</th><th class="n">Sale</th><th class="n">Profit</th></tr>${dk.slice().reverse().map(d=>`<tr><td>${dmy(d)} ${DOW[dowOf(d)]}</td><td class="n">${R.days[d].n}</td><td class="n"><b>${inr(R.days[d].s)}</b></td><td class="n pos">${inr(R.days[d].p)}</td></tr>`).join('')}</table>`:'<div class="empty">—</div>'}</div></div>
  <div class="row"><button class="b o" data-a="repCSV">⬇ Download bills CSV</button><button class="b o" data-a="repPrint">🖨 Print summary</button></div>
  <p class="note">Profit uses each item's cost price (auto-estimated where you haven't entered one). Enter real cost prices on the Items page / via Purchase Entry for accurate profit.</p>`;
};
ACT.rp=t=>{UI.rep.p=t.dataset.p;render()};
CHG.rfrom=t=>{UI.rep.from=t.value;render()};CHG.rto=t=>{UI.rep.to=t.value;render()};
ACT.repCSV=()=>{const R=repData(),rows=[['Bill no','Date','Time','Customer','Items','Sub total','Discount','Round off','Total','Mode','Received','Due','Profit']];R.bills.forEach(b=>rows.push([b.no,b.d,b.t,b.cname,b.lines.map(l=>l.n+' x'+l.q).join('; '),b.sub,b.disc,b.ro,b.tot,b.mode,b.rec,b.due,r2(billProfit(b))]));dl(toCSV(rows),`bills_${R.f}_to_${R.t}.csv`,'text/csv')};
ACT.repPrint=()=>{const R=repData(),r=(a,b)=>`<tr><td>${a}</td><td class="r">${b}</td></tr>`;printHTML(shopHead('Summary '+dmy(R.f)+' to '+dmy(R.t))+`<table>${r('Total sale ('+R.bills.length+' bills)',r2(R.sales))}${r('Gross profit',r2(R.gp))}${r('Shop expenses','- '+r2(R.exp))}${r('Staff salary + advance','- '+r2(R.staff))}${r('Stock losses','- '+r2(R.loss))}<tr class="big"><td class="big">NET PROFIT</td><td class="r big">₹ ${r2(R.net)}</td></tr>${r('Cash received',r2(R.inf.Cash))}${r('UPI received',r2(R.inf.UPI))}${r('Udhaar given',r2(R.udh))}${r('Udhaar recovered',r2(R.cpay))}</table>`)};

/* ================= SETTINGS / BACKUP ================= */
function openSettings(){
  const s=db.shop;let size=0;try{size=Math.round((localStorage.getItem(SKEY)||'').length/1024)}catch(e){}
  modal('⚙ Settings',`<h3>Shop details (printed on bills)</h3><div class="g"><label style="grid-column:1/-1">Shop name<input id="sn1" value="${esc(s.name)}"></label><label style="grid-column:1/-1">Address<input id="sa1" value="${esc(s.addr)}"></label><label>Phone<input id="sp1" value="${esc(s.phone)}"></label><label>UPI ID<input id="su1" value="${esc(s.upi)}" placeholder="name@bank"></label><label>GSTIN (optional)<input id="sg1" value="${esc(s.gst)}"></label><label>Bill footer<input id="sf1" value="${esc(s.foot)}"></label><label>Paper<select id="spp">${opt('80','80 mm thermal roll',s.paper!=='a4')}${opt('a4','A4 sheet',s.paper==='a4')}</select></label><label>Round-off total<select id="sro">${opt(1,'Round to nearest rupee',s.round)}${opt(0,'Keep paise',!s.round)}</select></label></div>
  <div class="mf" style="margin-top:8px"><button class="b" data-a="setSave">Save details</button></div>
  <h3 style="margin-top:12px">Your data</h3><div class="row"><button class="b o" data-a="backup">💾 Download backup</button><button class="b o" data-a="restore">📂 Restore backup</button></div><p class="note">Data is stored only in this browser (${size} KB used). Take a backup every week and keep a copy on WhatsApp / Google Drive. Last backup: ${db.lastBackup?new Date(db.lastBackup).toLocaleString('en-IN'):'never'}.</p>
  <div class="row" style="margin-top:10px"><button class="b r s" data-a="resetAll">⚠ Erase all data</button></div>`,true);
}
ACT.settings=openSettings;
ACT.setSave=()=>{const s=db.shop;s.name=val('sn1').trim()||'My Kirana Store';s.addr=val('sa1');s.phone=val('sp1');s.upi=val('su1');s.gst=val('sg1');s.foot=val('sf1');s.paper=val('spp');s.round=+val('sro');save(true);closeModal();render();toast('Settings saved')};
ACT.backup=()=>{closeModal();db.lastBackup=new Date().toISOString();save(true);dl(JSON.stringify(db),'kirana_backup_'+tod()+'.json','application/json');toast('Backup downloaded');if(page==='dash')render()};
ACT.restore=()=>{closeModal();$('#fjson').value='';$('#fjson').click()};
ACT.resetAll=()=>confirmBox('This erases ALL bills, items, khata, staff data from this browser.\nTake a backup first! Continue?',()=>{db=blank();save(true);buildItems();FREQ=null;UI.buy=null;render();toast('All data erased')},'Erase everything');
ACT.theme=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';r.dataset.theme=nx;try{localStorage.setItem('kirana_theme',nx)}catch(e){}applyLook()};
function setupFiles(){
  $('#fjson').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.v||!Array.isArray(o.bills)||!o.shop)throw new Error('bad');confirmBox(`Replace ALL current data with this backup?\n(${o.bills.length} bills, ${(o.cust||[]).length} customers, ${(o.emp||[]).length} workers)`,()=>{db=o;const b=blank();for(const k in b)if(db[k]===undefined)db[k]=b[k];save(true);buildItems();FREQ=null;UI.buy=null;render();toast('Backup restored')},'Restore')}catch(er){toast('This is not a valid backup file',1)}};r.readAsText(f)});
  $('#fcsv').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImportCSV(r.result);r.readAsText(f)});
}


/* ================= Theme & background colours ================= */
const HDS=[['Green','#0b6b3b','#0b7a43'],['Blue','#11296c','#1a3fa6'],['Purple','#3b0f8f','#6d28d9'],['Teal','#0b3a46','#0e7490'],['Maroon','#5a0f24','#9f1239'],['Slate','#1f2937','#475569'],['Orange','#7c2d12','#c2410c']];
const BGL=[['Soft green','#f3f6f1'],['White','#ffffff'],['Cream','#fbf4e6'],['Sky','#eaf2fb'],['Pink','#fdeff3'],['Grey','#e9ecf1'],['Lavender','#f1ecfb']];
const BGD=[['Forest','#0f1511'],['Black','#05070c'],['Charcoal','#1a1d24'],['Midnight','#0e1320'],['Plum','#1a1024']];
function isDarkNow(){const r=document.documentElement;return (r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'}
function applyLook(){
  let L={};try{L=JSON.parse(localStorage.getItem('kirana_look')||'{}')||{}}catch(e){}
  const s=document.documentElement.style,h=HDS[L.h];
  if(h){s.setProperty('--hd',h[1]);s.setProperty('--ac2',h[2])}else{s.removeProperty('--hd');s.removeProperty('--ac2')}
  const d=isDarkNow(),c=d?L.bd:L.bl;if(c)s.setProperty('--bg',c);else s.removeProperty('--bg');
}
function lookSave(k,v){let L={};try{L=JSON.parse(localStorage.getItem('kirana_look')||'{}')||{}}catch(e){}if(v===null)delete L[k];else L[k]=v;try{localStorage.setItem('kirana_look',JSON.stringify(L))}catch(e){}applyLook()}
function lookBody(){
  let L={};try{L=JSON.parse(localStorage.getItem('kirana_look')||'{}')||{}}catch(e){}
  const d=isDarkNow(),list=d?BGD:BGL,cur=d?L.bd:L.bl;
  return '<div class="lk"><h4>Background ('+(d?'dark':'light')+' mode)</h4><div class="swr">'+list.map(x=>'<button class="sw'+(cur===x[1]?' on':'')+'" style="background:'+x[1]+'" title="'+x[0]+'" aria-label="'+x[0]+'" data-a="setBg" data-c="'+x[1]+'"></button>').join('')+'<label class="sw" style="position:relative;overflow:hidden;display:grid;place-items:center" title="Your own colour">🎨<input type="color" value="'+(cur||'#ffffff')+'" data-a="none" id="bgPick" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer"></label></div>'
   +'<h4>Header colour</h4><div class="swr">'+HDS.map((x,i)=>'<button class="sw'+(L.h===i?' on':'')+'" style="background:linear-gradient(135deg,'+x[1]+','+x[2]+')" title="'+x[0]+'" aria-label="'+x[0]+'" data-a="setHd" data-i="'+i+'"></button>').join('')+'</div>'
   +'<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button data-a="theme2">🌓 Dark / Light</button><button data-a="lookReset">↺ Reset colours</button></div></div>';
}
ACT.look=()=>modal('Theme & background',lookBody());
ACT.setBg=t=>{lookSave(isDarkNow()?'bd':'bl',t.dataset.c);ACT.look()};
ACT.setHd=t=>{lookSave('h',+t.dataset.i);ACT.look()};
ACT.lookReset=()=>{try{localStorage.removeItem('kirana_look')}catch(e){}applyLook();ACT.look()};
ACT.theme2=()=>{ACT.theme();applyLook();ACT.look()};
ACT.none=()=>{};
document.addEventListener('input',e=>{if(e.target.id==='bgPick'){lookSave(isDarkNow()?'bd':'bl',e.target.value)}});

/* ================= INIT ================= */
(function init(){
  try{const th=localStorage.getItem('kirana_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}applyLook();
  load();buildItems();setupFiles();
  try{const p=sessionStorage.getItem('kpage');if(p&&PAGES[p])page=p}catch(e){}
  render();
})();

</script>
</body>
</html>
