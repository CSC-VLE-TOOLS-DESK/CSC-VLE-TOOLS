rt.\nSet DNS manually if needed: Settings > Network > adapter > DNS server (e.g., 8.8.8.8 and 1.1.1.1).\nWi-Fi tools: netsh wlan show profiles ; netsh wlan show profile name=\"WiFiName\" key=clear ; netsh wlan show wlanreport (creates an HTML report).\nTrace the route: tracert google.com ; pathping google.com\nReset all network settings: Settings > Network & internet > Advanced network settings > Network reset.\nAlso restart router, check cable, update Wi-Fi driver, change Wi-Fi channel, move closer, check for 2.4 vs 5 GHz."}, {"t": "Step 9: Reset, in-place repair and clean install", "d": "Order of strength (least to most destructive):\n1. System Restore to a point before the issue.\n2. In-place repair upgrade: download the official Windows 11 ISO from Microsoft, mount it, run setup.exe, choose 'Keep personal files and apps'. Fixes many corruption problems without data loss.\n3. Settings > System > Recovery > Reset this PC > 'Keep my files' (removes apps) or 'Remove everything'. Choose 'Local reinstall' or 'Cloud download'.\n4. Clean install from USB (Media Creation Tool): erases the selected partition. Back up files, note licence/Microsoft account, download drivers beforehand.\nBefore reinstalling: back up files, browser bookmarks and passwords, license keys (for paid software), and email data.\nAfter reinstall: Windows Update, drivers, Defender, backup setup, BitLocker/Device encryption, restore data."}, {"t": "Step 10: Security hygiene and malware cleanup", "d": "1. Windows Security > Virus & threat protection > Quick scan, then Full scan and Microsoft Defender Offline scan.\n2. Check installed programs for unknown software; uninstall suspicious items.\n3. Check browser extensions and reset browser settings if the homepage or search engine keeps changing.\n4. Review startup items and scheduled tasks:\nschtasks /query /fo LIST /v | more\n5. Check network connections:\nnetstat -ano\ntasklist /svc\n6. Change passwords from a clean device, enable two-factor authentication.\n7. Keep Windows, browser and apps updated; use a standard user account daily; do not run cracked software; avoid unknown email attachments and links.\n8. Use a trusted second-opinion scanner (Malwarebytes free scan) if needed.\n9. Ransomware or serious compromise: disconnect the network, do not pay, contact IT or a professional, restore from offline backup.\n10. Turn on controlled folder access and SmartScreen in Windows Security for additional protection."}]}, {"id": "t_cmd_ref", "title": "CMD commands: complete reference (basic to advanced)", "steps": [{"t": "Step 1: How to open and use CMD, PowerShell and Terminal", "d": "Open Command Prompt: Win+R > cmd. As Administrator: search cmd > right-click > Run as administrator, or Win+X > Terminal (Admin).\nWindows 11 uses Windows Terminal with tabs for Command Prompt, PowerShell and WSL.\nTips:\n\u2022 Press the Up arrow to recall commands; Tab completes file names; F7 shows history.\n\u2022 Add /? to almost any command for help, for example: dir /?\n\u2022 Use & to run commands one after another, && to run the second only if the first succeeds, || to run the second only if the first fails.\n\u2022 Redirect output to a file: ipconfig /all > C:\\ipinfo.txt  (use >> to append).\n\u2022 Pipe output: tasklist | findstr chrome\n\u2022 Stop a running command with Ctrl+C. Clear screen with cls. Exit with exit.\n\u2022 Run as another user: runas /user:DOMAIN\\Username cmd\n\u2022 Elevate from PowerShell: Start-Process cmd -Verb RunAs\nBe careful: commands like del, rd, format, diskpart and reg delete can permanently delete data. Read each command before you run it."}, {"t": "Step 2: Navigation and file commands", "d": "dir  list files (dir /a hidden, dir /s subfolders, dir /o:s sort by size)\ncd  change folder (cd \\ root, cd .. up, cd /d D:\\Folder switch drive)\nD:  switch to drive D\nmd or mkdir  make folder (md Reports\\2026)\nrd  remove empty folder; rd /s /q Folder removes folder with contents (dangerous)\ncopy a.txt D:\\Backup\\  copy file\nxcopy C:\\Data D:\\Backup /E /I /H /Y  copy folders\nrobocopy C:\\Data D:\\Backup /E /R:2 /W:2  robust copy; add /MIR to mirror (deletes extras in destination)\nmove a.txt D:\\  move file\nren old.txt new.txt  rename\ndel file.txt  delete file; del /f /q /s forces and quiet, subfolders\ntype file.txt  show text; more file.txt page by page\ntree C:\\Folder /f  show folder tree with files\nattrib +h file  hide; attrib -h -s -r /s /d  clear attributes (useful for virus-hidden folders on USB)\nwhere notepad  find executable location\nfindstr /s /i \"word\" *.txt  search text in files\nfc a.txt b.txt  compare files\nmklink /d Link Target  create symbolic link\ncompact /c file  NTFS compress; tar -cf backup.tar Folder  create archives (Windows 10/11 has tar)\ncls  clear screen; echo text  print text; title  set window title; color 0a  green on black; pause  wait for key"}, {"t": "Step 3: System information commands", "d": "systeminfo  full system report (OS, RAM, hotfixes, boot time)\nver  Windows version\nhostname  computer name\nwhoami  current user; whoami /groups  privileges and groups\nset  environment variables; echo %USERNAME% %COMPUTERNAME% %USERPROFILE%\nwmic is deprecated and missing on newer Windows 11 builds; use PowerShell: Get-CimInstance Win32_ComputerSystem, Get-CimInstance Win32_BIOS, Get-CimInstance Win32_Processor\nGet-ComputerInfo  (PowerShell) detailed OS and hardware info\nmsinfo32  system information window\ndxdiag  DirectX and display info\nwinver  Windows version window\ndriverquery /v  installed drivers\ntasklist  running processes; tasklist /svc services in processes\ntaskkill /f /im chrome.exe  force close; taskkill /pid 1234 /f by process ID\nsc query  services; sc stop ServiceName; sc start ServiceName; sc config ServiceName start= auto\nnet start  list running services; net stop spooler; net start spooler\nshutdown /s /t 0  shutdown now; shutdown /r /t 0 restart; shutdown /a abort scheduled; shutdown /s /t 3600 shutdown in 1 hour; shutdown /r /o /f /t 0 restart into recovery menu\nlogoff  sign out; lock: rundll32 user32.dll,LockWorkStation\ndate /t  and  time /t\npowercfg /batteryreport  laptop battery health report (HTML)\npowercfg /energy  power efficiency report\npowercfg /list  power plans\npowercfg /a  show sleep states available\ngpupdate /force  refresh group policy; gpresult /r  applied policies"}, {"t": "Step 4: Disk and storage commands", "d": "chkdsk C: /f /r  check and repair disk\nsfc /scannow  repair protected system files\nDISM /Online /Cleanup-Image /RestoreHealth  repair component store\ndefrag C: /O  optimise (right type for SSD or HDD)\ncleanmgr  Disk Cleanup; cleanmgr /sageset:1 then /sagerun:1\nvol  show volume label; label C: NewName\nformat D: /fs:ntfs /q  quick format (ERASES the drive, check the letter first)\nconvert D: /fs:ntfs  convert FAT32 to NTFS without data loss\nfsutil volume diskfree C:  free space; fsutil fsinfo drives  list drives; fsutil behavior query DisableDeleteNotify  check TRIM\ncipher /w:C:\\  wipe free space\ndiskpart  disk partitioning tool (very powerful):\n list disk  | select disk 1  | list partition  | list volume | select volume 3 | assign letter=Z | detail disk\n clean  erases the whole selected disk. Always run 'list disk' and 'select disk' and check the size twice.\n create partition primary | format fs=ntfs quick | active | convert gpt (needs empty disk)\n exit\nUSB repair when a drive shows 0 bytes or is write protected: diskpart > list disk > select disk N > attributes disk clear readonly > clean > create partition primary > format fs=fat32 quick (or ntfs) > assign\nbitlocker: manage-bde -status ; manage-bde -protectors -get C:"}, {"t": "Step 5: Network commands", "d": "ipconfig  basic IP; ipconfig /all full details; /release  /renew  /flushdns  /displaydns  /registerdns\nping google.com  test; ping -t host continuous; ping -n 10 host count\ntracert google.com  hops; pathping google.com  hops with loss\nnslookup google.com  DNS lookup; nslookup -type=mx domain.com  mail records\nnetstat -ano  connections with PID; netstat -b  show programs (admin); netstat -an | findstr :80\narp -a  IP to MAC list; getmac  MAC address\nroute print  routing table; route -f  clear routes (careful)\nnbtstat -n  NetBIOS names; net view  shared computers\nnet use Z: \\\\PC\\Share /persistent:yes  map drive; net use * /delete\nnet share  list shares; net user  list users; net localgroup administrators\nnetsh interface show interface  adapters\nnetsh wlan show profiles  saved Wi-Fi; netsh wlan show profile name=\"X\" key=clear  shows saved password (admin)\nnetsh wlan show networks mode=bssid  nearby Wi-Fi with channels and signal\nnetsh wlan show wlanreport  Wi-Fi history report\nnetsh winsock reset  and  netsh int ip reset  fix network stack\nnetsh advfirewall show allprofiles  firewall status; netsh advfirewall set allprofiles state on\nnetsh interface ip set address \"Ethernet\" static 192.168.1.50 255.255.255.0 192.168.1.1  static IP\nnetsh interface ip set dns \"Ethernet\" static 8.8.8.8\nnetsh interface ip set address \"Ethernet\" dhcp  back to automatic\ncurl -I https://example.com  fetch headers; curl -o file.zip https://example.com/file.zip  download\nssh user@host  remote shell (OpenSSH is built-in)\nmstsc  Remote Desktop client; msra /offerra  Remote Assistance\nResetting everything quickly: netsh winsock reset & netsh int ip reset & ipconfig /flushdns & restart."}, {"t": "Step 6: Printer and Windows Update service commands", "d": "Printer:\nnet stop spooler\ndel /q /f /s %systemroot%\\System32\\spool\\PRINTERS\\*\nnet start spooler\nprintui /s /t2  open print server driver list (remove old drivers)\nprintmanagement.msc  Print Management (Pro and above)\nrundll32 printui.dll,PrintUIEntry /il  add printer wizard\nPowerShell: Get-Printer | Format-Table Name,DriverName,PortName,PrinterStatus ; Get-PrinterDriver ; Get-PrinterPort ; Remove-Printer -Name \"Name\" ; Set-Printer ; Restart-Service Spooler\nWindows Update:\nnet stop wuauserv & net stop bits & net stop cryptsvc\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nren C:\\Windows\\System32\\catroot2 catroot2.old\nnet start cryptsvc & net start bits & net start wuauserv\nusoclient StartScan  trigger update check (works on many builds; if not, use Settings)\nwuauclt /detectnow  legacy\nPowerShell (Admin, optional module): Install-Module PSWindowsUpdate ; Get-WindowsUpdate ; Install-WindowsUpdate\nwinget upgrade  list app updates; winget upgrade --all  update all apps"}, {"t": "Step 7: User, security and policy commands", "d": "net user  list local users\nnet user Name * /add  create user (prompts for password)\nnet user Name /active:no  disable user\nnet localgroup administrators Name /add  make admin (use carefully)\nnet user administrator /active:yes  enable built-in admin (security risk; disable after use)\nwhoami /priv  privileges\ncmdkey /list  stored credentials\nicacls \"C:\\Folder\" /grant Users:(OI)(CI)F  grant folder permission; icacls \"C:\\Folder\" /reset /t  reset permissions\ntakeown /f \"C:\\Folder\" /r /d y  take ownership (admin)\nsecedit /export /cfg C:\\sec.cfg  export security policy\ngpedit.msc  local group policy (Pro and above); lusrmgr.msc local users; secpol.msc security policy; certmgr.msc certificates\nreg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion  read registry; reg export HKLM\\SOFTWARE\\Key C:\\key.reg  backup a key before editing; reg add / reg delete  edit (risky, back up first)\nschtasks /query /fo LIST  scheduled tasks; schtasks /create /tn \"Name\" /tr \"C:\\script.bat\" /sc daily /st 09:00 /rl highest\nWindows Security from CMD: PowerShell: Get-MpComputerStatus ; Update-MpSignature ; Start-MpScan -ScanType QuickScan\nBitLocker, device encryption: manage-bde -status\nWindows activation: slmgr /xpr  activation expiry; slmgr /dli  license info (use only with genuine licences)"}, {"t": "Step 8: Run-box shortcuts (Win+R) and management consoles", "d": "control  Control Panel; ncpa.cpl  network adapters; appwiz.cpl  programs; sysdm.cpl  System Properties; inetcpl.cpl  internet options; powercfg.cpl  power options; main.cpl  mouse; mmsys.cpl  sound; timedate.cpl  date and time; intl.cpl  region; firewall.cpl  firewall; wf.msc  firewall advanced\ndevmgmt.msc  Device Manager; diskmgmt.msc  Disk Management; compmgmt.msc  Computer Management; services.msc  Services; eventvwr  Event Viewer; taskschd.msc  Task Scheduler; perfmon  Performance Monitor; resmon  Resource Monitor; msconfig  System Configuration; regedit  Registry Editor; taskmgr  Task Manager; mdsched  Memory diagnostics; dfrgui  optimise drives; cleanmgr  Disk Cleanup; snippingtool  screenshots; calc, notepad, mspaint, charmap, osk (on-screen keyboard)\n%temp%  temp folder; temp  Windows temp; prefetch  Prefetch; shell:startup  user startup folder; shell:common startup  all users startup; shell:downloads; shell:appdata; %appdata%; %localappdata%; %programdata%; recent\nms-settings:windowsupdate  opens Windows Update settings; ms-settings:storagesense  opens Storage Sense; ms-settings:printers  opens Printers & scanners\nTip: put frequently used commands in a text file as your own cheat sheet."}, {"t": "Step 9: Batch files and basic scripting", "d": "A batch file (.bat) is a text file with commands. Create in Notepad, save as name.bat with 'All files'.\nBasics:\n@echo off  hide commands\necho Hello  print text\nset name=Ravi  variable; echo %name%\nset /p name=Enter your name:  ask input\nif exist C:\\file.txt echo found  condition\nif \"%name%\"==\"Ravi\" (echo Hi) else (echo Who?)\nfor %%f in (*.txt) do echo %%f  loop over files (in a .bat use %% ; at the prompt use %)\nfor /l %%i in (1,1,5) do echo %%i  count 1 to 5\ngoto label / :label  jumps\ncall other.bat  run another batch\ntimeout /t 5  wait; pause  wait for key\nexit /b 0  end script\nExamples:\nBackup script: robocopy \"C:\\Users\\%USERNAME%\\Documents\" \"D:\\Backup\\Docs\" /E /R:2 /W:2 /XD tmp\nDaily log: echo %date% %time% >> C:\\log.txt\nRun as Administrator check: net session >nul 2>&1 || (echo Run as administrator & pause & exit)\nSchedule it: schtasks /create /tn \"Backup\" /tr \"C:\\scripts\\backup.bat\" /sc daily /st 20:00\nPowerShell basics for advanced users: Get-Help command; Get-Process; Get-Service; Get-EventLog -LogName System -Newest 20; Get-ChildItem; Select-String; Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; winget and WSL (wsl --install) for Linux tools.\nAlways test destructive scripts on a test folder first."}, {"t": "Step 10: Safety rules and daily admin routine", "d": "Dangerous commands: format, diskpart clean, del /s, rd /s /q, robocopy /MIR, reg delete, bcdedit changes, net user admin changes, takeown/icacls on system folders. Always double-check drive letters and paths.\nDo not run commands copied from unknown websites, social media or chat groups; read what each part does. Be careful with commands that download and run code.\nDaily/Weekly/Monthly routine:\n\u2022 Daily: restart if the PC is slow; keep files backed up.\n\u2022 Weekly: Windows Update, Defender quick scan, check free disk space (more than 20% free).\n\u2022 Monthly: run cleanup (Storage settings, temp files), winget upgrade --all, review startup apps, sfc /scannow if there were crashes, check backup works by restoring one file.\n\u2022 Quarterly: check SSD/HDD health, battery report (laptop), clean dust from fans, review installed apps.\n\u2022 Yearly: refresh system image or recovery drive, review passwords and two-factor, plan hardware replacement if the PC is over 6-8 years old.\nKeep a notebook of what you changed and why. When in doubt, search the exact error code on Microsoft or the maker's support site."}]}
,{"id": "t_csc_vle_github_vscode", "title": "CSC VLE TOOLS — GitHub & VS Code Guide", "steps": [{"t": "1. Your confirmed setup", "d": "Keep these details for future reference.\n\nGitHub account: CSC-VLE-TOOLS-DESK\nRepository: CSC-VLE-TOOLS\nBranch: main\nLocal folder: C:\\Users\\chauh\\Documents\\CSC-VLE-TOOLS\\\nGit remote: origin\nGitHub Pages source: main branch, root folder\nLive website: https://csc-vle-tools-desk.github.io/CSC-VLE-TOOLS/\n\nIMPORTANT: The live website, GitHub repository, and local VS Code folder are three different things.\n• Local folder: where you edit your website.\n• GitHub repository: where your website files are stored online.\n• GitHub Pages: where visitors see the published website.\n\nYour current setup is working correctly."}, {"t": "2. The normal daily workflow", "d": "Use this process whenever you want to change your website.\n\nSTEP 1 — Open your project\n1. Open VS Code.\n2. Open the CSC-VLE-TOOLS folder.\n3. Confirm that the branch is main.\n\nSTEP 2 — Get the latest changes\nOpen Terminal → New Terminal and run:\n git pull\nThis downloads the latest changes from GitHub. If Git says your branch is already up to date, continue.\n\nSTEP 3 — Edit your website\nOpen the required HTML file, such as index.html. Make your changes and save with Ctrl + S.\n\nSTEP 4 — Test your changes\nUse VS Code's Live Server extension if installed, or open the HTML file in your browser. Check that the page opens correctly, buttons and links work, images and CSS load, and existing tools still work.\n\nSTEP 5 — Save your changes to GitHub\nOpen the Source Control panel in VS Code. Review the changed files. Enter a commit message, such as Update homepage layout. Click Commit, then Sync Changes or Push. If VS Code asks you to stage changes, stage the files you intend to include.\n\nSTEP 6 — Check the live website\nWait for GitHub Pages to finish deploying. Open your live website and refresh it. If the old version still appears, wait a little longer and refresh again."}, {"t": "3. Important Git commands", "d": "Run these commands in the VS Code Terminal, not in the browser.\n\ngit status — Check whether files have changed\ngit remote -v — Check your GitHub connection\ngit branch --show-current — Check the current branch\ngit pull — Download changes from GitHub\ngit add . — Stage all changes in the current folder\ngit commit -m \"Update website\" — Save a local change record\ngit push — Upload committed changes to GitHub\ngit log -5 --oneline — View the last five commits\n\nYou do not need to use every command every time. The normal VS Code Source Control buttons can perform most of these actions."}, {"t": "4. Problem 1 — Git is not recognized", "d": "ERROR: git is not recognized as an internal or external command.\n\nSolution:\n1. Install Git for Windows from https://git-scm.com/download/win\n2. Close VS Code.\n3. Reopen VS Code.\n4. Run this command in Terminal: git --version\n\nYour Git installation is already working, so you do not need to do this again unless the problem returns."}, {"t": "5. Problem 2 — Git Clone does not appear", "d": "Solution:\n1. Press Ctrl + Shift + P.\n2. Type Git: Clone.\n3. Select the command.\n4. Paste this repository address:\nhttps://github.com/CSC-VLE-TOOLS-DESK/CSC-VLE-TOOLS.git\n5. Select a destination folder.\n\nDo not clone the repository inside another copy of itself."}, {"t": "6. Problem 3 — Git asks for a repository destination", "d": "Choose a folder where you want to store the project. For your current setup, use:\nC:\\Users\\chauh\\Documents\\\n\nVS Code will create the CSC-VLE-TOOLS folder inside it. If the folder already exists, choose a different parent folder or open the existing repository instead of cloning again."}, {"t": "7. Problem 4 — GitHub asks you to sign in", "d": "1. Complete the browser sign-in.\n2. Confirm that you are using the correct GitHub account.\n3. Return to VS Code.\n4. Retry the Git operation if needed.\n\nDo not share your password or access token with anyone."}, {"t": "8. Problem 5 — Wrong repository or branch", "d": "Run these commands:\ngit remote -v\ngit branch --show-current\n\nCheck that the remote URL is the correct CSC-VLE-TOOLS repository and the branch is main. If the remote URL is incorrect, do not push anything until it is corrected."}, {"t": "9. Problem 6 — Branch has diverged", "d": "This means your local and online copies contain different commits.\n\n1. First run: git status\n2. If you have local changes, save them before trying to synchronize.\n3. Then run: git pull --rebase\n\nIf Git reports conflicts, stop and resolve them carefully. Do not use force push or reset commands to try to fix the problem."}, {"t": "10. Problem 7 — Nothing to commit", "d": "Example message: nothing to commit, working tree clean.\n\nThis is a normal and successful result. It means Git has no new changes to save."}, {"t": "11. Problem 8 — GitHub Pages does not update", "d": "Check the following:\n1. Open the GitHub repository.\n2. Click Actions.\n3. Open the latest Pages deployment workflow.\n4. Check whether it succeeded.\n5. Confirm that the Pages source is still main and /(root).\n\nIf deployment failed, open the workflow log and read the error. Do not change the Pages settings unless the error indicates that a change is required."}, {"t": "12. Problem 9 — Website shows an old version", "d": "1. Wait for the Pages deployment to finish.\n2. Open the website in a new browser tab.\n3. Press Ctrl + F5 to refresh without using the normal cached page.\n4. Check that the latest changes were actually pushed to GitHub.\n\nIf the site still shows the old version, check the deployment status before changing any files."}, {"t": "13. Problem 10 — Website shows a 404 error", "d": "Check that:\n• The repository name is correct.\n• The website URL contains /CSC-VLE-TOOLS/.\n• The repository contains an index.html file in its root folder.\n• GitHub Pages is enabled.\n\nYour current website is working, so do not change these settings unless the error occurs."}, {"t": "14. Problem 11 — VS Code shows Restricted Mode", "d": "If the folder is your own trusted project:\n1. Click Manage in the Restricted Mode banner.\n2. Select Trust this folder.\n3. Confirm the choice.\n\nOnly trust folders whose contents you understand."}, {"t": "15. Problem 12 — Accidentally changed the wrong files", "d": "Before committing:\n1. Open Source Control.\n2. Review every changed file.\n3. Open the diff to inspect the changes.\n4. Discard only the changes you know are unwanted.\n\nIf you are unsure, stop and make a backup before proceeding."}, {"t": "16. GitHub Pages settings", "d": "Your current configuration is:\n\nSettings → Pages\nSource: Deploy from a branch\nBranch: main\nFolder: / (root)\n\nDo not change this configuration during normal website editing. Your site is deployed from the root of the main branch. A successful push to main can trigger a new deployment."}, {"t": "17. Safe website editing rules", "d": "Follow these rules to avoid losing your website:\n1. Always open the correct CSC-VLE-TOOLS repository.\n2. Check the branch before editing.\n3. Pull the latest changes before starting work.\n4. Make a backup before major changes.\n5. Test HTML, CSS, and JavaScript before publishing.\n6. Review changed files before committing.\n7. Never use force push or destructive Git commands unless you understand their consequences.\n8. Do not delete existing tools or assets unless they are intentionally being replaced.\n9. Do not change GitHub Pages settings during ordinary editing.\n10. Check the live website after every deployment."}, {"t": "18. Quick troubleshooting checklist", "d": "When something goes wrong, follow this order:\n• Check the repository name.\n• Check that the branch is main.\n• Run git status.\n• Run git remote -v.\n• Check whether the files are saved.\n• Check whether the changes were committed and pushed.\n• Check the GitHub Pages deployment status.\n• Refresh the live website.\n\nIf you cannot identify the problem, take a screenshot of the error and the VS Code Terminal. Do not run unfamiliar commands or delete files to try to fix it."}, {"t": "19. Useful links", "d": "GitHub repository:\nhttps://github.com/CSC-VLE-TOOLS-DESK/CSC-VLE-TOOLS\n\nGitHub Pages settings:\nhttps://github.com/CSC-VLE-TOOLS-DESK/CSC-VLE-TOOLS/settings/pages\n\nGitHub Actions deployments:\nhttps://github.com/CSC-VLE-TOOLS-DESK/CSC-VLE-TOOLS/actions\n\nLive website:\nhttps://csc-vle-tools-desk.github.io/CSC-VLE-TOOLS/"}, {"t": "20. Final reminder", "d": "Your current GitHub and VS Code setup is complete and working. Keep this guide as your reference, and follow the normal daily workflow whenever you edit the website.\n\nFor major changes, work on one tool at a time, test it, and then publish the finished changes to GitHub."}]}]

function newId(){return "t"+Date.now()+Math.random().toString(36).slice(2,6)}
function cleanTopic(t){return {id:String(t.id||newId()),title:String(t.title||"Untitled topic"),steps:(Array.isArray(t.steps)&&t.steps.length?t.steps:[{t:"Add your first step",d:""}]).map(function(x){

function parseText(name,txt){
  var title=name.replace(/\.[^.]+$/,""),steps=[],cur=null,first=true;
  var startRe=/^\s*(?:\d+[.)]|[-*\u2022]|step\s*\d+\s*[:.\-\u2013]?)\s+(.*)$/i;
  txt.replace(/\r/g,"").split("\n").forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var m=l.match(startRe);
    if(m){cur={t:"",d:""};var x=m[1],k=x.search(/\s[-\u2013\u2014]\s|:\s/);
      if(k>0&&k<90){cur.t=x.slice(0,k).trim();cur.d=x.slice(k).replace(/^\s*[-\u2013\u2014:]\s*/,"")}else cur.t=x;
      steps.push(cur)}
    else if(cur){cur.d+=(cur.d?"\n":"")+l}
    else if(first){title=l.replace(/^#+\s*/,"");first=false}
    else{cur={t:l.replace(/^#+\s*/,""),d:""};steps.push(cur)}
  });
  if(!steps.length)steps.push({t:"Report",d:txt.trim()});
  return {id:newId(),title:title,steps:steps}
}
function importText(name,txt){
  txt=String(txt||"").replace(/^\uFEFF/,"");
  if(!txt.trim())return "The file is empty.";
  var o=null;try{o=JSON.parse(txt)}catch(e){}
  var list=null;
  if(o&&Array.isArray(o.topics))list=o.topics;else if(Array.isArray(o))list=o;else if(o&&o.title&&o.steps)list=[o];
  list=list?list.filter(function(t){return t&&typeof t==="object"}).map(cleanTopic):[parseText(name,txt)];
  if(!list.length)return "No topics found in this file.";
  list.forEach(function(t){var i=S.topics.findIndex(function(x){return x.id===t.id});if(i>-1)S.topics[i]=t;else S.topics.push(t)});
  S.cur=list[0].id;S.pos[S.cur]=0;editing=false;armed="";save();render();
  return "Added "+list.length+" topic"+(list.length>1?"s":"")+": "+list.map(function(t){return t.title}).join(", ")
}
