<style>
:root{--bg:#F1F4F8;--panel:#fff;--ink:#14202E;--mute:#5B6B7C;--line:#D5DCE5;--acc:#0F6E8C;--acc-ink:#fff;--soft:#E2EFF4;--bad:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--panel:#17222E;--ink:#E8EEF4;--mute:#9AABBC;--line:#2B3A4A;--acc:#4FB6D6;--acc-ink:#06222C;--soft:#1C3340;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F1720;--panel:#17222E;--ink:#E8EEF4;--mute:#9AABBC;--line:#2B3A4A;--acc:#4FB6D6;--acc-ink:#06222C;--soft:#1C3340;--bad:#FF8A80}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,"Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:1020px;margin:0 auto;padding:16px;display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:760px){.app{grid-template-columns:1fr}}
.side,.win{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.side{padding:14px;align-self:start}
.side h1{font-size:18px;margin:0 0 10px}
.topics{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.topics button{width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;justify-content:space-between;gap:8px}
.topics button[aria-current="true"]{background:var(--soft);border-color:var(--acc);font-weight:700}
.topics small{color:var(--mute);white-space:nowrap}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:140px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.d{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.win{overflow:hidden;display:flex;flex-direction:column;min-height:440px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.bar h2{margin:0;font-size:17px;overflow-wrap:anywhere}
.body{padding:20px;flex:1;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media(max-width:520px){.body{grid-template-columns:1fr}}
.num{font-size:64px;line-height:1;font-weight:700;color:var(--acc);min-width:64px}
.step h3{margin:0 0 8px;font-size:22px;overflow-wrap:anywhere}
.step p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.edit label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);padding:0;font-size:13px}
.dots button[aria-current="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.dots button.done{border-color:var(--acc)}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.note{color:var(--mute);font-size:14px;margin:8px 0 0}
details{margin-top:12px;font-size:14px}summary{cursor:pointer;color:var(--mute)}
.empty{padding:30px;color:var(--mute)}
.io{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}.io .note{flex-basis:100%;margin:2px 0 0}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

if(!S||!S.topics)S=seed();
var EXTRA=[{"id": "t_trading_strategy", "title": "Indian Market Trading Strategy (Deep Step Guide)", "steps": [{"t": "Step 1: Market foundations", "d": "GOAL: Understand how the Indian market works so nothing in a trade surprises you.\n\nEXCHANGES: NSE (Nifty 50, Bank Nifty, Fin Nifty, Midcap) and BSE (Sensex). Regulator: SEBI. Settlement is T+1.\n\nTIMINGS (IST): Pre-open 9:00-9:08 (order entry), 9:08-9:15 (matching). Normal market 9:15-3:30. Closing window about 3:30-3:40.\n\nSEGMENTS:\n\u2022 Cash Delivery (CNC): full payment, no leverage, hold any time. Safest for beginners.\n\u2022 Cash Intraday (MIS): leverage, broker auto-squares off around 3:15-3:25.\n\u2022 Futures: leveraged contracts, daily mark-to-market, fixed lot size.\n\u2022 Options: Call/Put rights. Buyers risk only premium; sellers carry large risk.\n\nORDER TYPES: Market (instant, slippage risk), Limit (your price, default for entries), Stop-loss SL / SL-M (your safety belt, place right after entry), Bracket/Cover/GTT (disciplined exits; GTT for swing), AMO (plan next-day orders calmly).\n\nCIRCUITS AND BANS: Stocks have daily price bands (2/5/10/20%); near the lower circuit you may be unable to exit. Index circuit breakers at 10/15/20%. Stocks in the F&O ban list allow only position-reducing trades. Avoid ASM/GSM stocks.\n\nMARGIN: Leverage multiplies profit and loss. A 1% adverse move at 5x leverage is a 5% loss. Use leverage only after 3+ consistent profitable months in cash.\n\nCOSTS (verify current rates): Brokerage, STT (delivery 0.1% buy and sell; intraday equity about 0.025% sell; futures about 0.02% sell; options about 0.1% of premium on sell), exchange charges, 18% GST on brokerage, SEBI fee, stamp duty (0.015% delivery buy, 0.003% intraday buy), DP charge about Rs 13-20 per scrip on delivery sell.\nBreak-even logic: round-trip cost 0.1% x 20 trades a month on Rs 1,00,000 is about Rs 2,000. Fewer, better trades win.\n\nCHECKLIST: I know timings, order types, CNC/MIS/NRML, auto-square-off; I opened a demat account with a SEBI-registered broker with 2-factor login; I calculated break-even per trade."}, {"t": "Step 2: Capital and risk management", "d": "GOAL: Survive first. Profit is a by-product of controlled losses.\n\nPOSITION SIZE FORMULA:\nQuantity = (Capital x Risk%) / (Entry - Stop-loss)\nExample: Capital Rs 3,00,000, risk 1% = Rs 3,000. Buy at 250, stop 240 (risk Rs 10/share). Quantity = 300 shares, investment Rs 75,000, loss if stopped = Rs 3,000.\n\nLIMITS:\n\u2022 Risk per trade: 0.5-1% beginners, up to 2% experienced, never more.\n\u2022 Total open risk across positions: max 5-6%.\n\u2022 Daily loss limit 2-3%: hit it, close the terminal.\n\u2022 Weekly 6%, monthly 10%: hit it, halve size or pause.\n\nDRAWDOWN MATH (gain needed to recover): lose 10% need 11.1%; 20% need 25%; 30% need 42.9%; 50% need 100%; 70% need 233%.\n\nWHERE TO PUT A STOP:\n\u2022 Structure stop: below swing low (long) or above swing high (short).\n\u2022 ATR stop: entry minus 1.5-2 x ATR(14).\n\u2022 Percentage stop: 1-2% intraday, 5-8% swing, only as a cap.\n\u2022 Time stop: exit if no move in N candles/days.\n\u2022 Never widen a stop; only trail it to reduce risk.\n\nRISK-REWARD AND EXPECTANCY:\nExpectancy = (Win% x Avg win) - (Loss% x Avg loss). Example: 40% wins, avg win 2,000, avg loss 1,000 gives +Rs 200 per trade.\nBreak-even win rate = 1 / (1 + RR). At 1:2 you need about 34%. Win rate 30% needs RR 1:2.33; 40% needs 1:1.5; 50% needs 1:1; 60% needs 1:0.67; 70% needs 1:0.43 (option sellers: tail risk).\n\nCAPITAL BUCKETS (example Rs 5,00,000): 50% long-term investing, 30% swing, 15% active (intraday/F&O), 5% cash reserve.\nNever trade borrowed money, EMI money, or funds needed within 3 years. Keep 6 months of expenses outside the market.\n\nCHECKLIST: I know my rupee risk before every entry; I wrote daily/weekly/monthly loss limits; I can size a trade; my RR is at least 1:1.5."}, {"t": "Step 3: Pre-market and top-down analysis", "d": "GOAL: Know the market mood before the first order. Trade with the wind.\n\nFUNNEL: Global -> India macro -> Index trend -> Sector -> Stock.\n\nMORNING ROUTINE:\n\u2022 7:30 US close, Asian markets, Dollar index, US bond yields.\n\u2022 7:45 Brent crude (rising crude hurts India), gold, USD-INR.\n\u2022 8:00 GIFT Nifty: indicates the gap. Gap above 0.5% means watch gap setups.\n\u2022 8:15 News: results, RBI, block deals, SEBI circulars, corporate actions.\n\u2022 8:30 FII/DII flows (look at multi-day trend, not one day).\n\u2022 8:45 Levels: previous day high/low/close, pivots, 3-5 watchlist stocks with a plan.\n\u2022 9:00-9:08 Pre-open prices for the watchlist.\n\nREADING INPUTS:\n\u2022 India VIX: below 13 calm, 13-20 normal, above 20-25 fear. High VIX = wider stops, smaller size, expensive options.\n\u2022 Advance/Decline: index up with weak breadth = fragile rally.\n\u2022 % stocks above 200 DMA: above 60% healthy, below 30% bearish or bottoming.\n\u2022 PCR: about 0.7 or below overbought, 1.3+ oversold (contrarian, confirm with price).\n\nCLASSIFY THE DAY:\n\u2022 Strong uptrend (price above 20/50/200 EMA, strong breadth): buy pullbacks and breakouts.\n\u2022 Strong downtrend: sell rallies/short or stay in cash.\n\u2022 Sideways: trade range edges small, or skip.\n\u2022 Event day (Budget, RBI, results, global shock): cut size 50% or wait.\n\nSECTOR ROTATION: Use Nifty sector indices. Pick the top 2-3 sectors showing relative strength vs Nifty and trade leaders within them. Avoid sectors under their 50 DMA.\n\nEVENT CALENDAR: Union Budget (Feb 1), RBI policy (about every 2 months), results seasons (Jan-Feb, Apr-May, Jul-Aug, Oct-Nov), index expiry days (check current schedule), US Fed/CPI/jobs data. Avoid big fresh positions before binary events unless sized for a gap.\n\nCHECKLIST: Routine finished before 9:10; day labelled; 3-5 stocks with entry/stop/target; events and expiries checked."}, {"t": "Step 4: Technical analysis logic", "d": "GOAL: Every entry has a reason, a stop and a target.\n\nPRINCIPLES: Price discounts everything. Trends persist. Crowd psychology repeats. Price and volume first, indicators second.\n\nTREND: Uptrend = higher highs and higher lows; downtrend = lower highs and lower lows. 20 EMA short, 50 EMA medium, 200 DMA bull/bear line. Rising 20 above 50 above 200 is the strongest alignment.\n\nLEVELS: Zones, not lines: repeated turning points, previous day high/low, round numbers, gap edges, 52-week highs. Broken resistance becomes support (role reversal). Daily pivots: P = (H+L+C)/3, R1 = 2P-L, S1 = 2P-H, R2 = P+(H-L), S2 = P-(H-L).\n\nCANDLES (context decides): Hammer/pin bar at support; shooting star at resistance; engulfing at key levels with volume; doji = indecision, wait; inside bar = trade the break of the mother candle; marubozu = strong momentum.\n\nVOLUME: Breakout volume at least 1.5x the 20-day average is more reliable. Delivery percentage high on breakout = real buying. VWAP: above = buyers in control, below = sellers.\n\nINDICATORS (use at most 3):\n\u2022 EMA 9/20/50/200: trend and dynamic support; whipsaws in ranges.\n\u2022 RSI 14: above 50 bullish, below 50 bearish; divergence warns of reversal; overbought can persist in strong trends.\n\u2022 MACD 12/26/9: momentum shifts; lagging.\n\u2022 Supertrend 10,3: trailing stop; flips in chop.\n\u2022 Bollinger 20,2: squeeze signals breakout.\n\u2022 ATR 14: stop distance and sizing.\n\u2022 ADX 14: above 25 trending, below 20 no trend.\n\nPATTERNS (entry / stop / target):\n\u2022 Flag: break of flag with volume / below flag low / flagpole height.\n\u2022 Cup and handle or base: break above pivot on volume / below handle low / depth of base or trail.\n\u2022 Double top/bottom: neckline break / beyond second peak / pattern height.\n\u2022 Head and shoulders: neckline break / above right shoulder / head-to-neckline distance.\n\u2022 Triangle: boundary break with volume / opposite boundary / widest part.\n\u2022 VCP: tightest pivot break / below last contraction / trail with 20 EMA.\n\nMULTI-TIMEFRAME: Intraday 15-min trend, 5-min setup, 1-min entry. Swing: weekly trend, daily setup, 1-hour entry. Trade only when the higher timeframe agrees.\n\nENTRY CHECKLIST: Higher timeframe agrees; price at a meaningful level; trigger candle/breakout; volume supports; logical stop with RR 1:1.5-2; size calculated and total risk within limits."}, {"t": "Step 5: Intraday playbook", "d": "GOAL: Trade only the highest-probability setups at the right time.\n\nSTOCK SELECTION: Liquid (Nifty 50/F&O stocks), daily range at least 1.5-2%, relative volume above average, a catalyst (results, news, sector strength, gap with volume). Avoid penny stocks, operator-prone counters and anything near circuit limits.\n\nTIME PLAN:\n\u2022 9:15-9:30: chaos; observe; mark opening range high/low. Beginners do not trade.\n\u2022 9:30-11:30: best window; take the best 1-2 setups.\n\u2022 11:30-1:30: lunch lull, fake breakouts; avoid new trades.\n\u2022 1:30-2:30: volume returns; second chance for trend continuation.\n\u2022 2:30-3:15: positioning/expiry volatility; book profits; no fresh entries after 3:00.\n\u2022 3:15-3:25: be flat. Never rely on auto square-off.\n\nSETUP A, OPENING RANGE BREAKOUT: A 5-min candle closes above the 15-min range high with volume and above VWAP, Nifty not falling. Stop at range mid-point/low or below VWAP. Target 1:2. Skip if the range is too wide (stop too large) or too narrow (no volume). Shorts are the mirror.\n\nSETUP B, VWAP PULLBACK: In a trending day, stock above VWAP makes a higher low near VWAP/20 EMA on 5-min; enter above the bullish candle. Stop below pullback low. Target previous high, then trail. Skip if price keeps crossing VWAP (range day).\n\nSETUP C, GAPS:\n\u2022 Gap-up with news and volume holding the opening range: buy the break.\n\u2022 Gap-up with no news fading below opening low: short on break, stop above high.\n\u2022 Gap-down recovering above previous close: buy, stop below day low.\n\u2022 Gap beyond 3-4%: wait 30 minutes for structure.\n\nSETUP D: Reversal only at pre-marked daily levels with a rejection candle, small size. Trend day: add on shallow dips with a trailing stop; never short strength early.\n\nMANAGEMENT: Limit/SL-limit entry, stop immediately. Book 50% at 1:1 and move stop to cost; trail the rest under 5-min higher lows or 9 EMA. Exit when the reason disappears. No averaging down. Max 2-3 trades a day; stop after 2 consecutive losses.\n\nEXAMPLE: Capital Rs 2,00,000, risk 1% = Rs 2,000. Opening range 1,000-1,008. At 9:40 a 5-min close at 1,010 on volume above VWAP 1,004. Entry 1,010, stop 1,002 (risk 8), target 1,026. Quantity 250. Win = Rs 4,000, loss = Rs 2,000 before costs. At 1,018 sell 125 and move stop to 1,010.\n\nCHECKLIST: Only high-probability windows; one proven setup known by heart; stop for the day after the loss limit or 2 straight losses."}, {"t": "Step 6: Swing and positional trading", "d": "GOAL: Capture multi-day to multi-week moves with less stress and lower cost.\n\nWHY: Needs 30-60 minutes after market, uses delivery, fewer trades, less noise.\n\nSCREENING (weekend):\n\u2022 Trend: close above 50 and 200 DMA, 50 above 200.\n\u2022 Relative strength: outperforming Nifty over 3 and 6 months.\n\u2022 Liquidity: average daily turnover above Rs 5-10 crore.\n\u2022 Within about 10-15% of the 52-week high.\n\u2022 Fundamental sanity: growing profit, no heavy debt or promoter pledge.\n\u2022 Sector index above its 50 DMA.\n\nSETUPS:\n\u2022 Pullback in uptrend: 8-15% dip to the rising 20/50 EMA on lighter volume, then a bullish candle; enter above it; stop below pullback low.\n\u2022 Base breakout: 4-12 weeks tight consolidation; enter on close above pivot with 1.5-2x volume; stop below base low (8% max).\n\u2022 Earnings breakout: strong results with a gap-up on volume; buy the first consolidation, not the gap.\n\u2022 Reversal at weekly support (advanced): wider stops, smaller size.\n\nMANAGEMENT: Structural initial stop with 1% risk. Sell 1/3-1/2 at 1:2 and move stop to cost. Trail under the 20 EMA or higher swing lows; exit on a daily close below the 20 EMA (fast) or 50 DMA (slow). Reduce before results unless sized for a gap. Add only to winners, in smaller size.\n\nPORTFOLIO RULES: 5-8 positions max, no more than 2 per sector, total open risk under 6%, hold 30-50% cash when Nifty is below its 50 DMA.\n\nWEEKLY CYCLE: Saturday screen and build a 15-20 chart watchlist with alerts. Sunday review the journal and plan events. Weekday evenings 30 minutes: alerts, trailing stops, AMO/GTT.\n\nCHECKLIST: Repeatable screening process; every trade has stop, partial-profit plan and trailing rule before entry; risk and sector exposure within limits."}, {"t": "Step 7: Fundamental and investing layer", "d": "GOAL: Build wealth with quality businesses while trading earns income from price moves.\n\nKEY METRICS (rough guide):\n\u2022 Sales/profit growth: 15%+ CAGR over 3-5 years, consistent quarters.\n\u2022 ROE above 15%, ROCE above 15-18% (not for banks).\n\u2022 Debt-to-equity below 1 for most; interest coverage above 3x.\n\u2022 Stable or rising operating margin vs peers.\n\u2022 Free cash flow positive and growing; profit backed by cash.\n\u2022 Promoter holding high and stable; pledge below 10-15%.\n\u2022 Valuation: P/E, P/B, PEG (near or below 1 for growth), EV/EBITDA versus own history and sector.\n\u2022 Banks: NIM, GNPA/NNPA, CASA, credit cost.\n\nQUALITATIVE CHECK: Durable moat (brand, cost, switching cost, network, regulation); honest management who delivered on past promises; growing industry with structural tailwind; no governance red flags (auditor changes, related-party deals, pledging, delayed results).\n\nVALUATION: Quality at a reasonable price. A great company at a very high price can return nothing for years. Buy in tranches (for example 3 parts over months).\n\nLONG-TERM PLAN:\n\u2022 Core: Nifty 50 / Next 50 / flexi-cap index funds by monthly SIP, automated.\n\u2022 Satellite: 8-15 quality stocks, max 10% in one stock and 25% in one sector.\n\u2022 Rebalance once or twice a year; add in corrections using your cash reserve.\n\u2022 Holding over 1 year gives better tax treatment.\n\nCHECKLIST: A fundamental filter for every positional pick; an SIP separate from trading capital."}, {"t": "Step 8: Futures and options", "d": "GOAL: Understand derivatives fully before risking money. Most retail losses happen here.\n\nBASICS: Lot size is set by the exchange and revised often; check the latest contract specs. Call profits if price rises, Put if it falls. ITM has intrinsic value, ATM strike near spot, OTM only time value. Futures follow the underlying with leverage and daily settlement.\n\nGREEKS:\n\u2022 Delta: price change per Rs 1 move; ATM about 0.5, deep ITM near 1, far OTM near 0.\n\u2022 Gamma: rate of delta change; highest ATM near expiry, so expiry-day swings are violent.\n\u2022 Theta: daily time decay; hurts buyers, pays sellers.\n\u2022 Vega: sensitivity to implied volatility; long options lose when IV falls (IV crush after events).\n\nIV LOGIC: Compare IV with its own percentile. Buy options when IV is low and a big move is expected; sell or spread when IV is high and calm is expected. Direction can be right and still lose because of IV crush.\n\nOPTION BUYING RULES: Trade only with a clear trend/breakout; use ATM or slightly ITM (delta 0.5-0.7); avoid far-OTM lottery strikes; avoid zero-day expiry unless deliberately scalping with strict size; stop on the underlying level plus a premium stop of about 25-30%; target 1:2 or better; risk (premium x lot size x lots) within 1% of capital.\n\nSTRATEGY LIBRARY:\n\u2022 Long call/put: strong directional view; max loss = premium.\n\u2022 Bull call spread: moderately bullish; defined risk, capped profit.\n\u2022 Bear put spread: moderately bearish; defined risk.\n\u2022 Bull put spread (credit): neutral to bullish.\n\u2022 Bear call spread (credit): neutral to bearish.\n\u2022 Long straddle/strangle: big move expected, direction unknown; hurt by IV crush.\n\u2022 Short straddle/strangle: range-bound, high IV; unlimited risk, experienced traders only with hedges.\n\u2022 Iron condor: range-bound; defined risk, limited profit.\n\u2022 Covered call: mildly bullish on shares you own.\n\u2022 Protective put: insurance for a portfolio.\n\nOI AND OPTION CHAIN: Highest Put OI acts as support, highest Call OI as resistance. Price up + OI up = long buildup; price down + OI up = short buildup; price up + OI down = short covering; price down + OI down = long unwinding. PCR extremes only count when price confirms.\n\nEXPIRY-DAY RULES: Premiums can swing 50-100% in minutes. Use defined risk and half size. Avoid naked shorts into the last hour. Square off stock derivatives before expiry to avoid physical delivery. No revenge trading.\n\nSELLING SAFELY: Hedge with spreads/condors until 12+ months of consistent results. Keep margin use under 40-50%. Predefine exit at 1.5-2x credit loss or when the short strike breaks. Avoid selling into results, Budget or policy days.\n\nFUTURES: Same trend logic, size by stop distance x lot size, keep a 30-50% margin buffer, roll before expiry if still valid.\n\nCHECKLIST: I can explain Delta, Theta, Vega and IV crush; paper-traded options 2-3 months; defined risk and max 1% per idea; I know lot size, margin and expiry."}, {"t": "Step 9: Psychology, journal and backtesting", "d": "GOAL: Your edge is a tested system plus the discipline to follow it.\n\nBIASES AND FIXES:\n\u2022 FOMO: enter only at pre-planned levels.\n\u2022 Revenge trading: daily loss limit; stop after 2 losses.\n\u2022 Overconfidence: fixed risk % after wins.\n\u2022 Loss aversion: place the stop as an order, not a mental note.\n\u2022 Hope/anchoring: time stop; exit if the thesis is invalid.\n\u2022 Confirmation bias: write one reason the trade could fail.\n\u2022 Overtrading: max trades per day; A-grade setups only.\n\nDAILY PROCESS: Before market do the Step 3 routine with exact numbers. During market take only planned trades and log each one. After market grade each trade A (followed rules), B (minor mistake), C (broke rules). Weekend compute metrics and pick one improvement.\n\nJOURNAL FIELDS: Date/stock/segment; setup and reason; entry/SL/target/quantity; planned risk and RR; exit and reason; P&L after costs; emotion and mistakes; grade and lesson. Screenshot every trade.\n\nMETRICS (monthly): Win rate; average RR (aim 1.5+); expectancy positive after costs; profit factor above 1.5; max drawdown below 10-15%; rule-following above 80%.\n\nBACKTESTING: Pick one setup with exact rules; scan 50-100+ historical cases across bull, bear and sideways phases; record after costs. Beware hindsight bias and over-optimisation. Then paper trade 2-3 months, go live at 25% size, scale only after consistent results.\n\n90-DAY ROADMAP:\n\u2022 Days 1-30: learn Steps 1-4, paper trade one setup, build the journal (50 paper trades).\n\u2022 Days 31-60: live at minimum size in cash, focus on rule-following above 80%.\n\u2022 Days 61-90: add swing setups, review metrics, consider small hedged options.\n\u2022 After 90 days: scale 25% only after a profitable month; cut after a losing month.\n\nLIFESTYLE: Sleep and exercise; no trading when angry, tired or anxious; never trade rent, fees or loan money; limit tips and social media; rest after big wins and big losses.\n\nCHECKLIST: Journal every trade and review weekly; know expectancy and max drawdown; completed paper trading and a small live trial before scaling."}, {"t": "Step 10: Tax, compliance and safety", "d": "GOAL: Protect profits from tax mistakes and capital from fraud.\n\nNOTE: Tax law changes almost every Budget. The points below follow the commonly understood framework after the 2024 changes. Verify current rates with the Income Tax Department or a CA.\n\nTAX TREATMENT (resident individual):\n\u2022 Delivery shares held up to 12 months: STCG at a flat special rate (20% under recent rules).\n\u2022 Delivery shares held over 12 months: LTCG above an annual exemption at a flat rate (12.5% under recent rules).\n\u2022 Intraday equity: speculative business income at slab rate; losses set off only against speculative income, carry forward 4 years.\n\u2022 Futures and options: non-speculative business income at slab rate; losses set off against other business income, carry forward 8 years.\n\u2022 Dividends: other sources at slab rate; TDS may apply.\n\nFILING AND RECORDS: F&O and intraday traders generally use ITR-3; delivery-only investors may use ITR-2. Keep contract notes, broker P&L, ledger, bank statements and expense records. F&O turnover is computed by a prescribed method and tax audit may apply above thresholds; ask a CA. Pay advance tax if liability exceeds Rs 10,000. File on time to carry forward losses.\n\nFRAUD SAFETY:\n\u2022 Use only SEBI-registered brokers, advisors and research analysts; verify on the SEBI website.\n\u2022 Never share OTP, password or TPIN; enable 2-factor authentication; do not give power of attorney to unknown entities.\n\u2022 Beware guaranteed returns, WhatsApp/Telegram VIP tips, fake trading and IPO apps, AI-bot schemes, pump-and-dump groups, promises of 10-30% monthly returns.\n\u2022 Keep shares in your own demat; never send money to an advisor's personal account.\n\u2022 Unregistered finfluencers cannot legally give buy/sell recommendations; treat their content as entertainment.\n\u2022 Report fraud to the broker, exchange grievance route, SEBI SCORES and the national cyber-crime portal.\n\nPROTECTIONS: Nominate beneficiaries in demat and mutual funds; keep secure backups of account details; hold health and term insurance before investing aggressively; do not replace your income with trading until you have 2+ years of documented consistent results.\n\nCHECKLIST: I know how my income is classified and have a CA ready; I keep contract notes and my own P&L; my broker and advisor are SEBI-registered."}, {"t": "Step 11: Quick reference tools", "d": "DAILY CHECKLIST:\n\u2022 Before open: GIFT Nifty, global cues, VIX; events and expiries; label market type; prepare 3-5 trades with entry/SL/target/quantity; confirm the daily loss limit.\n\u2022 During market: wait for 9:30; trade only listed setups; stop immediately; no averaging; max 2-3 trades; stop after 2 losses; flat by 3:15.\n\u2022 After close: log trades with screenshots; grade A/B/C; update swing stops; review mistakes; plan tomorrow.\n\nTOP 15 MISTAKES: No stop-loss or moving it; risking over 1-2%; averaging down; trading the first 15 minutes without a plan; overtrading in the lunch lull; far-OTM lottery options; unhedged option selling; trading on tips; ignoring costs and tax; too many indicators; trading against the higher-timeframe trend; carrying intraday losers overnight; revenge trading; no journal; using borrowed or essential money.\n\nFORMULAS:\n\u2022 Position size = (Capital x Risk%) / (Entry - Stop)\n\u2022 Risk-reward = (Target - Entry) / (Entry - Stop)\n\u2022 Break-even win rate = 1 / (1 + RR)\n\u2022 Expectancy = (Win% x Avg win) - (Loss% x Avg loss)\n\u2022 Recovery needed after loss L = L / (1 - L)\n\u2022 ATR stop = Entry - (1.5 to 2) x ATR(14)\n\u2022 Pivot P = (H+L+C)/3; R1 = 2P-L; S1 = 2P-H\n\u2022 Long call breakeven = strike + premium; long put = strike - premium\n\u2022 Max loss on a credit spread = strike width - credit received\n\nGLOSSARY: ATM/ITM/OTM at/in/out of the money. ATR average true range. CNC/MIS/NRML delivery/intraday/normal F&O. DMA/EMA daily/exponential moving average. FII/DII foreign/domestic institutions. GIFT Nifty pre-open indicator. IV implied volatility. OI open interest. PCR put-call ratio. RR risk-reward. STT securities transaction tax. VIX India volatility index. VWAP volume weighted average price.\n\nFINAL WORD: Consistent profit comes from boring discipline: small risk, clear rules, patient waiting, honest review. This guide is educational only and is not investment advice. Never trade money you cannot afford to lose."}]}, {"id": "t_hp_printer", "title": "Troubleshoot HP Printer (step by step)", "steps": [{"t": "Step 1: Identify the problem first", "d": "Write down: exact model (on the front or back label), connection type (USB, Wi-Fi, Ethernet), what you see (error code, blinking lights, 'Offline', blank pages, streaks), and when it started (after a Windows update, new ink, new router?).\nQuick triage:\n\u2022 Nothing prints, no lights: power problem (steps 2).\n\u2022 Prints from phone but not PC: Windows driver or spooler (steps 5-7).\n\u2022 Prints from nothing, shows offline: network problem (steps 4, 9, 10).\n\u2022 Prints but poor quality: ink/printhead (step 11).\n\u2022 Paper jam or pulls no paper: paper path (step 3).\nDo the steps in order. Test print after each step so you know which one fixed it."}, {"t": "Step 2: Power cycle and basic checks", "d": "1. Turn the printer off with its own button. Unplug the power cable from the WALL (not only from the printer). Wait 60 seconds.\n2. Plug directly into a wall socket, not a surge strip or extension (HP recommends this).\n3. Turn on and wait until the lights stop blinking.\n4. Check the control panel for an error message or code and note it.\n5. Open the ink/toner door and make sure it closes fully; check there is no blinking cartridge icon.\n6. Update check: on the printer screen go to Setup or Settings, then Printer Maintenance or Tools, and look for 'Update printer' or 'Printer update'.\n7. Restart the PC and the Wi-Fi router too. A large share of 'printer offline' problems end here."}, {"t": "Step 3: Clear paper jams and paper feed problems", "d": "1. Power off. Open all covers and the rear access door. Pull jammed paper slowly in the direction of the normal paper path, using both hands, so no small torn piece stays inside.\n2. Look inside with a torch for tiny paper scraps, labels or staples. Check the roller area for dust.\n3. Use good paper (75-80 gsm), fan the stack, do not overfill, align the paper guides lightly against the stack, and never mix paper types.\n4. Humid or curled paper causes pick-up failures; use paper from a fresh pack.\n5. If the printer pulls no paper: wipe the rubber pick rollers with a lint-free cloth lightly dampened with distilled water, let dry, then retry.\n6. If the 'carriage jam' or 'carriage stall' message appears: open the cartridge door with the printer on, remove any foreign object or packing tape/orange protective material, and make sure the cartridge cradle moves freely by hand when the printer is off."}, {"t": "Step 4: Fix 'Printer offline' or 'Printer not responding' in Windows", "d": "1. Windows 11: Settings > Bluetooth & devices > Printers & scanners > click your HP printer.\n2. Click 'Open print queue'. In the Printer menu, make sure 'Use Printer Offline' and 'Pause Printing' are NOT ticked.\n3. In the print queue, delete stuck jobs (Document menu > Cancel All Documents).\n4. Back in Printers & scanners, click 'Print test page' from Printer properties.\n5. Set the printer as default: if 'Let Windows manage my default printer' is ON, turn it off and set your HP as default manually.\n6. If the status stays offline on Wi-Fi: check that PC and printer are on the same Wi-Fi network (a guest or 5 GHz-only network may block a printer that supports only 2.4 GHz).\n7. Remove and re-add the printer: Printers & scanners > Add device. If it is not found, choose 'Add manually' and use the printer's IP address (see step 10)."}, {"t": "Step 5: Clear the print queue and restart the Print Spooler", "d": "Open Command Prompt as Administrator (search cmd > Run as administrator) and run these one by one:\n\nnet stop spooler\ndel /q /f /s %systemroot%\\System32\\spool\\PRINTERS\\*\nnet start spooler\n\nWhat it does: stops the spooler service, deletes stuck jobs, starts it again.\nIf 'net stop spooler' says it cannot stop: close the print queue window, run 'taskkill /f /im spoolsv.exe' then start the service again.\nCheck the service: press Win+R, type services.msc, find 'Print Spooler', Startup type must be Automatic and Status Running.\nAdvanced PowerShell (Admin) to see printers and jobs:\nGet-Printer\nGet-PrintJob -PrinterName \"HP printer name\"\nRestart-Service Spooler"}, {"t": "Step 6: Reinstall or update the HP driver", "d": "1. Remove old driver: Settings > Printers & scanners > HP printer > Remove. Then press Win+R, type printui /s /t2 and press Enter. Select the HP driver entries > Remove > 'Remove driver and driver package'.\n2. Restart the PC.\n3. Download from HP only: go to support.hp.com, enter your printer model, choose Software and Drivers, and download 'HP Smart' or the full-feature driver. Avoid third-party driver sites.\n4. Install HP Smart (recommended for wireless printers) and follow setup. Choose 'Add printer' and follow prompts.\n5. For many modern HP printers Windows can also use its built-in IPP driver: Add device > Add manually > 'Add a printer using an IP address or hostname', and let Windows pick the driver. This is useful when the HP full driver fails.\n6. If a Windows update broke printing, check HP support for a newer driver, then (as a last resort) in Settings > Windows Update > Update history > Uninstall updates, remove the latest update after confirming with HP support notes."}, {"t": "Step 7: Run HP Print and Scan Doctor", "d": "1. On support.hp.com search 'HP Print and Scan Doctor' and download it (free HP tool for Windows).\n2. Run it, click Start, choose your printer.\n3. It checks connection, driver, printer status, and firewall and offers automatic fixes. Accept the fixes and print a test page.\n4. If your printer is not listed, click 'My product is not listed', then 'Retry' on the Network or USB step.\n5. For scanning problems use the Scan tab in the same tool.\nAlternative: in HP Smart app, open the printer, select 'Printer Settings' or 'Fix & Improve' for guided fixes."}, {"t": "Step 8: USB connection checks", "d": "1. Use the original USB cable, shorter than 3 metres, plugged straight into a port on the PC (not a hub or front-panel extension).\n2. Try a different USB port and a different cable.\n3. Open Device Manager (Win+X > Device Manager). Look for the HP printer or 'Unknown device' or 'USB Printing Support'. A yellow warning icon means a driver problem: right-click > Uninstall device, unplug USB, restart, plug in again.\n4. In Device Manager > Universal Serial Bus controllers, right-click 'USB Root Hub' and 'Generic USB Hub' > Properties > Power Management and untick 'Allow the computer to turn off this device to save power'.\n5. Windows 11 power setting: Settings > System > Power > set USB selective suspend to disabled in Advanced power plan settings if the printer disconnects after sleep."}, {"t": "Step 9: Connect the HP printer to Wi-Fi", "d": "1. Make sure the router broadcasts 2.4 GHz (many HP printers do not support 5 GHz-only). Keep the printer within 5-8 metres of the router.\n2. On the printer: Settings or Wireless icon > Wireless Setup Wizard > choose network > enter password.\n3. WPS option: press the WPS button on the router, then within 2 minutes start 'WPS push button' on the printer.\n4. Print a 'Wireless Network Test Report' or 'Network Configuration Page' from the Reports menu. It shows SSID, signal strength, IP address and any error.\n5. HP Smart app can also set the printer up for you: open the app, tap '+', follow the prompts.\n6. If the Wi-Fi password changed, restore network defaults: Settings > Network Setup > Restore Network Defaults, then repeat setup.\n7. Do not use special characters in Wi-Fi name if connection keeps failing; temporarily use a simple SSID and password to test."}, {"t": "Step 10: Use the IP address, ping test and static IP", "d": "1. Find the printer IP address from the network configuration page or the printer's wireless menu. Example: 192.168.1.45.\n2. On the PC open Command Prompt and run:\nping 192.168.1.45\nReplies = network OK. 'Request timed out' = printer not reachable (wrong network, firewall, or printer sleeping).\n3. Type the IP in a browser (http://192.168.1.45) to open the HP Embedded Web Server. Here you can see ink levels, update firmware, change network settings and print reports.\n4. Give the printer a fixed IP so it stops going offline: in your router's DHCP reservation list, bind the printer's MAC address to its IP. Or set a static IP in the printer's Embedded Web Server under Network settings.\n5. Re-add the printer in Windows using the IP: Add device > Add manually > Add a printer using an IP address > enter the IP > pick HP driver or let Windows choose.\n6. If the router has 'AP isolation' or 'client isolation' on, turn it off."}, {"t": "Step 11: Fix poor print quality (streaks, blank, faded)", "d": "1. Check ink or toner levels in HP Smart or the printer menu. Replace empty or very low cartridges; do not remove a cartridge for long periods.\n2. Remove each cartridge, check that the protective tape and electrical contacts are clean and not covered; reinsert firmly until it clicks.\n3. Print a diagnostics page: Settings > Tools or Printer Maintenance > Print Quality Report.\n4. Run 'Clean Printhead' (inkjet) from the Tools menu. You can repeat up to 2-3 times, then wait several hours.\n5. Run 'Align Printheads' and print the alignment page.\n6. Gently clean the cartridge contacts and printer contacts with a dry lint-free cloth.\n7. Paper settings: in the print dialog choose the correct paper type (Plain or Photo) and quality (Normal or Best).\n8. For laser printers: replace the toner, check the drum, clean the fuser area only per HP manual, and print a cleaning page.\n9. Printers left unused for weeks can clog: print one colour page weekly."}, {"t": "Step 12: Error messages, genuine cartridge and firmware", "d": "\u2022 'Cartridge problem', 'Incompatible', or 'Supply problem': reseat the cartridge, try another cartridge, and check that it is the correct model number for your printer.\n\u2022 Dynamic Security: HP printers may reject cartridges with non-HP or modified chips, and firmware updates can enable this. Use the cartridge listed for your printer. Check HP's page for your model.\n\u2022 Instant Ink: if the HP Instant Ink subscription is cancelled or a payment fails, cartridges may be blocked until re-enrolled.\n\u2022 Ink system failure or printhead failure with a number: power off, wait 1 minute, power on; if it repeats, note the code and contact HP Support (cause can be a worn printhead or power board).\n\u2022 Firmware: update through HP Smart, the printer touchscreen, or the Embedded Web Server. If printing broke right after a firmware update, check HP support for the current known fix.\n\u2022 E-numbers or 'Error 79' etc.: look up the exact code on support.hp.com for your model; power cycle first."}, {"t": "Step 13: Windows security and sharing issues", "d": "\u2022 Firewall: temporarily test by turning the Windows Defender Firewall off for a minute (Control Panel > Windows Defender Firewall); if printing works, add an allow rule for HP software instead of leaving it off.\n\u2022 Shared printer from another PC fails with 0x0000011b, 0x00000709 or 0x00000bcb: these arose after Microsoft's security hardening of printer sharing. Best fixes: connect to the printer directly by IP, or install the driver locally on the client PC. Registry workarounds weaken security; avoid them unless HP or your IT team approves.\n\u2022 Windows Protected Print Mode (a newer Windows 11 option): if enabled, only modern IPP class drivers work. If your HP model needs its own driver, turn it off in Settings > Bluetooth & devices > Printers & scanners.\n\u2022 Check the account used: some corporate PCs block driver install without admin rights.\n\u2022 Last resort: factory reset the printer (Settings > Restore Factory Defaults), then set it up again from scratch. Back up your network settings first."}, {"t": "Step 14: Final checklist and when to call HP", "d": "Checklist:\n\u2022 Power cycle done, direct wall socket.\n\u2022 Paper path clear, correct paper.\n\u2022 Printer Online, queue cleared, spooler restarted.\n\u2022 Driver reinstalled from HP, Print and Scan Doctor run.\n\u2022 Network: same Wi-Fi, IP pinged, static IP set.\n\u2022 Cartridges reseated, printheads cleaned and aligned.\n\u2022 Firmware current.\nIf the issue remains, contact HP Support with: model, serial number, error code, and the list of what you tried. Check warranty status on support.hp.com (enter the serial number). Mechanical faults such as a failed carriage, motor or formatter board usually need service rather than DIY repair."}]}, {"id": "t_epson_printer", "title": "Troubleshoot Epson Color Printer (step by step)", "steps": [{"t": "Step 1: Know your Epson type and note the symptoms", "d": "Epson colour printers are mainly: EcoTank / L-series (refillable tanks, e.g. L3210, L3250, L805, L1800), Expression Home/Photo (cartridges), WorkForce (office), SureColor (large format) and Epson Workforce Enterprise.\nWrite down: exact model name, how it is connected (USB / Wi-Fi / LAN), the light pattern or error code on the printer (for L-series: ink drop light, paper light, power light blinking), and the symptom: no print, banding (horizontal lines), missing colours, blue or red tint, smears, paper jam, offline.\nMost Epson colour problems are clogged nozzles, wrong settings, low ink, or Windows driver/spooler issues. Work through the steps in order and test print each time."}, {"t": "Step 2: Power and basic checks", "d": "1. Power off with the button, remove the power cable and USB cable, wait 1 minute, reconnect and power on.\n2. Check for blinking lights. Typical Epson L-series: ink light blinking = low ink or tank refill needed; paper light blinking = paper out or jam; power light blinking = working, or error with both lights.\n3. Use a direct wall socket; avoid cheap extension boards (voltage dips cause carriage errors).\n4. Open the scanner unit and remove any orange tape or packing material around the carriage.\n5. Put 20 sheets of plain A4 paper, aligned in the guide, and print a test page.\n6. Restart the PC and router if the printer is on Wi-Fi.\n7. Install the latest firmware and driver after the printer works (see step 8)."}, {"t": "Step 3: Check ink: EcoTank refill rules and cartridge checks", "d": "EcoTank / L-series (refillable):\n\u2022 Never let ink drop below the LOWER LINE on any tank. Air entering the ink tube causes missing colours and banding.\n\u2022 Fill only with Epson genuine ink bottles of the correct colour, using the keyed bottle nozzle. Do not mix colours. Wipe spills immediately.\n\u2022 After refilling, press and hold the Ink or Maintenance button (about 5 seconds, per your manual) if your model requires 'ink charging' or reset, then run Nozzle Check.\n\u2022 If ink was very low or ran dry, run Power Cleaning once (see step 4) and let the printer rest for several hours.\nCartridge models (Expression, WorkForce):\n\u2022 Open Epson Status Monitor 3 or the printer menu to see ink level.\n\u2022 Replace empty cartridges promptly; remove the yellow tape. Do not refill or reset chips unless the manufacturer allows it.\nAlways check that your printer shows 'ink OK' before cleaning the heads, because cleaning uses ink."}, {"t": "Step 4: Nozzle check, head cleaning and power cleaning", "d": "Do this when colours are missing, banded or faded.\nWindows: Control Panel > Devices and Printers > right-click Epson > Printing preferences > Maintenance tab.\n1. Click 'Nozzle Check' and print the pattern. A full pattern with no gaps means the head is fine.\n2. If there are gaps: click 'Head Cleaning'. Print Nozzle Check again.\n3. Repeat Head Cleaning up to 3-4 times. Stop if there is no improvement.\n4. Turn the printer off and leave it for 6-12 hours (overnight). Ink softens dried clogs. Then run Nozzle Check again.\n5. Use 'Power Cleaning' (if your model offers it in Maintenance or the printer menu) only after step 4; it uses more ink and should not be repeated often.\n6. Manual option for stubborn clogs: only if the user manual describes it, never use alcohol or random liquids. Avoid touching the head.\n7. Keep the printer on a stable table. If you print rarely, power it on weekly and print one colour page to avoid clogging.\n8. Never switch off by pulling the plug; always use the Power button so the head parks and caps."}, {"t": "Step 5: Fix banding, lines and alignment", "d": "1. Run Nozzle Check first (step 4). Clogs cause lines.\n2. Run Print Head Alignment: Maintenance tab > Print Head Alignment. Follow the on-screen pattern and choose the best patterns.\n3. In Printing preferences set the right Paper Type (Plain Paper, Matte, Premium Glossy) and quality (Standard or High). Wrong media type causes streaks and extra ink.\n4. Use a good-quality paper; very cheap, thin or damp paper smears.\n5. If lines appear only on photos: switch off 'High Speed' mode in the driver (it prints bidirectionally and can look misaligned).\n6. Check the paper feed: if rollers are dirty, wipe with a lightly damp lint-free cloth. Run 'Paper Guide Cleaning' if offered.\n7. Persistent lines after cleanings and alignment may mean a worn printhead or an ink supply problem. Contact Epson service."}, {"t": "Step 6: Fix wrong colours or colour tint", "d": "1. Nozzle Check: missing magenta gives a green tint, missing cyan gives red tint, missing yellow gives blue tint.\n2. After the nozzle pattern is perfect, print a colour test photo.\n3. In the driver: set Paper Type correctly, Colour (not Grayscale), and turn on 'Epson Standard' colour management or 'ICM' only if you use ICC profiles. In the application (Photoshop, Word) let the printer manage colours, and not both the app and printer at the same time (this causes double colour correction).\n4. Check the screen vs print: monitors are RGB and printers use CMYK; calibrate the monitor if colour matching matters.\n5. Use Epson genuine ink; compatible inks can have different colour balance.\n6. Print dull on glossy paper: ensure the glossy side is facing up.\n7. Check the 'Mirror image' and 'Borderless' options are off unless you need them."}, {"t": "Step 7: Printer shows offline or does not respond on Windows", "d": "1. Settings > Bluetooth & devices > Printers & scanners > Epson printer > Open print queue. Ensure 'Use printer offline' and 'Pause printing' are off. Cancel all stuck jobs.\n2. Clear the spooler (Command Prompt as Administrator):\nnet stop spooler\ndel /q /f /s %systemroot%\\System32\\spool\\PRINTERS\\*\nnet start spooler\n3. Set as default printer and retry a test page.\n4. Epson Status Monitor 3: open Printing preferences > Maintenance > Extended Settings and tick 'Enable EPSON Status Monitor 3' if it was off. Some 'offline' status errors vanish after turning it off and on.\n5. Check the port: Printer properties > Ports. For USB, port should be USB001 (or 'USB' with Epson name). For Wi-Fi, the port should be a Standard TCP/IP port with the printer's IP.\n6. USB: use a different cable and a back-panel port. Do not use a hub.\n7. If printing works from phone but not PC, reinstall the driver (step 8)."}, {"t": "Step 8: Install, update and reinstall the Epson driver", "d": "1. Remove the old driver: Settings > Printers & scanners > Epson > Remove. Then Win+R, type printui /s /t2, select Epson drivers > Remove > 'Remove driver and driver package'. Also uninstall Epson software in Settings > Apps > Installed apps.\n2. Restart the PC.\n3. Download from Epson's official site only (epson.com or your country site like epson.co.in): choose Support, enter model, then download Driver and Utilities Combo Package, which includes driver, Epson Status Monitor, Scan 2 and Event Manager.\n4. Run the installer and choose connection type. For USB, connect the cable only when the installer asks.\n5. For Wi-Fi, run 'Epson Smart Panel' or 'Epson iPrint' on the phone and follow the Wi-Fi setup, or use the WPS button method (hold Wi-Fi button on the printer, then press the WPS button on the router within 2 minutes).\n6. Install the optional firmware update from Epson only when printer is stable and PC power will not drop during the update.\n7. Epson Scan 2 handles scanning. If the scanner is not found, reinstall Epson Scan 2 and check that the printer shows online in the Network Interface setup."}, {"t": "Step 9: Wi-Fi setup and network checks for Epson", "d": "1. Check that your router offers 2.4 GHz (many Epson L-series support 2.4 GHz only; some newer models support 5 GHz).\n2. On the printer: press and hold the Wi-Fi button for 3 seconds until the light blinks, then press the WPS button on the router (WPS Push Button setup), or use the control panel Wi-Fi Setup Wizard if your model has a screen.\n3. Print the network status sheet (hold the Network Status or Wi-Fi button) to see the IP address and signal.\n4. Test with Command Prompt:\nping 192.168.1.50   (use your printer's IP)\n5. Reserve this IP for the printer in your router's DHCP reservation.\n6. If still failing, reset network settings from the printer menu (Restore Default Settings > Network Settings), then run setup again.\n7. Make sure the router has no MAC filtering that blocks the printer, and that AP/client isolation is turned off.\n8. Epson Connect (email print and remote print) needs a registered account in Epson Connect and the printer connected to the internet."}, {"t": "Step 10: Paper jam, paper feed and noise problems", "d": "1. Switch off and open covers. Remove paper slowly in the direction of the paper path. Check the rear cover and under the scanner unit for small pieces.\n2. Use a torch to inspect the rollers and the printhead path.\n3. Don't overfill the tray; do not use damp, curled or stapled paper; set paper guides snug.\n4. If the printer says 'paper jam' but there is none, open and close the covers, power cycle, and remove loose bits from the sensor area near the rollers.\n5. Loud grinding or carriage banging: stop, power off, and move the carriage by hand slowly to check for obstruction. Do not force it. If the noise remains, service is needed.\n6. Feed problems with photo paper: feed one sheet at a time and use the proper paper tray or the special rear feed if your model has one."}, {"t": "Step 11: Service required and ink pad / maintenance box errors", "d": "Epson printers count ink used in cleaning and absorb waste ink in a pad (or in a replaceable Maintenance Box on many EcoTank models).\nMessages like 'A printer's ink pad is at the end of its service life' or 'Service required' mean the counter reached its limit.\nWhat to do:\n\u2022 If your model has a replaceable Maintenance Box (many L-series), buy the genuine box for that model, replace it and follow the model's reset steps in the manual.\n\u2022 If the pad is inside and not user replaceable, contact an authorised Epson service centre. Do not use unofficial 'resetter' software from the internet: it can be malware, can void warranty, and does not empty the waste pad, so ink can overflow inside the printer and damage it.\n\u2022 Reduce waste: avoid repeated head cleanings, keep the printer used regularly, and turn it off with the Power button.\nAlso check Epson's page for your model for the exact message-to-solution mapping."}, {"t": "Step 12: Final checklist and when to contact Epson", "d": "Checklist:\n\u2022 Power cycle, direct wall socket, no tape or packing material left.\n\u2022 Ink above the lower line (EcoTank) or fresh cartridges.\n\u2022 Nozzle Check pattern complete; Head Cleaning (max 3-4) then rest overnight if needed.\n\u2022 Print Head Alignment done; correct paper type and quality selected.\n\u2022 Printer online, queue cleared, spooler restarted.\n\u2022 Official driver installed and firmware current.\n\u2022 Wi-Fi: 2.4 GHz, same network, IP reserved.\nIf the problem continues, contact Epson Support with model, serial number, firmware version, error light pattern or code, and the list of steps you tried. Check warranty (EcoTank usually has warranty in months or print pages, whichever comes first, check your model's terms)."}]}, {"id": "t_win11_26h2", "title": "Windows 11 26H2: check, install and fix problems", "steps": [{"t": "Step 1: What Windows 11 26H2 is", "d": "Windows 11 version 26H2 (the 2026 Update) began rolling out on September 29, 2026 in a phased, controlled way.\nKey facts reported by Microsoft and tech press:\n\u2022 It is a small update delivered as an enablement package for PCs already on Windows 11 24H2 or 25H2. Same servicing branch and codebase as 24H2 and 25H2, so it needs a small download and one restart, similar to a monthly update.\n\u2022 It brings the cumulative quality and security fixes and turns on by default some features that were present but off in 25H2 (for example, Windows settings backup). Reported items include enhanced Windows Hello sign-in security, Administrator Protection, Windows Search and taskbar customisation updates, AI actions in File Explorer and multi-app camera support. Exact features vary by device and region.\n\u2022 No new hardware requirements for PCs already running 24H2 or 25H2.\n\u2022 Support: 24 months for Home and Pro, 36 months for Enterprise and Education.\n\u2022 Windows 11 24H2 Home and Pro reached end of updates on October 13, 2026, so those PCs should move to 25H2 or 26H2 to keep receiving security updates.\n\u2022 PCs on version 26H1 (new Snapdragon X2 type devices) use a different Windows core and cannot upgrade directly to 26H2.\nCheck Microsoft's Windows release health page for the latest known issues."}, {"t": "Step 2: Check your current Windows version and edition", "d": "Method 1: Press Win+R, type winver, press Enter. Read 'Version' (24H2, 25H2, 26H2) and 'OS Build'.\nMethod 2: Settings > System > About.\nMethod 3: Command Prompt:\nsysteminfo | findstr /B /C:\"OS Name\" /C:\"OS Version\"\nver\nPowerShell:\nGet-ComputerInfo | Select WindowsProductName, WindowsVersion, OsBuildNumber\nWhat to do with the result:\n\u2022 24H2 or 25H2: eligible for the 26H2 enablement package.\n\u2022 23H2 or older: update to 24H2/25H2 first through Windows Update, then 26H2.\n\u2022 Windows 10: check Microsoft's current upgrade and support options; Windows 11 needs compatible hardware."}, {"t": "Step 3: Check requirements and prepare before updating", "d": "Windows 11 minimum requirements: 64-bit CPU 1 GHz with 2+ cores (on Microsoft's supported list), 4 GB RAM, 64 GB storage, UEFI with Secure Boot, TPM 2.0, DirectX 12 / WDDM 2.0 graphics, 9 inch or larger display.\nCheck TPM: press Win+R, type tpm.msc. It should say 'The TPM is ready for use' with Specification Version 2.0.\nCheck Secure Boot and BIOS mode: Win+R > msinfo32 > look at 'BIOS Mode' (UEFI) and 'Secure Boot State' (On).\nBefore updating:\n1. Back up important files (File History, OneDrive, or copy to an external drive).\n2. Make sure at least 20 GB of free space on C:.\n3. Plug in a laptop to power.\n4. Disconnect unused USB drives, docks and printers.\n5. Install pending updates, update drivers (especially Wi-Fi, graphics, chipset) from the PC maker's site.\n6. Create a restore point: search 'Create a restore point' > Create.\n7. Temporarily suspend third-party antivirus or disk-encryption tools if they are known to block updates (re-enable after)."}, {"t": "Step 4: Install 26H2 via Windows Update", "d": "1. Settings > Windows Update > Check for updates.\n2. If 26H2 is offered, you may see a 'Download and install' option for the Windows 11, version 26H2 feature update. Click it.\n3. The download is small. Click Restart now when asked. The PC restarts once.\n4. After login, press Win+R, type winver, and confirm Version 26H2.\n5. Check Settings > Windows Update again for the latest cumulative update (first Patch Tuesday for 26H2 was October 13, 2026).\nRollout is phased, so it may not appear immediately on every PC; Microsoft holds PCs with known compatibility issues. Don't force it with random scripts. If it is not offered after a few days, try step 5 (other install options)."}, {"t": "Step 5: Other install options if the update is not offered", "d": "Use only Microsoft's official sources.\n\u2022 Windows 11 Installation Assistant: from microsoft.com/software-download/windows11, download and run it. It upgrades while keeping files and apps.\n\u2022 Windows 11 ISO: download the official ISO from the same page, right-click > Mount, run setup.exe. Choose 'Keep personal files and apps'. For PCs on 24H2/25H2 the ISO can install the latest version in place.\n\u2022 Media Creation Tool: makes a USB installer, useful for clean installation (this erases the disk, so back up first).\n\u2022 Windows Update Assistant is not needed if Windows Update works.\n\u2022 Managed or office PCs: wait for the IT team to deploy through Windows Autopatch or their update tools.\nAvoid unofficial 'bypass' tools: they can break updates, remove protections or carry malware."}, {"t": "Step 6: Fix Windows Update errors and stuck downloads", "d": "Try in order:\n1. Settings > System > Troubleshoot > Other troubleshooters > Windows Update > Run.\n2. Free disk space (see the PC cleanup topic) and restart.\n3. Reset Windows Update components (Command Prompt as Administrator):\nnet stop wuauserv\nnet stop bits\nnet stop cryptsvc\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nren C:\\Windows\\System32\\catroot2 catroot2.old\nnet start cryptsvc\nnet start bits\nnet start wuauserv\n4. Repair system files:\nDISM /Online /Cleanup-Image /RestoreHealth\nsfc /scannow\n5. Restart and run Check for updates again.\n6. Check date/time and region settings; sign out of VPN; try another network or a wired connection.\n7. Note the error code (for example 0x80070002, 0x8007000E, 0x800f0922, 0x80073712) and search Microsoft's support page for that code.\n8. Look at logs: Event Viewer > Applications and Services Logs > Microsoft > Windows > WindowsUpdateClient, or PowerShell: Get-WindowsUpdateLog"}, {"t": "Step 7: Fix problems after the update (slow, driver, printer, Wi-Fi)", "d": "1. Restart twice; some features finish setup on the second boot.\n2. Update drivers: Windows Update > Advanced options > Optional updates > Driver updates; also the PC maker's support site.\n3. Printer after update: remove and re-add it, reinstall the maker's driver, restart the Print Spooler (see printer topics).\n4. Wi-Fi or Bluetooth missing: Device Manager > Network adapters > right-click > Uninstall device (tick delete driver if offered) > restart. Or run:\nnetsh winsock reset\nnetsh int ip reset\nipconfig /flushdns\n5. Slow or high disk usage: wait 30-60 minutes for background indexing and Defender scan; check Task Manager for the process using resources; run cleanup steps.\n6. Apps crash: repair via Settings > Apps > Installed apps > app > Advanced options > Repair; update the app.\n7. Black screen or display problem: Win+Ctrl+Shift+B restarts the graphics driver; update or roll back the GPU driver.\n8. Check Windows release health for known issues before undoing anything."}, {"t": "Step 8: Uninstall or roll back and system recovery options", "d": "\u2022 Because 26H2 is an enablement package, you can often remove it through Settings > Windows Update > Update history > Uninstall updates (look for the feature update or enablement package entry). If it is not listed, use other recovery methods.\n\u2022 Go back to the previous version (if the option exists): Settings > System > Recovery > Go back. Available for 10 days after a full upgrade (this period is shorter after cleaning disk space).\n\u2022 System Restore: search 'Create a restore point' > System Restore, and pick a restore point from before the update.\n\u2022 Reset this PC: Settings > System > Recovery > Reset PC. Choose Keep my files or Remove everything. Back up first.\n\u2022 Advanced startup: Settings > System > Recovery > Advanced startup > Restart now, then Troubleshoot > Advanced options (Startup Repair, Uninstall Updates, System Restore, Command Prompt).\n\u2022 If you cannot boot at all: boot from a Windows USB installer and choose Repair your computer (see Windows repair topic)."}, {"t": "Step 9: Windows 11 knowledge: settings and shortcuts you should know", "d": "Keyboard shortcuts: Win+E File Explorer; Win+I Settings; Win+X Power user menu; Win+R Run; Win+V clipboard history; Win+Shift+S screenshot; Win+Tab task view; Win+D desktop; Win+L lock; Win+Ctrl+D new virtual desktop; Ctrl+Shift+Esc Task Manager; Win+. emoji.\nKey tools: Task Manager (Ctrl+Shift+Esc), Event Viewer (eventvwr), Services (services.msc), Device Manager (devmgmt.msc), Disk Management (diskmgmt.msc), Computer Management (compmgmt.msc), Registry Editor (regedit, careful), Group Policy (gpedit.msc, Pro and above), msconfig, perfmon, resmon, Windows Security.\nGood habits: keep Windows Update on; use a standard (non-admin) account for daily work; enable BitLocker or Device Encryption; keep a local backup plus OneDrive; use Windows Hello; install apps only from trusted sources; review startup apps monthly (Task Manager > Startup apps).\nWinget (package manager) commands: winget search chrome; winget install Google.Chrome; winget upgrade --all.\nKeep your own recovery drive: search 'Create a recovery drive'."}]}, {"id": "t_pc_cleanup", "title": "Clean any laptop or desktop (old files, temp, cache)", "steps": [{"t": "Step 1: Prepare: back up and set safety rules", "d": "Before deleting anything:\n1. Back up documents, photos and desktop to an external drive or cloud.\n2. Create a restore point: search 'Create a restore point' > Create.\n3. Know the rules: never delete Windows, Program Files, ProgramData or System32 folders. Only delete the items listed here. Do not use 'registry cleaners' or 'PC optimiser' apps that promise miracle speed-ups; they cause more problems than they solve.\n4. Open an Administrator Command Prompt: search cmd > right-click > Run as administrator. Open an Administrator PowerShell (Windows Terminal Admin) when stated.\n5. Check free space first (a baseline):\nfsutil volume diskfree C:   or PowerShell:  Get-PSDrive C\n6. Close all apps before cleaning. Restart the PC after finishing."}, {"t": "Step 2: Storage Sense and Windows Settings cleanup (easiest)", "d": "1. Settings > System > Storage. Wait for the scan. Click 'Temporary files'.\n2. Tick: Windows Update Cleanup, Delivery Optimization Files, Temporary Internet Files, Thumbnails, DirectX Shader Cache, Windows Error Reporting files, Recycle Bin (check first), Previous Windows installation(s) (Windows.old) only if you are sure you won't roll back. Do NOT tick Downloads unless you have checked the folder.\n3. Click 'Remove files'.\n4. Turn on Storage Sense: Settings > System > Storage > Storage Sense > ON. Choose how often to delete temp files and Recycle Bin items (for example every 30 days).\n5. Settings > System > Storage > Cleanup recommendations lists large, unused, or synced files. Review before deleting.\n6. Settings > Apps > Installed apps: sort by size and uninstall unused apps.\n7. Settings > System > Storage > Advanced storage settings > Storage used on other drives; move 'Where new content is saved' to another drive if C: is small."}, {"t": "Step 3: Delete temp files and cache using CMD", "d": "Run in Command Prompt as Administrator. Close apps first. Errors like 'in use' are normal for a few files.\n\nUser temp folder:\ndel /q /f /s \"%TEMP%\\*\"\nfor /d %i in (\"%TEMP%\\*\") do rd /s /q \"%i\"\n\nWindows temp:\ndel /q /f /s C:\\Windows\\Temp\\*\nfor /d %i in (\"C:\\Windows\\Temp\\*\") do rd /s /q \"%i\"\n\nPrefetch (optional, Windows rebuilds it):\ndel /q /f /s C:\\Windows\\Prefetch\\*\n\nRecent files list:\ndel /q /f /s \"%APPDATA%\\Microsoft\\Windows\\Recent\\*\"\n\nCrash dumps and error reports:\ndel /q /f /s C:\\Windows\\Minidump\\*\ndel /q /f /s \"%ProgramData%\\Microsoft\\Windows\\WER\\ReportQueue\\*\"\n\nEmpty Recycle Bin for all drives (PowerShell):\nClear-RecycleBin -Force\n\nSimple shortcuts: Win+R > type %temp% > Ctrl+A > Delete; Win+R > temp; Win+R > prefetch."}, {"t": "Step 4: Clear Windows cache: DNS, Store, thumbnails, Update, fonts", "d": "DNS cache:\nipconfig /flushdns\n\nMicrosoft Store cache:\nwsreset.exe\n\nThumbnail and icon cache (closes Explorer for a moment):\ntaskkill /f /im explorer.exe\ndel /f /s /q /a \"%LocalAppData%\\Microsoft\\Windows\\Explorer\\thumbcache_*.db\"\ndel /f /a \"%LocalAppData%\\IconCache.db\"\nstart explorer.exe\n\nWindows Update download cache:\nnet stop wuauserv\nnet stop bits\ndel /q /f /s C:\\Windows\\SoftwareDistribution\\Download\\*\nnet start bits\nnet start wuauserv\n\nDelivery Optimization cache:\nPowerShell: Delete-DeliveryOptimizationCache -Force\n\nComponent store cleanup (safe, removes superseded update files):\nDISM /Online /Cleanup-Image /AnalyzeComponentStore\nDISM /Online /Cleanup-Image /StartComponentCleanup\nOptional and permanent (you cannot uninstall existing updates afterwards):\nDISM /Online /Cleanup-Image /StartComponentCleanup /ResetBase\n\nClipboard history: Win+V > Clear all. Run history: Settings > Personalisation > Start > recent items off."}, {"t": "Step 5: Browser cache and app cache", "d": "Chrome / Edge / Brave: press Ctrl+Shift+Delete > choose 'All time' > tick Cached images and files (and cookies only if you accept being signed out) > Clear data.\nFirefox: Ctrl+Shift+Delete > Cache > Clear now.\nCommand Prompt (browser must be closed): Chrome cache folder:\nrd /s /q \"%LocalAppData%\\Google\\Chrome\\User Data\\Default\\Cache\"\nEdge cache folder:\nrd /s /q \"%LocalAppData%\\Microsoft\\Edge\\User Data\\Default\\Cache\"\nTeams / Office / WhatsApp / Spotify and other apps: use their own Settings > Storage or 'Clear cache' option; or Settings > Apps > Installed apps > app > Advanced options > Reset (this signs you out).\nOffice cache: delete files inside %LocalAppData%\\Microsoft\\Office\\16.0\\OfficeFileCache with Office closed.\nDo not delete 'Login Data' or 'Bookmarks' files.\nPhone and photo backups: check OneDrive 'Files On-Demand' (right-click folder > Free up space) to keep files in the cloud, not on the disk."}, {"t": "Step 6: Find and remove big and old files", "d": "1. File Explorer: open a drive, search 'size:huge' (over 128 MB) or 'size:gigantic'. Sort by size.\n2. Check Downloads folder (Win+R > shell:downloads) and delete installers, duplicate ZIPs and old videos after reviewing.\n3. Command line to list large files:\nPowerShell: Get-ChildItem C:\\Users -Recurse -File -ErrorAction SilentlyContinue | Sort Length -Descending | Select -First 30 FullName,@{n='MB';e={[math]::Round($_.Length/1MB)}}\n4. Folder sizes with PowerShell: Get-ChildItem C:\\ -Directory | ForEach-Object { \"{0}  {1:N1} GB\" -f $_.FullName, ((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure Length -Sum).Sum/1GB) }\n5. Free graphical tools worth using: WizTree or TreeSize Free (download from official sites) show what uses space.\n6. Windows.old and hiberfil.sys: delete Windows.old via Storage settings or 'cleanmgr' > Clean up system files. Disable hibernation to free several GB on desktops (laptops lose Fast Startup/hibernate):\npowercfg /hibernate off\n(To enable again: powercfg /hibernate on)\n7. Move photos and videos to an external drive or cloud; leave a copy first."}, {"t": "Step 7: Disk Cleanup (cleanmgr) and automatic profiles", "d": "Classic tool still works:\ncleanmgr\nSelect drive C: > Clean up system files > tick items > OK.\nCreate a saved profile and run it any time:\ncleanmgr /sageset:1\n(choose all items you want, OK). Then run the profile silently:\ncleanmgr /sagerun:1\nQuick low-disk mode:\ncleanmgr /verylowdisk\nSchedule monthly cleaning with Task Scheduler:\nschtasks /create /tn \"MonthlyCleanup\" /tr \"cleanmgr /sagerun:1\" /sc monthly /d 1 /st 10:00 /rl highest\nRemove the schedule: schtasks /delete /tn \"MonthlyCleanup\" /f"}, {"t": "Step 8: Startup, background apps and performance tuning", "d": "1. Task Manager (Ctrl+Shift+Esc) > Startup apps. Disable high-impact items you do not need at logon (right-click > Disable). Do not disable security software or touchpad/audio drivers.\n2. Settings > Apps > Installed apps > app > Advanced options > Background apps permissions: set to 'Never' where possible.\n3. Settings > System > Power: set Best performance (desktop); Balanced is fine for laptops.\n4. Check what is slow: Task Manager > Performance and Processes (sort by CPU, Memory, Disk).\n5. Uninstall bloatware and trial apps; keep one antivirus (Microsoft Defender is enough for most users).\n6. Scan for malware: Windows Security > Virus and threat protection > Scan options > Microsoft Defender Offline scan.\n7. Update everything: Windows Update, drivers, BIOS (only from PC maker, only if needed), apps:\nwinget upgrade --all\n8. Check SSD health: PowerShell Admin: Get-PhysicalDisk | Select FriendlyName,HealthStatus,OperationalStatus. For detailed health use CrystalDiskInfo.\n9. Keep at least 15-20% free space on C:. If RAM is the problem (under 8 GB), add RAM or reduce browser tabs."}, {"t": "Step 9: Disk health, check disk and optimise drives", "d": "Check and fix file system errors (needs restart for C:):\nchkdsk C: /f\nDeep check for bad sectors (slow, HDD mainly):\nchkdsk C: /f /r\nView drives and type:\nPowerShell: Get-PhysicalDisk | Select FriendlyName,MediaType,HealthStatus\nOptimise: Windows chooses TRIM for SSD and defrag for HDD:\ndefrag C: /O\nAnalyse only: defrag C: /A\nSSD retrim: defrag C: /L\nDo NOT defragment an SSD manually.\nSecure wipe of free space after deleting sensitive files (very slow):\ncipher /w:C:\\\nUse this before selling a PC. Better: Settings > System > Recovery > Reset this PC > Remove everything > Clean drive."}, {"t": "Step 10: Ready-made cleanup script (.bat)", "d": "Safe example script. Copy the text below into Notepad and save as Cleanup.bat (choose 'All files'). Right-click it > Run as administrator.\n\n@echo off\necho Cleaning temp files...\ndel /q /f /s \"%TEMP%\\*\" >nul 2>&1\nfor /d %%i in (\"%TEMP%\\*\") do rd /s /q \"%%i\" >nul 2>&1\ndel /q /f /s C:\\Windows\\Temp\\* >nul 2>&1\nfor /d %%i in (\"C:\\Windows\\Temp\\*\") do rd /s /q \"%%i\" >nul 2>&1\necho Flushing DNS...\nipconfig /flushdns\necho Cleaning Windows Update download cache...\nnet stop wuauserv >nul 2>&1\nnet stop bits >nul 2>&1\ndel /q /f /s C:\\Windows\\SoftwareDistribution\\Download\\* >nul 2>&1\nnet start bits >nul 2>&1\nnet start wuauserv >nul 2>&1\necho Emptying Recycle Bin...\npowershell -command \"Clear-RecycleBin -Force -ErrorAction SilentlyContinue\"\necho Running saved Disk Cleanup profile 1 (create with cleanmgr /sageset:1)...\ncleanmgr /sagerun:1\necho Done. Please restart the computer.\npause\n\nMonthly routine: run the script, update Windows and apps, check free space, restart."}]}, {"id": "t_win_repair", "title": "Windows repair and advanced troubleshooting", "steps": [{"t": "Step 1: Troubleshooting method and first safe checks", "d": "Method: 1) Define the problem and when it started. 2) Check what changed (update, driver, new app, hardware). 3) Try the least risky fix first. 4) Change one thing at a time and test. 5) Keep notes.\nFirst checks: restart; check cables and power; check free disk space; run Windows Update; check Windows Security for threats; unplug USB devices; look at Event Viewer (Win+X > Event Viewer > Windows Logs > System and Application) for red Error entries at the time of the problem.\nUseful Windows 11 tools: Settings > System > Troubleshoot > Other troubleshooters; Reliability Monitor (search 'reliability history') shows crashes by date; Resource Monitor (resmon); Performance Monitor (perfmon).\nAlways back up before big changes."}, {"t": "Step 2: Repair system files: SFC and DISM", "d": "Run in an Administrator Command Prompt, in this order:\n1. DISM /Online /Cleanup-Image /CheckHealth\n2. DISM /Online /Cleanup-Image /ScanHealth\n3. DISM /Online /Cleanup-Image /RestoreHealth\n4. sfc /scannow\n5. Restart. If SFC reported it fixed files, run sfc /scannow again until it says no integrity violations.\nReading SFC results: logs are in C:\\Windows\\Logs\\CBS\\CBS.log. Extract only SFC lines:\nfindstr /c:\"[SR]\" %windir%\\Logs\\CBS\\CBS.log > \"%userprofile%\\Desktop\\sfcdetails.txt\"\nIf DISM fails with source errors, mount a Windows ISO of the same version and run:\nDISM /Online /Cleanup-Image /RestoreHealth /Source:WIM:D:\\sources\\install.wim:1 /LimitAccess\n(replace D: with the mounted ISO drive letter)."}, {"t": "Step 3: Disk and file system repair", "d": "chkdsk C: /f /r  (schedules at next restart; may take hours on HDD).\nIf Windows will not start, run chkdsk from recovery Command Prompt:\nchkdsk C: /f /r\n(In recovery your Windows drive letter can differ; check with: dir C:\\ , dir D:\\ )\nFix 'drive not showing': diskmgmt.msc to check the status; assign letter via right-click > Change drive letter.\nCheck drive health: PowerShell: Get-PhysicalDisk | Select FriendlyName,HealthStatus. 'Warning' or 'Unhealthy' means back up now and replace the drive.\nRecover deleted files: stop using the drive; try Windows File Recovery from Microsoft Store:\nwinfr C: D:\\Recovered /regular /n \\Users\\YourName\\Documents\\*\nRestore from backup or File History where possible."}, {"t": "Step 4: Boot problems and Windows Recovery Environment (WinRE)", "d": "Enter WinRE: turn the PC on and force it off (hold power) three times during the logo; or Shift+Restart; or boot from a Windows 11 USB and choose Repair your computer.\nTroubleshoot > Advanced options offers: Startup Repair, Uninstall Updates, System Restore, Startup Settings (Safe Mode), Command Prompt, UEFI Firmware Settings.\nCommand Prompt repairs for boot loader issues:\nbootrec /scanos\nbootrec /fixmbr\nbootrec /fixboot\nbootrec /rebuildbcd\nIf 'Access is denied' on bootrec /fixboot:\nbcdboot C:\\Windows /s S: /f UEFI\n(S: is the EFI system partition you mount first using diskpart > list vol > sel vol N > assign letter=S)\nCheck recovery status in Windows:\nreagentc /info\nEnable it: reagentc /enable\nView boot entries: bcdedit /enum\nSafe Mode from a working PC: msconfig > Boot > Safe boot. Remember to untick it after."}, {"t": "Step 5: Blue screen (BSOD) and crash diagnosis", "d": "1. Note the stop code on screen (e.g., CRITICAL_PROCESS_DIED, IRQL_NOT_LESS_OR_EQUAL, PAGE_FAULT_IN_NONPAGED_AREA, KERNEL_SECURITY_CHECK_FAILURE, DRIVER_POWER_STATE_FAILURE).\n2. Reliability Monitor or Event Viewer shows the time and faulting module.\n3. Update or roll back the driver that changed recently (Device Manager > driver > Properties > Driver tab > Roll Back Driver).\n4. Run memory test: mdsched.exe > Restart now and check results. Use MemTest86 for a deeper test.\n5. Check disk and system files (SFC, DISM, chkdsk).\n6. Check temperatures and dust; clean fans; make sure the laptop vents are not blocked.\n7. Boot to Safe Mode and uninstall recent software or drivers (graphics, antivirus, VPN, overclock tools).\n8. Review dumps: C:\\Windows\\Minidump. Use WinDbg or BlueScreenView for analysis.\n9. Turn off overclocking and XMP temporarily if on a desktop.\n10. If it persists: System Restore, repair install (in-place upgrade using Windows ISO > setup.exe > keep files), or reset."}, {"t": "Step 6: Slow computer: diagnose properly", "d": "1. Task Manager > Processes > sort by CPU, Memory, Disk. A process using 90-100% constantly is the clue.\n2. Disk 100%: check if HDD (replace with SSD for a large improvement), check antivirus scans, check Windows Search indexing (Settings > Privacy & security > Searching Windows), disable heavy startup items.\n3. Memory high: close browser tabs, check for leaks, add RAM (8 GB minimum, 16 GB recommended).\n4. CPU high: check for malware (Windows Defender Offline scan), update drivers, remove cryptominers and adware.\n5. Check power plan: powercfg /list ; powercfg /setactive SCHEME_BALANCED (or high performance on desktops).\n6. Generate reports: powercfg /energy (60-second report) and powercfg /batteryreport (laptop battery).\n7. Check the startup time with 'Startup impact' in Task Manager.\n8. Update BIOS and chipset drivers from the maker.\n9. Heat: use HWiNFO or the BIOS to check temperatures; reapply thermal paste on old machines if CPU overheats.\n10. Clean install of Windows is the last option for very old, messy installs (back up first)."}, {"t": "Step 7: Drivers and device problems", "d": "1. Device Manager (devmgmt.msc): look for yellow warning icons; check Properties > Event tab.\n2. Update drivers from Windows Update (Optional updates) or the PC maker's site. For graphics, use NVIDIA, AMD or Intel official drivers; use DDU in Safe Mode for a clean reinstall if problems persist.\n3. List installed drivers:\ndriverquery /v\npnputil /enum-drivers\n4. Remove a problematic third-party driver package:\npnputil /delete-driver oemXX.inf /uninstall /force\n(XX is the oem number from the list)\n5. Scan for hardware changes: Device Manager > Action > Scan for hardware changes.\n6. USB problems: change port/cable, disable USB selective suspend (Power Options > Advanced > USB settings), uninstall the device, restart.\n7. Sound: Settings > System > Sound > Troubleshoot; check default output; restart Windows Audio service: net stop audiosrv && net start audiosrv.\n8. Bluetooth: restart 'Bluetooth Support Service' in services.msc; remove and re-pair the device."}, {"t": "Step 8: Network troubleshooting (Wi-Fi, no internet, slow internet)", "d": "Test step by step:\nipconfig /all\nping 127.0.0.1  (own network stack)\nping 192.168.1.1  (your router, use your gateway from ipconfig)\nping 8.8.8.8  (internet by IP)\nping google.com  (DNS)\nInterpretation: gateway fails = Wi-Fi/cable/router; 8.8.8.8 works but names fail = DNS problem; both fail = ISP outage.\nReset commands (Admin):\nipconfig /release\nipconfig /renew\nipconfig /flushdns\nnetsh winsock reset\nnetsh int ip reset\nThen resta
