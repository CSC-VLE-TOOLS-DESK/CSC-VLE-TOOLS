<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var p2=function(n){return String(n).padStart(2,'0')};
var N=function(v){v=parseFloat(v);return isFinite(v)?v:0};
var R2=function(n){return Math.round((+n+Number.EPSILON)*100)/100};
var INR=function(n){n=R2(n);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var today=function(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dfmt(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'-'+m[2]+'-'+m[1]:(s||'')}
function addDays(s,n){var d=parseISO(s);if(!d)return s;d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){var d=parseISO(s);if(!d)return s;var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function daysTo(s){var d=parseISO(s);if(!d)return null;var t=parseISO(today());return Math.round((d-t)/86400000)}
/* expiry: stored as YYYY-MM, valid until the last day of that month */
function normExp(s){s=String(s||'').trim();if(!s)return '';var m;
 if((m=/^(\d{4})-(\d{1,2})/.exec(s)))return m[1]+'-'+p2(+m[2]);
 if((m=/^(\d{1,2})[\/\-.](\d{4})$/.exec(s)))return m[2]+'-'+p2(+m[1]);
 if((m=/^(\d{1,2})[\/\-.](\d{2})$/.exec(s)))return '20'+m[2]+'-'+p2(+m[1]);return ''}
function expEnd(e){var m=/^(\d{4})-(\d{2})$/.exec(e||'');if(!m)return null;return iso(new Date(+m[1],+m[2],0))}
function expFmt(e){var m=/^(\d{4})-(\d{2})$/.exec(e||'');return m?m[2]+'/'+m[1]:''}
function fy(dateStr){var d=parseISO(dateStr||today());var y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return {from:y+'-04-01',to:(y+1)+'-03-31',label:y+'-'+String(y+1).slice(2)}}
function monthKey(s){return String(s||'').slice(0,7)}
function inRange(d,a,b){return (!a||d>=a)&&(!b||d<=b)}
function uniq(a){var o={},r=[];a.forEach(function(x){if(x&&!o[x]){o[x]=1;r.push(x)}});return r}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function by(a,f){var o={};a.forEach(function(x){var k=f(x);(o[k]=o[k]||[]).push(x)});return o}
function toast(m,bad){var t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},bad?4500:2400)}
function openModal(html){$('modal').innerHTML='<div class="mb">'+html+'</div>';$('modal').className='on'}
function closeModal(){$('modal').className='';$('modal').innerHTML=''}
function download(name,text,type){var b=new Blob([text],{type:type||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(name,rows){download(name,'\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n'),'text/csv;charset=utf-8')}
function table(heads,rows,foot,cls){return '<div class="tw '+(cls||'')+'"><table><thead><tr>'+heads.map(function(h,i){return '<th'+(i===0||/^~/.test(h)?' class="l"':'')+'>'+esc(String(h).replace(/^~/,''))+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td class="l mut" colspan="'+heads.length+'">No records yet.</td></tr>')+'</tbody>'+(foot?'<tfoot>'+foot+'</tfoot>':'')+'</table></div>'}
function tr(cells){return '<tr>'+cells.map(function(c,i){return '<td'+(i===0||(c&&c.l)?' class="l"':'')+'>'+(c&&c.h!==undefined?c.h:esc(c))+'</td>'}).join('')+'</tr>'}
function period(id,def){ /* shared date range control; returns {from,to} */
 var f=$(id+'_f'),t=$(id+'_t');return {from:f?f.value:'',to:t?t.value:''}}
function periodHTML(id,rerender,p){p=p||{};return '<div class="row noprint"><b>Period:</b> <input type="date" id="'+id+'_f" value="'+(p.from||'')+'" onchange="'+rerender+'"> to <input type="date" id="'+id+'_t" value="'+(p.to||'')+'" onchange="'+rerender+'"> '+
 '<button class="sm" onclick="setP(\''+id+'\',\'m\');'+rerender+'">This month</button><button class="sm" onclick="setP(\''+id+'\',\'lm\');'+rerender+'">Last month</button><button class="sm" onclick="setP(\''+id+'\',\'q\');'+rerender+'">This quarter</button><button class="sm" onclick="setP(\''+id+'\',\'y\');'+rerender+'">This FY</button><button class="sm" onclick="setP(\''+id+'\',\'a\');'+rerender+'">All</button></div>'}
function setP(id,k){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),a='',b='';
 if(k==='m'){a=iso(new Date(y,m,1));b=iso(new Date(y,m+1,0))}
 else if(k==='lm'){a=iso(new Date(y,m-1,1));b=iso(new Date(y,m,0))}
 else if(k==='q'){var qs=m>=3?Math.floor((m-3)/3)*3+3:9;var sy=m>=3?y:y-1;a=iso(new Date(sy,qs,1));b=iso(new Date(sy,qs+3,0))}
 else if(k==='y'){var f=fy();a=f.from;b=f.to}
 $(id+'_f').value=a;$(id+'_t').value=b}
/* storage, backup, restore */
var KEY=window.LEDGER_KEY,D=null;
function loadD(def){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v)return d}catch(e){}return def}
function saveD(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Could not save: '+e.message+'. Download a backup now.',true)}}
function backup(){download(KEY+'_backup_'+today()+'.json',JSON.stringify(D),'application/json');toast('Backup downloaded. Keep it safe (Google Drive / pen drive).')}
function restoreFile(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!d.v||!d.shop)throw new Error('This is not a backup file of this ledger.');
 if(!confirm('Replace ALL current data with this backup ('+f.name+')?'))return;D=d;saveD();APP.go(APP.tab);toast('Backup restored.')}catch(e){toast(e.message,true)}};r.readAsText(f);ev.target.value=''}
function printHTML(html){$('print').innerHTML=html;document.body.classList.add('printing');window.print();setTimeout(function(){$('print').innerHTML=''},500)}
window.addEventListener('beforeunload',function(){});

</script>
<script>
/* ===== Insurance ledger engine ===== */
var CFG=window.LEDGER_CFG;
D=loadD({v:1,shop:{name:'',phone:'',code:'',gstin:'',addr:''},set:{renewDays:30,gst:18,pre:'RC',note:''},policies:[],coll:[],dep:[],comm:[],exp:[],seq:1,rno:1});
var TABS=[['dash','Dashboard & Renewals'],['pol','Policies'],['coll','Premium Collection'],['dep','Deposit to Company'],['comm','Commission & GST'],['exp','Transport & Expenses'],['rep','Reports'],['set','Settings']];
var TYPES=['Life','Term plan','Health','Motor – Two wheeler','Motor – Four wheeler','Motor – Commercial','Home / Fire','Travel','Crop (PMFBY)','Personal accident','Other'];
var MODES={'Monthly':1,'Quarterly':3,'Half-yearly':6,'Yearly':12,'Single premium':0};
var STATUS=['Active','Lapsed','Matured / Closed','Cancelled'];
var ICATS=['Transport – Travel / fuel','Transport – Vehicle repair','Courier / Parcel','Mobile / Internet','Office rent','Printing / Stationery','Staff / Commission paid','Licence / Training','Marketing / Gifts','Other'];

function polById(id){for(var i=0;i<D.policies.length;i++)if(D.policies[i].id===id)return D.policies[i];return null}
function msel(id,v){return '<select id="'+id+'">'+['Cash','UPI','Card','Bank transfer','Cheque','Online (company portal)'].map(function(m){return '<option'+(m===v?' selected':'')+'>'+m+'</option>'}).join('')+'</select>'}
function expAmt(e){var b=N(e.amt),g=R2(b*N(e.gst)/100);return {base:b,gst:g,tot:R2(b+g)}}
function opts(arr,v){return arr.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function companies(){return uniq(D.policies.map(function(p){return p.company}).concat(D.dep.map(function(d){return d.company})).concat(D.comm.map(function(d){return d.company}))).sort()}
function dueTag(d){var n=daysTo(d);if(n===null)return '';if(n<0)return '<span class="tag t-red">Overdue '+(-n)+'d</span>';if(n===0)return '<span class="tag t-red">Due today</span>';if(n<=7)return '<span class="tag t-yel">in '+n+' days</span>';if(n<=D.set.renewDays)return '<span class="tag t-blu">in '+n+' days</span>';return '<span class="tag t-grn">'+n+' days</span>'}
function waLink(p){var m=String(p.mobile||'').replace(/\D/g,'');if(m.length===10)m='91'+m;if(m.length<11)return '';var sh=D.shop,txt='Dear '+p.client+', your '+p.type+' policy '+(p.polNo?'no. '+p.polNo+' ':'')+'('+p.company+') premium of ₹'+R2(p.prem)+' is due on '+dfmt(p.due)+'. Please pay on time to keep the policy active. – '+(sh.name||'')+(sh.phone?' '+sh.phone:'');return 'https://wa.me/'+m+'?text='+encodeURIComponent(txt)}
function accrued(c){return N(c.comm)}
function collected(co){return R2(sum(D.coll.filter(function(c){return !co||c.company===co}),function(c){return N(c.amt)}))}
/* ===== DASHBOARD ===== */
APP={tab:'dash',R:{},go:function(t){APP.tab=t;[].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.className=b.getAttribute('data-t')===t?'on':''});$('view').innerHTML='';try{APP.R[t]()}catch(e){console.error(e);$('view').innerHTML='<div class="box"><b class="neg">Something went wrong in this screen: '+esc(e.message)+'</b><p class="note">Your data is safe. Press Ctrl+F5. If it repeats, download a Backup and tell us.</p></div>'}window.scrollTo(0,0)}};
function printView(title){var v=$('view').cloneNode(true);[].forEach.call(v.querySelectorAll('.noprint'),function(e){e.remove()});printHTML('<h2>'+esc(D.shop.name||CFG.title)+'</h2><h3>'+esc(title)+' &nbsp; <small>'+dfmt(today())+'</small></h3>'+v.innerHTML)}
APP.R.dash=function(){var t=today(),m=monthKey(t),act=D.policies.filter(function(p){return p.status==='Active'&&p.due}),lim=addDays(t,N(D.set.renewDays)),over=act.filter(function(p){return p.due<t}),soon=act.filter(function(p){return p.due>=t&&p.due<=lim}),list=over.concat(soon).sort(function(a,b){return a.due<b.due?-1:1});
 var cm=sum(D.coll.filter(function(c){return monthKey(c.date)===m}),function(c){return N(c.amt)}),dm=sum(D.dep.filter(function(c){return monthKey(c.date)===m}),function(c){return N(c.amt)}),pend=R2(collected()-sum(D.dep,function(d){return N(d.amt)})),acc=R2(sum(D.coll,accrued)),rec=R2(sum(D.comm,function(c){return N(c.amt)}));
 var ends=D.policies.filter(function(p){return p.status==='Active'&&p.expiry&&p.expiry>=t&&p.expiry<=lim&&p.expiry!==p.due});
 var h='<div class="cards"><div class="card"><small>Active policies</small><b>'+act.length+'</b></div><div class="card"><small>Overdue premiums</small><b class="'+(over.length?'neg':'pos')+'">'+over.length+'</b><small>'+INR(sum(over,function(p){return N(p.prem)}))+'</small></div><div class="card"><small>Due in next '+D.set.renewDays+' days</small><b class="warn">'+soon.length+'</b><small>'+INR(sum(soon,function(p){return N(p.prem)}))+'</small></div><div class="card"><small>Collected this month</small><b>'+INR(cm)+'</b></div><div class="card"><small>Deposited to companies (month)</small><b>'+INR(dm)+'</b></div><div class="card"><small>Premium pending to deposit</small><b class="'+(pend>0.5?'warn':'pos')+'">'+INR(pend)+'</b></div><div class="card"><small>Commission earned (accrued)</small><b>'+INR(acc)+'</b></div><div class="card"><small>Commission pending from companies</small><b class="'+(acc-rec>0.5?'warn':'pos')+'">'+INR(acc-rec)+'</b></div></div>';
 if(!D.policies.length)h+='<div class="box"><h2>👋 Welcome</h2><p>Start with <b>Settings</b> (agency name), then add clients in <b>Policies</b>. Collect premium in <b>Premium Collection</b>, deposit it in <b>Deposit to Company</b> and note commission in <b>Commission &amp; GST</b>. Or press <button class="sm pri" onclick="loadSample()">Load sample data</button> to try everything first.</p></div>';
 h+='<div class="box"><h2>🔔 Renewal reminders (overdue and next '+D.set.renewDays+' days)</h2>'+table(['Client','~Mobile','~Company','~Policy','Premium','~Due date','~Status',''],list.map(function(p){var w=waLink(p);return tr([{l:1,h:'<b>'+esc(p.client)+'</b>'},{l:1,h:esc(p.mobile||'')},{l:1,h:esc(p.company)},{l:1,h:esc(p.type+(p.polNo?' · '+p.polNo:''))},INR(p.prem),{l:1,h:dfmt(p.due)},{l:1,h:dueTag(p.due)},{h:'<button class="sm pri" onclick="collForm('+p.id+')">Collect</button> '+(w?'<a class="sm" style="background:#16a34a;color:#fff;border-radius:6px;padding:4px 8px;text-decoration:none;font-size:11px;font-weight:700" target="_blank" rel="noopener" href="'+w+'">WhatsApp</a>':'<span class="mut">no mobile</span>')}])}))+'<p class="note">“WhatsApp” opens a ready message to the client. Press Send in WhatsApp.</p></div>';
 if(ends.length)h+='<div class="box"><h2>Policies ending / maturing soon</h2>'+table(['Client','~Company','~Policy','~Ends on'],ends.map(function(p){return tr([{l:1,h:esc(p.client)},{l:1,h:esc(p.company)},{l:1,h:esc(p.type+(p.polNo?' · '+p.polNo:''))},{l:1,h:dfmt(p.expiry)+' '+dueTag(p.expiry)}])}))+'</div>';
 $('view').innerHTML=h};
/* ===== POLICIES ===== */
